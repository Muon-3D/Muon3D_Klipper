# Perform continuous integration tests on updates and pull requests
name: Build test
# MUON: upstream is `on: [push, pull_request]` with no branch filter on either,
# so any commit pushed to a branch that also has an open pull request builds
# twice. Measured over 2026-08-08 to 2026-09-07: 177 runs over 93 distinct
# commits, 84 of which ran exactly twice. This repository is public, so the
# minutes are free; the duplicate check rollup is not -- it doubles the red on
# every open pull request, and there are a lot of them.
#
# Filtering `push` to the default branch builds every commit exactly once: on
# `master` by `push`, everywhere else by `pull_request`. The deliberate cost is
# that a branch with no open pull request now gets no CI at all, which is the
# same trade MuonOS's pipeline already makes. KAN-337.
on:
  push:
    branches: [master]
  pull_request:

# A newer commit on the same pull request cancels the run it supersedes.
concurrency:
  group: build-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # MUON: runs-on is the bigbox pool (`vars.LINUX_RUNS_ON`, else the
    # `muon-ci` labels): Muon runs no CI on GitHub-hosted runners, public
    # repositories included (Jack, 28 Oct). As in Moonraker's test-code.yaml,
    # the job runs only for a push here or a pull request from a branch of
    # this repository. That `if` is not the security boundary, because a
    # fork's pull request runs the workflow file from its own branch: the
    # repository's "Require approval for all external contributors" setting
    # is, and it must be on before bigbox serves this repository. The runner
    # has no sudo, so ci-install.sh needs its apt packages on the host.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.LINUX_RUNS_ON || '["self-hosted","muon-ci"]') }}
    steps:
    - uses: actions/checkout@v3
      with:
        # MUON: the whitespace check needs a merge base to diff against,
        # and the default shallow clone has no history to find one in.
        fetch-depth: 0

    - name: Setup cache
      uses: actions/cache@v3
      with:
        path: ci_cache
        key: ${{ runner.os }}-build-${{ hashFiles('scripts/ci-install.sh') }}

    # MUON: the runner image moved to Ubuntu 26.04, whose python3 is 3.14. The
    # pinned greenlet (3.1.1) cannot compile there, so the test venv was
    # unbuildable and every PR went red. Pin 3.11 (Debian bookworm, what the
    # printer ships) so CI tests what ships; ci-install.sh's `virtualenv -p
    # python3` then picks it up from PATH.
    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Prepare tests
      run: ./scripts/ci-install.sh

    - name: Test
      run: ./scripts/ci-build.sh 2>&1

    - name: Upload micro-controller data dictionaries
      uses: actions/upload-artifact@v4
      with:
        name: data-dict
        path: ci_build/dict
        # Debug copy for people to download; the org artifact quota is shared, so do not keep it 90 days.
        retention-days: 7
