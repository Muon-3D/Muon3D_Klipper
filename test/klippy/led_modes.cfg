# Test config for the user LED modes (KAN-480): M1's led.cfg and
# led_modes.cfg against simulated neopixel chains, no motion hardware.

[include ../../core/M1/macros/led.cfg]

[include ../../core/M1/macros/led_modes.cfg]

[neopixel Left]
pin: gpio0
chain_count: 40

[neopixel Right]
pin: gpio1
chain_count: 40

# Fail the test unless the named effect's enabled flag is ENABLED.
[gcode_macro ASSERT_LED]
gcode:
    {% set got = printer["led_effect " ~ params.EFFECT].enabled|int %}
    {% if got != params.ENABLED|int %}
        {action_raise_error("ASSERT_LED %s: enabled=%d" % (params.EFFECT, got))}
    {% endif %}

# Fail the test unless led.cfg's recorded state is STATE.
[gcode_macro ASSERT_LED_STATE]
gcode:
    {% set got = printer["gcode_macro LED_TIMEOUT_STATE"].laststate %}
    {% if got != params.STATE %}
        {action_raise_error("ASSERT_LED_STATE: laststate=%s" % (got,))}
    {% endif %}

# Outside the tree: SAVE_VARIABLE writes this file.
[save_variables]
filename: /tmp/klippy_test_led_modes_variables.cfg

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
