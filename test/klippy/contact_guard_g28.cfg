# contact_guard under an M1-style G28 macro: the axis helper backs Y off
# with a plain G1 while the load cell still reads the tap press (KAN-573)
[include contact_guard.cfg]

[homing_scope]

[gcode_macro G28]
rename_existing: G28.1
gcode:
  G28.1 {rawparams}
  # The press against the Y end after a tap home, as _HOME_X meets it.
  # This printer homes Y at its minimum, so the back-off is +Y (the M1
  # homes Y at its maximum and backs off with Y-10).
  CONTACT_GUARD_SIMULATE LOAD=0 DURATION=0.5
  CONTACT_GUARD_SIMULATE LOAD=200000 DURATION=0.05
  G91
  G1 Y10 F4800
  G90
