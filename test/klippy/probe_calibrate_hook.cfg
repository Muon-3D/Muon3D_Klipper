# Test config for probe on_calibrate_gcode
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[probe]
pin: PH6
z_offset: 1.15
on_calibrate_gcode:
    {% set st = printer["gcode_macro _CAL_HOOK_STATE"] %}
    SET_GCODE_VARIABLE MACRO=_CAL_HOOK_STATE VARIABLE=runs VALUE={st.runs + 1}
    M117 on_calibrate_gcode ran

[gcode_macro _CAL_HOOK_STATE]
variable_runs: 0
gcode:

[gcode_macro _ASSERT_HOOK_RUNS]
gcode:
    {% set want = params.COUNT|int %}
    {% set got = printer["gcode_macro _CAL_HOOK_STATE"].runs|int %}
    {% if got != want %}
        {action_raise_error("on_calibrate_gcode ran %d times, expected %d" % (got, want))}
    {% endif %}

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
