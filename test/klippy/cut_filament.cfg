# Test config for KAN-1940: the M1's real CUT_FILAMENT, PRINT_END and
# CANCEL_PRINT under contact_guard, against a simulated printer.
#
# The macros under test are included from core/M1 as they ship. Batch mode
# has no load cell, so the hooks below feed what the M1's cell reads: the
# cutter press (a lateral load far above the contact threshold) once the Y
# push has run, and the residual it leaves once the toolhead is back off
# the cutter.
[include ../../core/M1/macros/filament.cfg]
[include ../../core/M1/macros/print.cfg]
[include ../../core/M1/macros/position.cfg]

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

# As core/M1/core.cfg, the cutter sits behind Y 0
[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_min: -10
position_max: 174
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: PK1
position_endstop: 0.0
position_min: -4
position_max: 160

# CUT_FILAMENT sets the X and Y currents and reads run_current back. The
# B1 drivers (core/M1/core.cfg), so the macro's tmc2241 lookup resolves.
[tmc2241 stepper_x]
cs_pin: PG0
run_current: 0.8

[tmc2241 stepper_y]
cs_pin: PG1
run_current: 0.8

[advanced_homing_movement]
axis: y
endstop_source: configured

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250
# Nothing heats in a simulation: PRINT_END's retract runs
min_extrude_temp: 0

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100

[virtual_sdcard]
path: test/klippy/cut_filament

[print_stats]

[pause_resume]

[display_status]

# As test/klippy/contact_guard.cfg: an M1-like preloaded cell, pressing
# lowers the raw counts
[load_cell_probe]
z_offset: 0
sensor_type: ads1220
cs_pin: PJ2
data_ready_pin: PJ3
speed: 4
sensor_orientation: inverted
safety_model: preloaded_max
trigger_percent: 10
reference_max_load_counts: -3000000

# The thresholds of core/M1/core.cfg
[contact_guard]
threshold_counts: 90000
on_time: 0.020
off_time: 0.050
holdoff_time: 0.5
baseline_time_constant: 1.0
baseline_band_counts: 22500
relock_time: 0.5
sync_below_z: 3.0

#####################################################################
# Stubs and load cell hooks
#####################################################################

[gcode_macro LED_COMPLETE]
gcode:

[gcode_macro M107]
gcode:

# The cutter press: after the Y push into the cutter the cell reads the
# lateral load KAN-1940 logged (571913 counts, threshold 90000) for the
# sweep. FAIL=1 on _CUT_TEST injects an error right after the push.
[gcode_macro AXIS_HOME_MOVE]
rename_existing: _AXIS_HOME_MOVE_REAL
gcode:
  _AXIS_HOME_MOVE_REAL {rawparams}
  {% if params.AXIS|default('')|upper == 'Y'
        and params.DIR|default('')|upper == 'MIN' %}
    _CUT_TEST_PRESSED
  {% endif %}

[gcode_macro _CUT_TEST_PRESSED]
gcode:
  {% set th = printer.toolhead %}
  SET_GCODE_VARIABLE MACRO=_CUT_TEST VARIABLE=pressed VALUE=1
  SET_GCODE_VARIABLE MACRO=_CUT_TEST VARIABLE=press_z VALUE={th.position.z}
  SET_GCODE_VARIABLE MACRO=_CUT_TEST VARIABLE=press_homed VALUE='"{th.homed_axes}"'
  CONTACT_GUARD_SIMULATE LOAD=571913 DURATION=0.1
  {% if printer["gcode_macro _CUT_TEST"].fail|int %}
    { action_raise_error("injected error in the cutter sequence") }
  {% endif %}

# Off the cutter: the first guard command after the press sees a residual
# offset under the threshold, as the cell reads once the toolhead has left
# the cutter (samples follow the queued motion, so after G1 Y10).
[gcode_macro SET_CONTACT_GUARD]
rename_existing: _SET_CONTACT_GUARD_REAL
gcode:
  {% if printer["gcode_macro _CUT_TEST"].pressed|int
        and params.ENABLE|default(0)|int == 1 %}
    SET_GCODE_VARIABLE MACRO=_CUT_TEST VARIABLE=pressed VALUE=0
    CONTACT_GUARD_SIMULATE LOAD=30000 DURATION=0.3
  {% endif %}
  _SET_CONTACT_GUARD_REAL {rawparams}

# PARK_PRINTER ends with M18: record where the park left the toolhead and
# what was homed before the motors go off
[gcode_macro M18]
rename_existing: M9018
gcode:
  {% set th = printer.toolhead %}
  SET_GCODE_VARIABLE MACRO=_CUT_TEST VARIABLE=parks VALUE={printer["gcode_macro _CUT_TEST"].parks + 1}
  SET_GCODE_VARIABLE MACRO=_CUT_TEST VARIABLE=park_pos VALUE='"{"%.3f,%.3f,%.3f" % (th.position.x, th.position.y, th.position.z)}"'
  SET_GCODE_VARIABLE MACRO=_CUT_TEST VARIABLE=park_homed VALUE='"{th.homed_axes}"'
  M9018

# PRINT_END's M84 runs after _PRINT_END_PARK, even when the park raised:
# log the guard state there (test/contact_guard/test_cut_filament_error.py)
[gcode_macro M84]
rename_existing: M9084
gcode:
  {% set g = printer.contact_guard %}
  { action_respond_info("cut-test: at M84 enabled=%d active=%d"
                        % (g.enabled|int, g.active|int)) }
  M9084

#####################################################################
# Recording and assertions
#####################################################################

[gcode_macro _CUT_TEST]
variable_fail: 0
variable_pressed: 0
variable_press_z: -1.0
variable_press_homed: ''
variable_parks: 0
variable_park_pos: ''
variable_park_homed: ''
gcode:
  SET_GCODE_VARIABLE MACRO=_CUT_TEST VARIABLE=fail VALUE={params.FAIL|default(0)|int}
  SET_GCODE_VARIABLE MACRO=_CUT_TEST VARIABLE=pressed VALUE=0
  SET_GCODE_VARIABLE MACRO=_CUT_TEST VARIABLE=press_z VALUE=-1.0
  SET_GCODE_VARIABLE MACRO=_CUT_TEST VARIABLE=press_homed VALUE='""'
  SET_GCODE_VARIABLE MACRO=_CUT_TEST VARIABLE=parks VALUE=0
  SET_GCODE_VARIABLE MACRO=_CUT_TEST VARIABLE=park_pos VALUE='""'
  SET_GCODE_VARIABLE MACRO=_CUT_TEST VARIABLE=park_homed VALUE='""'

# The cutter push ran with Z homed at PRESS_Z, and PARK_PRINTER parked once
# (so no cutter move was refused) at PARK_POS with HOMED still homed.
# CANCEL_PRINT from a print file, then the cut and guard checks. One file
# line: CANCEL_PRINT stops the file after the line it is on.
[gcode_macro _CUT_TEST_CANCEL]
gcode:
  CANCEL_PRINT
  ASSERT_CUT PRESS_Z={params.PRESS_Z} PARK_POS={params.PARK_POS}
  # The cutter's residual was re-zeroed: the same reading is now no load
  CONTACT_GUARD_SIMULATE LOAD=30000 DURATION=0.1
  ASSERT_GUARD ENABLED=1 ACTIVE=1 CONTACT=0 MAX_LOAD=1000

[gcode_macro ASSERT_CUT]
gcode:
  {% set t = printer["gcode_macro _CUT_TEST"] %}
  {% if t.press_homed != "xyz" %}
    { action_raise_error("homed at the cutter push: '%s', expected xyz"
                         % t.press_homed) }
  {% endif %}
  {% if (t.press_z|float - params.PRESS_Z|float)|abs > 0.001 %}
    { action_raise_error("Z at the cutter push is %s, expected %s"
                         % (t.press_z, params.PRESS_Z)) }
  {% endif %}
  {% if t.parks|int != 1 %}
    { action_raise_error("PARK_PRINTER parked %s times, expected 1 (a"
                         " cutter move was refused)" % t.parks) }
  {% endif %}
  {% if t.park_pos != params.PARK_POS %}
    { action_raise_error("parked at %s, expected %s"
                         % (t.park_pos, params.PARK_POS)) }
  {% endif %}
  {% if t.park_homed != "xyz" %}
    { action_raise_error("homed at the park: '%s', expected xyz"
                         % t.park_homed) }
  {% endif %}

[gcode_macro ASSERT_GUARD]
gcode:
  {% set g = printer.contact_guard %}
  {% for key in ['enabled', 'active', 'contact'] %}
    {% if params[key|upper] is defined
          and (g[key]|int) != (params[key|upper]|int) %}
      { action_raise_error("contact_guard.%s is %s, expected %s (load %s)"
                           % (key, g[key], params[key|upper], g.load)) }
    {% endif %}
  {% endfor %}
  {% if params.MAX_LOAD is defined and g.load|abs > params.MAX_LOAD|int %}
    { action_raise_error("contact_guard.load is %s, expected at most %s"
                         % (g.load, params.MAX_LOAD)) }
  {% endif %}
