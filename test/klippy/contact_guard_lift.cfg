# contact_guard.cfg with the M1 G28 macro's opening Z lift: Z faked
# homed, AXIS_PROTECTED_MOVE Z+10 (an open-loop homing move), fake
# cleared, then the homing itself, all in one homing_scope
[include contact_guard.cfg]

[homing_scope]

[advanced_homing_movement]
axis: z
endstop_source: configured

[gcode_macro G28]
rename_existing: G28.1
gcode:
  SET_KINEMATIC_POSITION Z=100 SET_HOMED=Z
  AXIS_PROTECTED_MOVE AXIS=Z DIST=10
  SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
  G28.1 {rawparams}
