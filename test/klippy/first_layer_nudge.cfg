# Offline harness for the shipped M1 first-layer nudge macro.
[include ../../core/M1/macros/first_layer_nudge.cfg]

[virtual_sdcard]
path: test/klippy/first_layer_nudge
on_error_gcode: ASSERT_REFUSAL_UNCHANGED

[pause_resume]
[display_status]
[respond]
[print_stats]

[homing_override]
axes: xyz
set_position_x: 0
set_position_y: 0
set_position_z: 5
gcode:
  G92 X0 Y0 Z5

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200000000

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 110

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[gcode_macro ASSERT_NUDGE]
gcode:
  {% set n = printer["gcode_macro FIRST_LAYER_NUDGE"] %}
  {% if params.NET is defined and (n.last_reported_net|float - params.NET|float)|abs > 0.000001 %}
    {action_raise_error("nudge net is %.6f, expected %s" % (n.last_reported_net|float, params.NET))}
  {% endif %}
  {% if params.BASELINE is defined and (n.baseline_z_offset|float - params.BASELINE|float)|abs > 0.000001 %}
    {action_raise_error("nudge baseline is %.6f, expected %s" % (n.baseline_z_offset|float, params.BASELINE))}
  {% endif %}
  {% if params.Z is defined and (printer.gcode_move.homing_origin.z|float - params.Z|float)|abs > 0.000001 %}
    {action_raise_error("Z homing origin is %.6f, expected %s" % (printer.gcode_move.homing_origin.z|float, params.Z))}
  {% endif %}
  {% if params.ARMED is defined and n.armed|int != params.ARMED|int %}
    {action_raise_error("nudge armed is %d, expected %s" % (n.armed|int, params.ARMED))}
  {% endif %}

[gcode_macro EXPECT_REFUSAL]
variable_z: 0.0
variable_baseline: 0.0
variable_net: 0.0
variable_armed: 0
variable_armed_after: -1
gcode:
  {% set n = printer["gcode_macro FIRST_LAYER_NUDGE"] %}
  SET_GCODE_VARIABLE MACRO=EXPECT_REFUSAL VARIABLE=z VALUE={printer.gcode_move.homing_origin.z|float}
  SET_GCODE_VARIABLE MACRO=EXPECT_REFUSAL VARIABLE=baseline VALUE={n.baseline_z_offset|float}
  SET_GCODE_VARIABLE MACRO=EXPECT_REFUSAL VARIABLE=net VALUE={n.last_reported_net|float}
  SET_GCODE_VARIABLE MACRO=EXPECT_REFUSAL VARIABLE=armed VALUE={n.armed|int}
  SET_GCODE_VARIABLE MACRO=EXPECT_REFUSAL VARIABLE=armed_after VALUE={params.ARMED_AFTER|default(-1)|int}

[gcode_macro ASSERT_REFUSAL_UNCHANGED]
gcode:
  {% set expected = printer["gcode_macro EXPECT_REFUSAL"].z|float %}
  {% set actual = printer.gcode_move.homing_origin.z|float %}
  {% set saved = printer["gcode_macro EXPECT_REFUSAL"] %}
  {% set n = printer["gcode_macro FIRST_LAYER_NUDGE"] %}
  {% if (n.baseline_z_offset|float - saved.baseline|float)|abs > 0.000001 %}
    {action_raise_error("refused nudge changed its baseline")}
  {% endif %}
  {% if (n.last_reported_net|float - saved.net|float)|abs > 0.000001 %}
    {action_raise_error("refused nudge changed its last reported net")}
  {% endif %}
  {% set expected_armed = saved.armed_after|int if saved.armed_after|int >= 0 else saved.armed|int %}
  {% if n.armed|int != expected_armed %}
    {action_raise_error("refused nudge changed armed state")}
  {% endif %}
  {% if (actual - expected)|abs > 0.000001 %}
    {action_raise_error("refused nudge changed Z homing origin from %.6f to %.6f" % (expected, actual))}
  {% endif %}

[gcode_macro TEST_ARM_NUDGE]
gcode:
  _FIRST_LAYER_NUDGE_ALLOW_RESET
  _FIRST_LAYER_NUDGE_RESET

[gcode_macro CANCEL_PRINT]
rename_existing: _KLIPPER_CANCEL_PRINT
gcode:
  _FIRST_LAYER_NUDGE_DISARM
  _KLIPPER_CANCEL_PRINT

[gcode_macro RUN_BYPASS_CANCEL_PART]
variable_run: 0
gcode:
  {% if run|int == 0 %}
    SET_GCODE_VARIABLE MACRO=RUN_BYPASS_CANCEL_PART VARIABLE=run VALUE=1
    G28
    # Stand in for the completed PRINT_START without making the production
    # macro's sequencing helpers into an access-control claim.
    TEST_ARM_NUDGE
    SET_PRINT_STATS_INFO TOTAL_LAYER=100 CURRENT_LAYER=1
    _KLIPPER_CANCEL_PRINT
  {% else %}
    G28
    SET_PRINT_STATS_INFO TOTAL_LAYER=100 CURRENT_LAYER=1
    ASSERT_NUDGE NET=0 BASELINE=0 Z=0 ARMED=1
    EXPECT_REFUSAL ARMED_AFTER=0
    FIRST_LAYER_NUDGE DIRECTION=CLOSER
  {% endif %}

[gcode_macro TEST_PAUSE_AND_NUDGE]
gcode:
  PAUSE
  FIRST_LAYER_NUDGE DIRECTION=CLOSER

[gcode_macro PRINT_END]
gcode:
  _FIRST_LAYER_NUDGE_DISARM
