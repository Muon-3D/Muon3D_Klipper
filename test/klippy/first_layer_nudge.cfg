# Offline harness for the shipped M1 first-layer nudge macro.
[include ../../core/M1/macros/first_layer_nudge.cfg]

[virtual_sdcard]
path: test/klippy/first_layer_nudge

[pause_resume]
[display_status]
[respond]
[print_stats]

[homing_override]
axes: xyz
set_position_x: 0
set_position_y: 0
set_position_z: 5
gcode:
  G92 X0 Y0 Z5

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200000000

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 110

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[gcode_macro ASSERT_NUDGE]
gcode:
  {% set n = printer["gcode_macro FIRST_LAYER_NUDGE"] %}
  {% if (n.net_adjustment|float - params.NET|float)|abs > 0.000001 %}
    {action_raise_error("nudge net is %.6f, expected %s" % (n.net_adjustment|float, params.NET))}
  {% endif %}
  {% if params.BASELINE is defined and (n.baseline_z_offset|float - params.BASELINE|float)|abs > 0.000001 %}
    {action_raise_error("nudge baseline is %.6f, expected %s" % (n.baseline_z_offset|float, params.BASELINE))}
  {% endif %}
