# Test config for bed_mesh no-go boundary snapping (KAN-468). The [bed_mesh]
# point settings are the M1's (core/M1/core.cfg): its region and grid, and
# the notch at the front of the bed with its snapping tolerance.
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

# activate_gcode runs before every probe, with the toolhead already at the
# point, so it records the path the probe actually took.
[probe]
pin: PC7
z_offset: 0
activate_gcode:
  _RECORD_PROBE_XY

[bed_mesh]
speed: 250
horizontal_move_z: 5
mesh_min: 10, 7
mesh_max: 190, 170
probe_count: 4, 3
algorithm: lagrange
no_go_traverse_z: 6
no_go_region_1_min: 75, 0
no_go_region_1_max: 125, 34
no_go_boundary_tolerance: 10

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[gcode_macro _RECORD_PROBE_XY]
variable_path: []
gcode:
  {% set me = printer["gcode_macro _RECORD_PROBE_XY"] %}
  {% set pos = printer.toolhead.position %}
  {% set path = me.path + ["%.2f,%.2f" % (pos.x, pos.y)] %}
  SET_GCODE_VARIABLE MACRO=_RECORD_PROBE_XY VARIABLE=path VALUE='{path|tojson}'

[gcode_macro RESET_PROBE_PATH]
gcode:
  SET_GCODE_VARIABLE MACRO=_RECORD_PROBE_XY VARIABLE=path VALUE="[]"

# PATH is the expected probe path as x,y/x,y/... (';' would start a comment).
[gcode_macro ASSERT_PROBE_PATH]
gcode:
  {% set got = printer["gcode_macro _RECORD_PROBE_XY"].path|join("/") %}
  {% if got != params.PATH %}
    { action_raise_error("probed '%s', expected '%s'" % (got, params.PATH)) }
  {% endif %}

# The mesh must sit on the requested grid, whatever the probe was moved to.
[gcode_macro ASSERT_MESH]
gcode:
  {% set bm = printer.bed_mesh %}
  {% set got = "%.2f,%.2f %.2f,%.2f %dx%d" % (
      bm.mesh_min[0], bm.mesh_min[1], bm.mesh_max[0], bm.mesh_max[1],
      bm.probed_matrix[0]|length, bm.probed_matrix|length) %}
  {% if got != params.WANT %}
    { action_raise_error("mesh is '%s', expected '%s'" % (got, params.WANT)) }
  {% endif %}
