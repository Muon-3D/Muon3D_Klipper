# Test config for the Muon B1 toolhead ADS1220 shared by the load cell probe
# and the hotend sensor (B1 toolhead pins, everything on one rp2040)
[stepper_x]
step_pin: gpio4
dir_pin: gpio5
enable_pin: !gpio6
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio19
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: gpio8
dir_pin: gpio9
enable_pin: !gpio10
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio21
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: gpio12
dir_pin: gpio13
enable_pin: !gpio14
microsteps: 16
rotation_distance: 8
endstop_pin: gpio18
position_endstop: 0.0
position_max: 200

[muon_ads1220 toolhead]
cs_pin: gpio7
spi_bus: spi0_gpio20_gpio23_gpio22
high_side_pin: !gpio2

[temperature_sensor heatsink]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio29

[extruder]
step_pin: gpio15
dir_pin: gpio16
enable_pin: !gpio17
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio11
sensor_type: muon_hotend
muon_ads1220: toolhead
heatsink_sensor: temperature_sensor heatsink
ntc_pid_Kp: 17.485
ntc_pid_Ki: 1.85
ntc_pid_Kd: 41.308
control: pid
pid_Kp: 17.485
pid_Ki: 1.85
pid_Kd: 41.308
min_temp: -70
max_temp: 350

[load_cell_probe]
sensor_type: muon_ads1220
muon_ads1220: toolhead
z_offset: 0
speed: 4.0
samples: 2
sample_retract_dist: 0.4
counts_per_gram: 100
reference_tare_counts: 1000
drift_filter_cutoff_frequency: 0.8
buzz_filter_cutoff_frequency: 100.0
notch_filter_frequencies: 50, 60

[bed_mesh]
mesh_min: 10,10
mesh_max: 180,180

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
