# Test config for z_power
[include ../../config/example-cartesian.cfg]

# z_power takes plate presence from [bed_removal_detector] and refuses to
# start without one (ea9131ac6). Module defaults; it reads heater_bed.
[bed_removal_detector]

[z_power]
enable_pin: PC0
power_good_pin: PC1
present_pin: PF3
current_pin: PF4
present_absent_range: 0.90, 1.0
present_unlocked_range: 0.40, 0.60
present_locked_range: 0.0, 0.20
lost_gcode:
  RESPOND MSG="bed power lost"
fault_gcode:
  RESPOND MSG="bed power fault"
