# Test config for muon_guard (KAN-1730): the shipped example config plus a
# guard whose allowlist is written the way core/M1/core.cfg writes it.
[include ../../config/example-cartesian.cfg]

# A macro a client may start. What it runs inside is not on the allowlist.
[gcode_macro CLIENT_MACRO]
variable_x: 0
gcode:
  SET_GCODE_VARIABLE MACRO=CLIENT_MACRO VARIABLE=x VALUE=1
  G1 X20 Y20 F6000

# A macro whose client parameter is bounded in the allowlist
[gcode_macro BOUNDED_MACRO]
gcode:
  G1 X{params.X|default(10)|float} F6000

# KAN-1733: fails the test if a client's SET_VELOCITY_LIMIT or M204 left the
# toolhead above example-cartesian.cfg's max_velocity 500, max_accel 3000
[gcode_macro CHECK_LIMITS]
gcode:
  {% if printer.toolhead.max_velocity > 500 or printer.toolhead.max_accel > 3000 %}
    { action_raise_error("toolhead limits above the config: %s %s" % (printer.toolhead.max_velocity, printer.toolhead.max_accel)) }
  {% endif %}

[muon_guard]
dev_config_path: /nonexistent/devmode/core.cfg
client_allow:
  # Motion
  G28
  G90
  G1   # an inline comment
  M114
  CLIENT_MACRO
  BOUNDED_MACRO X=0..100
  G21
  SET_VELOCITY_LIMIT
  M204
  CHECK_LIMITS
  # A parameter constraint, quoted
  HOMING_GATE "CALLBACK=G28 *"
