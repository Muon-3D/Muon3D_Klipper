# Test config for fan_modes with a speed_table (curves in rpm)
[include ../../config/example-cartesian.cfg]

[fan]
pin: PH6

[fan_modes]
fan: fan
modes: normal, quiet, turbo
default_mode: normal
speed_table:
  3408:0.0824, 7729:0.1176, 13680:0.2000,
  18277:0.3020, 23600:0.5020, 31500:1.0
normal_curve: 0:0, 0.01:3408, 1:18277
quiet_curve: 0:0, 0.01:3408, 1:13680
turbo_curve: 0:0, 0.01:3408, 1:31500
