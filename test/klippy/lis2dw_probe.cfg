# Test config for adxl345_probe X/Y tap homing on a LIS2DW12 (M1 B1)
[stepper_x]
step_pin: gpio17
dir_pin: !gpio16
enable_pin: !gpio15
microsteps: 64
rotation_distance: 40
homing_retract_dist: 0
position_endstop: 200
homing_positive_dir: True
position_max: 200.1
endstop_pin: adxl345_probe:x_virtual_endstop
homing_speed: 60

[stepper_y]
step_pin: gpio7
dir_pin: gpio8
enable_pin: !gpio9
microsteps: 64
rotation_distance: 40
homing_retract_dist: 0
position_endstop: 200
homing_positive_dir: True
position_max: 200.1
endstop_pin: adxl345_probe:y_virtual_endstop
homing_speed: 60

[stepper_z]
step_pin: gpio10
dir_pin: gpio11
enable_pin: !gpio12
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpio13
position_endstop: 0.5
position_max: 200

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

# B1 toolhead wiring: CS on gpio25, INT1 on gpio21 (A1 has them swapped).
# The axes_map is deliberately not x,y,z so the tap enables are remapped.
[lis2dw]
cs_pin: gpio25
spi_bus: spidev0.0
axes_map: y,-x,z

[adxl345_probe]
chip: lis2dw
probe_pin: gpio21
int_pin: int1
lis2dw_tap_event: single_tap
lis2dw_odr: 1600
lis2dw_full_scale: 4
tap_thresh: 15000
tap_dur: 0.015
homing_tap_arm_delay: 0.1
x_tap_thresh: 20000
x_tap_axes: x
y_tap_thresh: 15000
y_tap_axes: y
enable_z_probe: False
tap_confirm_samples: 2
tap_confirm_retract_dist: 8
x_tap_confirm_samples: 3
x_tap_confirm_tolerance: 0.1
y_tap_confirm_speed: 40
