[nozzle_wipe_smart]
# Blocking Python implementation. This registers NOZZLE_WIPE_SMART and
# NOZZLE_WIPE_SMART_STOP.

x: 100.0
y: 13.5
z_top: 4.3
plunge: 1.2
sx: 9.0
sy: 2.0
passes: 5
f_travel: 7800.0
f_wipe: 2000.0
z_speed: 200.0
z_hop: 5.0

start_temp: 170.0
wipe_temp: 200.0
wipe_temp_tolerance: 5.0
stop_temp: 160.0
fan_off_temp: 160.0
# MUON B0: this was 0.20 through M106, which the normal print mode's curve
# turned into about 10.4 % blower duty on B0. nozzle_wipe_smart.py now sends
# M106.1 (raw duty), so 0.20 would double the draught on the bed thermistor
# ([verify_heater heater_bed] in core.cfg is sized for the old one). 0.104
# keeps the old duty.
fan_pct: 0.104

poll_ms: 1000
max_iter: 2000
