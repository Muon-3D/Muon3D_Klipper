[load_cell_probe]
# --- Sensor (ADS1220) ---
sensor_type: ads1220
cs_pin: toolhead:gpio7
spi_speed: 512000
spi_bus: spi0_gpio20_gpio23_gpio22
data_ready_pin: toolhead:gpio14
gain: 64
sample_rate: 2000
input_mux: AIN0_AIN1
vref: REF0
sensor_orientation: inverted

# --- Preloaded-max model (active) ---
safety_model: preloaded_max
trigger_percent: 10
max_load_safety_margin_percent: 5.0
max_load_safety_margin_counts: 0   # 0 = use percent margin above
# reference_max_load_counts is set via LOAD_CELL_CALIBRATE_MAX + SAVE_CONFIG.

# --- Legacy gram-based options (disabled) ---
# force_safety_limit: 100
# trigger_force: 30
# counts_per_gram: ...
# reference_tare_counts: ...
# z_offset: 0.0  # nozzle is probe

# --- Probe behavior ---
tare_time: 0.04
speed: 4
samples: 2
sample_retract_dist: 0.4
lift_speed: 10
samples_result: average
samples_tolerance: 0.03
samples_tolerance_retries: 3

# --- Optional filtering (disabled) ---
# drift_filter_cutoff_frequency: 0.8
# drift_filter_delay: 2
# buzz_filter_cutoff_frequency: 100.0
# buzz_filter_delay: 2
# notch_filter_frequencies: 50, 60
# notch_filter_quality: 2.0

[skew_correction]
#autocalibrated by auto_skew in bed_mesh

[bed_mesh]
speed: 250
# KAN-219: 2 was not enough travel clearance for this bed. The probed surface
# spans 3.593 mm and peaks at +1.959 above the Z datum set by _LOAD_CELL_HOME_Z,
# so travel at 2.0 cleared the highest point by 0.041 mm and the nozzle audibly
# scratched across the whole y=170 row at 250 mm/s. bed_mesh is CLEARED during
# BED_MESH_CALIBRATE and the traverse is an absolute manual_move, so none of it
# is compensated.
#
# There is no z_tilt/bed_tilt/screws_tilt and one Z stepper on this machine: the
# bed is not levellable and absorbing its shape is what the mesh is for, so this
# value has to come from the bed's measured range rather than assume a flat bed.
#
# 5 gives 3.04 mm at the worst measured point. 4 would give 2.04 mm and cost
# less, but the 12 points sit on a 60 x 81.5 mm grid, so the surface BETWEEN
# nodes is unresolved and with ~1 mm of residual warp it can sit well above the
# interpolated value. Costs ~12.6 s of Z motion per mesh; KAN-218 (samples=1)
# removes ~30 s from the same operation.
horizontal_move_z: 5
mesh_min: 10, 7
mesh_max: 190, 170
probe_count: 4, 3
# fade_start: 1
# fade_end: 15
# fade_target: 0
adaptive_margin: 5
no_go_traverse_z: 6
no_go_region_1_min: 75, 0
no_go_region_1_max: 125, 34
no_go_boundary_tolerance: 10
auto_skew: True


[contact_guard]
# Refuses an XY move, for every client, on the KNOWN plate height: with Z
# homed and not invalidated since, only a move that goes below contact_z
# above the levelled bed (contact_z + unmeshed_margin with no bed mesh
# loaded); with the height not known it says "Home first". The load cell
# does not decide moves: on Boxwood (12 Nov 2026) it read -908000..+441000
# counts during plain XY moves with the plate 20 mm away. Jobs, homing and
# the brush wipe are never refused.
move_guard: height
contact_z: 0.1
# The plate peaks about 2 mm above the Z datum on a bad unit (KAN-219);
# PRINT_START loads the mesh, so this only limits jogs on an unlevelled bed,
# or outside the region the loaded mesh probed.
unmeshed_margin: 2.5
# With the height unknown, X and Y may still move once a homing move has
# lifted the plate this far (G28 lifts 10 mm first), until Z goes down,
# the motors go off or the bed comes off.
lift_clear_min: 5
# Everything below configures the load cell contact model. It still runs
# and reports (contact_guard.load, load_contact) but refuses nothing unless
# move_guard is load_cell.
# The unlock press (toolhead.cfg) leaves a filament-tension offset that
# reads as contact (KAN-742). The press does not move to clear it; any 1 mm
# Z lift with the load steady does (a jog, PRINT_END's lift, G28).
# Counts are raw load cell counts in the pressing direction. A probe tap at
# 4 mm/s triggers at about 181000 (trigger_percent 10 above), so contact
# firm enough to trigger a probe reads at twice the threshold.
threshold_counts: 90000
# On after 20 ms above the threshold; off after 50 ms below half of it.
# 20 ms is longer than the half period of the cell's 48 Hz ring.
on_time: 0.020
off_time: 0.050
# The cell rings for about 0.4 s after a tap; ignore it for 0.5 s.
holdoff_time: 0.5
# Tare drift (~9000 counts/s measured) is followed with a 1 s time constant
# while the load stays within the band; a load that sits outside the band
# for relock_time without becoming contact is drift, and is re-zeroed.
baseline_time_constant: 1.0
baseline_band_counts: 22500
relock_time: 0.5
# Below this Z an XY move waits for the moves queued ahead of it to run, so
# a descent onto the plate queued just before it is seen. The plate peaks
# about 2 mm above the Z datum (KAN-219); travel at 5 is never delayed.
sync_below_z: 3.0

[thermistor CMFD473F4050HANT]
temperature1: 25
resistance1: 47000
beta: 4150

[thermistor 104JT_XXXX]
