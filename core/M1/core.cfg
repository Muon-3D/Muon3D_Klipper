# Muon3D M1, pre-production batch B1 (branch feat/m1-b1-config).
# B1 supersedes the A1 alpha boards; this tree no longer matches A1 pinouts.
# Pin sources: B1 main-board RP2040 (U1), toolhead RP2040 (U3) and CM4
# schematics, cross-checked on Muon-gimlet-6741 on 2026-10-16.
[include macros/macros.cfg]

[virtual_sdcard]
path: /home/printer_data/gcodes
# Klipper's default on_error_gcode only turns the heaters off. A print file
# that dies on an error, PRINT_START's own lines included, also has to clear
# the PRINT_START phase it was publishing; see _ON_PRINT_ERROR in
# macros/print.cfg, which keeps the heaters-off.
on_error_gcode: _ON_PRINT_ERROR

[pause_resume]
[display_status]
[exclude_object]

# Klipper's default idle gcode is TURN_OFF_HEATERS then M84, and with no
# [idle_timeout] section that default applied to a paused print too. Ten
# minutes into a pause the hot end went cold AND the steppers dropped,
# which clears homed_axes -- so a resume after that fed a cold nozzle into
# a machine that no longer knew where it was. Nothing announced either.
#
# Paused is now its own case. The hot end is still shed, because a nozzle
# left at print temperature unattended cooks the filament sitting in the
# melt zone and drools onto whatever is under it -- that is the risk the
# timeout exists to cover and it does not go away just because a print is
# paused. What changes is the other two: the bed stays at target so the
# part keeps its adhesion, and M84 is not issued, so the print can still
# be resumed. RESUME puts the hot end back and waits for it before the
# toolhead moves -- see _RESUME_RESTORE_HOTEND and PAUSE's
# saved_hotend_target in macros/print.cfg.
#
# Not paused, this is Klipper's own DEFAULT_IDLE_GCODE, unchanged.
[idle_timeout]
timeout: 600
gcode:
    # Idle means no gcode is running, so no PRINT_START is either. Catches one
    # typed at the console that failed, which on_error_gcode does not see.
    _PRINT_START_PHASE_CLEAR
    {% if printer.pause_resume.is_paused %}
      M104 S0
      {action_respond_info("Paused 10 min: hot end off, RESUME reheats")}
    {% else %}
      TURN_OFF_HEATERS
      M84
    {% endif %}

# Generic cross restart store for calibration state, sits next to
# calibration.cfg in the writable calibration directory so a calibration wipe
# clears both together. Values are written with SAVE_VARIABLE and read back
# from printer.save_variables.variables.<name>
[save_variables]
filename: /home/printer_data/calibration/variables.cfg



[mcu]
serial: /dev/UART-MAIN
baud: 3000000#250000
restart_method: swdio
openocd_config: /opt/klipper/core/M1/firmware/openocd.main.config

[mcu rpi]
serial: /home/printer_admin/comms/klipper_host_mcu
restart_method: command

[mcu toolhead]
serial: /dev/UART-TOOLHEAD
baud: 3000000#250000
restart_method: swdio
openocd_config: /opt/klipper/core/M1/firmware/openocd.toolhead.config
is_non_critical: True
connect_macro: TOOLHEAD_CONNECT
disconnect_macro: TOOLHEAD_DISCONNECT

[printer]
kinematics: corexy
max_velocity: 800 #can go faster but at lower accelerations
max_accel: 20000#can go higher at higher currents,14000 #limited by input shaper
square_corner_velocity: 7#20 for higher speed prints
max_z_velocity: 15
max_z_accel: 1000



# B1: LIS2DW12TR on toolhead SPI0, CS0 = gpio25 (10k pull-up), INT1 = gpio21.
[lis2dw]
cs_pin: toolhead:gpio25
spi_bus: spi0_gpio20_gpio23_gpio22
axes_map: x,y,z
# TODO(B1): axis orientation is unverified on B1. Check with ACCELEROMETER_QUERY
# while tapping each axis and fix axes_map.

# TODO(B1): tap homing. [adxl345_probe] drove X/Y homing from the ADXL345 tap
# interrupt; the LIS2DW12 equivalent is in progress on its own branch. Until it
# lands, X/Y have no working endstop: do not run G28 on a B1 unit.

[resonance_tester]
accel_chip: lis2dw
probe_points:
    100,100, 20
min_freq: 30
max_freq: 110
hz_per_sec: 2
move_speed: 200

[input_shaper]
#shaper_type_x = mzv
#shaper_freq_x = 52.2
#shaper_type_y = zv
#shaper_freq_y = 77.8



[stepper_x]
step_pin: gpio17
dir_pin: !gpio16
enable_pin: !gpio15
microsteps: 64
rotation_distance: 40 #20t * 2mm gt2 pitch
full_steps_per_rotation: 200

#homing_retract_dist: 4 #disbaled due to https://github.com/Klipper3d/klipper/issues/1311
homing_retract_dist: 0
position_endstop: 200
homing_positive_dir: True #home at the right
position_max: 200.1

endstop_pin: tmc2241_stepper_x:virtual_endstop # TODO(B1): placeholder until LIS2DW tap homing
homing_speed: 60


# B1: TMC2241 drivers on CM4 SPI6 (spidev6.0/1/2), step/dir/enable/DIAG0 on the
# main RP2040. RREF = R114 12k. Motors: LDO-42STH25-1004AC (1.0 A, 3.5 ohm,
# 3.8 mH). Tuned for quiet and cool; EMI not yet considered (Harry, 2026-10-16):
# - StealthChop2 below stealthchop_threshold (stepper mm/s), SpreadCycle above;
#   pwm_autoscale/pwm_autograd tune StealthChop during motion.
# - slope_control 3 = 800 V/us, the least switching loss and the most EMI.
#   Step down to 2/1/0 if EMI testing needs it.
# - interpolate: MicroPlyer 64 -> 256 microsteps, quieter at no step-rate cost.
# - Chopper (toff/hstrt/hend/tbl/tpfd) at the tmc2241.py defaults.
# Measured on gimlet 2026-10-16 at 0.8 A, no driver fan: 54-63 C after 90 s.
[tmc2241 stepper_x]
cs_pin: rpi:None
spi_bus: spidev6.0
rref: 12000
run_current: 0.8
interpolate: True
stealthchop_threshold: 300
driver_SLOPE_CONTROL: 3
# 300 mm/s is a starting point: prove no skipped steps at 20000 accel.
diag0_pin: ^!gpio18

[stepper_y]
step_pin: gpio21
dir_pin: !gpio20
enable_pin: !gpio19
microsteps: 64
rotation_distance: 40 #34t * 2mm gt2 pitch
full_steps_per_rotation: 200
#homing_retract_dist: 4 #disbaled due to https://github.com/Klipper3d/klipper/issues/1311
homing_retract_dist: 0



homing_positive_dir: True
position_min: -10
position_endstop: 174
position_max: 174.1



endstop_pin: tmc2241_stepper_y:virtual_endstop # TODO(B1): placeholder until LIS2DW tap homing
homing_speed: 60



[tmc2241 stepper_y]
cs_pin: rpi:None
spi_bus: spidev6.1
rref: 12000
run_current: 0.8
interpolate: True
stealthchop_threshold: 300
driver_SLOPE_CONTROL: 3
diag0_pin: ^!gpio22

[stepper_z]
step_pin: gpio24
dir_pin: !gpio23
enable_pin: !gpio25

microsteps: 64
rotation_distance: 4 #4mm pitch leadscrew
gear_ratio: 12:20, 30:15
full_steps_per_rotation: 200

position_min: -4
position_max: 160

endstop_pin: toolhead:gpio4 #UNUSED PIN
#Load cell probe is not an endstop and doesn't support endstop: prove:z_virtual_endstop. For the time being you'll need to configure your z axis with an MCU pin as its endstop. You won't actually be using the pin but for the time being you have to configure something.
#https://www.klipper3d.org/Load_Cell.html#homing-macros
position_endstop: 0


[tmc2241 stepper_z]
cs_pin: rpi:None
spi_bus: spidev6.2
rref: 12000
run_current: 0.8
interpolate: True
stealthchop_threshold: 999999
driver_SLOPE_CONTROL: 3
# Z never exceeds max_z_velocity (15 mm/s), so StealthChop always.
# TUNING TODO(B1): the Z-max stall home ([advanced_homing_movement], the Z-up
# park before folding) now runs on StallGuard4. Tune driver_SGTHRS on the
# bench: raise it until a free move never trips, then confirm a stall at the
# top stop trips every time, cold and after a long print. The A1 TMC2130 value
# (driver_SGT: 1, SpreadCycle) does not carry over.
#driver_SGTHRS: 0
diag0_pin: ^!gpio3

# Each TMC2241's die temperature and VS supply reading, polled whether or not
# the motor is enabled (klippy/extras/tmc_driver_monitor.py). Must precede
# every sensor_type: tmc_driver section.
[tmc_driver_monitor]

[temperature_sensor driver_x]
sensor_type: tmc_driver
sensor_stepper: stepper_x

[temperature_sensor driver_y]
sensor_type: tmc_driver
sensor_stepper: stepper_y

[temperature_sensor driver_z]
sensor_type: tmc_driver
sensor_stepper: stepper_z

[advanced_homing_movement]
axis: z
stepper: stepper_z
driver: tmc2241
# Keep Z on TMC virtual endstop (stall) and use configured endstops on XY.
endstop_source_x: configured
endstop_source_y: configured
direction: max
speed: 15
retract: 10
retract_speed: 20
overshoot: 5


[load_cell_probe]
# --- Sensor (ADS1220) ---
sensor_type: ads1220
cs_pin: toolhead:gpio7
spi_speed: 512000
spi_bus: spi0_gpio20_gpio23_gpio22
# B1: the ADS1220 DRDY pin is not connected, so the MCU reads by timed RDATA
# (KAN-355). A dedicated B1 driver that shares the chip with the hotend
# temperature is in progress on its own branch.
gain: 64
sample_rate: 2000
input_mux: AIN0_AIN1
# B1: the bridge is powered from 3.3 V = AVDD, so measure ratiometrically.
# REFP0 is the PT1000 IDAC output on B1 and must not be the reference.
vref: analog_supply
sensor_orientation: inverted

# --- Preloaded-max model (active) ---
safety_model: preloaded_max
trigger_percent: 10
max_load_safety_margin_percent: 5.0
max_load_safety_margin_counts: 0   # 0 = use percent margin above
# reference_max_load_counts is set via LOAD_CELL_CALIBRATE_MAX + SAVE_CONFIG.

# --- Legacy gram-based options (disabled) ---
# force_safety_limit: 100
# trigger_force: 30
# counts_per_gram: ...
# reference_tare_counts: ...
# z_offset: 0.0  # nozzle is probe

# --- Probe behavior ---
tare_time: 0.04
speed: 4
samples: 2
sample_retract_dist: 0.4
lift_speed: 10
samples_result: average
samples_tolerance: 0.03
samples_tolerance_retries: 3

# --- Optional filtering (disabled) ---
# drift_filter_cutoff_frequency: 0.8
# drift_filter_delay: 2
# buzz_filter_cutoff_frequency: 100.0
# buzz_filter_delay: 2
# notch_filter_frequencies: 50, 60
# notch_filter_quality: 2.0

[skew_correction]
#autocalibrated by auto_skew in bed_mesh

[bed_mesh]
speed: 250
# KAN-219: 2 was not enough travel clearance for this bed. The probed surface
# spans 3.593 mm and peaks at +1.959 above the Z datum set by _LOAD_CELL_HOME_Z,
# so travel at 2.0 cleared the highest point by 0.041 mm and the nozzle audibly
# scratched across the whole y=170 row at 250 mm/s. bed_mesh is CLEARED during
# BED_MESH_CALIBRATE and the traverse is an absolute manual_move, so none of it
# is compensated.
#
# There is no z_tilt/bed_tilt/screws_tilt and one Z stepper on this machine: the
# bed is not levellable and absorbing its shape is what the mesh is for, so this
# value has to come from the bed's measured range rather than assume a flat bed.
#
# 5 gives 3.04 mm at the worst measured point. 4 would give 2.04 mm and cost
# less, but the 12 points sit on a 60 x 81.5 mm grid, so the surface BETWEEN
# nodes is unresolved and with ~1 mm of residual warp it can sit well above the
# interpolated value. Costs ~12.6 s of Z motion per mesh; KAN-218 (samples=1)
# removes ~30 s from the same operation.
horizontal_move_z: 5
mesh_min: 10, 7
mesh_max: 190, 170
probe_count: 4, 3
# fade_start: 1
# fade_end: 15
# fade_target: 0
adaptive_margin: 5
no_go_traverse_z: 6
no_go_region_1_min: 75, 0
no_go_region_1_max: 125, 34
no_go_boundary_tolerance: 10
auto_skew: True


[contact_guard]
# Refuses an XY move that does not also raise Z while the nozzle presses on
# the plate (or anything else touching the toolhead), for every client.
# Counts are raw load cell counts in the pressing direction. A probe tap at
# 4 mm/s triggers at about 181000 (trigger_percent 10 above), so contact
# firm enough to trigger a probe reads at twice the threshold.
threshold_counts: 90000
# On after 20 ms above the threshold; off after 50 ms below half of it.
# 20 ms is longer than the half period of the cell's 48 Hz ring.
on_time: 0.020
off_time: 0.050
# The cell rings for about 0.4 s after a tap; ignore it for 0.5 s.
holdoff_time: 0.5
# Tare drift (~9000 counts/s measured) is followed with a 1 s time constant
# while the load stays within the band; a load that sits outside the band
# for relock_time without becoming contact is drift, and is re-zeroed.
baseline_time_constant: 1.0
baseline_band_counts: 22500
relock_time: 0.5
# Below this Z an XY move waits for the moves queued ahead of it to run, so
# a descent onto the plate queued just before it is seen. The plate peaks
# about 2 mm above the Z datum (KAN-219); travel at 5 is never delayed.
sync_below_z: 3.0

[thermistor CMFD473F4050HANT]
temperature1: 25
resistance1: 47000
beta: 4150

[thermistor 104JT_XXXX]
temperature1: 25
resistance1: 100000
beta: 4390



[extruder]
step_pin: toolhead:gpio19
dir_pin: !toolhead:gpio18
enable_pin: !toolhead:gpio16

rotation_distance: 36.1  #TODO MAKE VARIABLE (ADD TO CALIBRATION FILE INSTEAD)
gear_ratio: 91:10


microsteps: 16
full_steps_per_rotation: 400 #200 #1.8deg Motor
# TODO(B1): LDO-36STH20-1004AHG is 1.8 deg (200 steps). Check whether 400 and
# rotation_distance 36.1 compensate each other before changing either.

max_extrude_only_distance: 400
max_extrude_only_velocity: 150.0
max_extrude_only_accel: 10000

nozzle_diameter: 0.4  #TODO MAKE VARIABLE (ADD TO CALIBRATION FILE INSTEAD)
filament_diameter: 1.75

heater_pin: toolhead:gpio11 # B1 HE_LOGIC
# B1 INTERIM, HEATER DISABLED. The hotend sensor moved onto the load-cell
# ADS1220 (NTC Semitec 104NT-4-R025H42G or PT1000, detected at connect); its
# driver is in progress. TEMP_ADC_BACKUP (gpio26) reads only if R49 (0R) is
# fitted and floats otherwise, so the heater is held to a token max_power
# (~0.2 W of a 192 W heater) until the real sensor lands. Restore 0.5 then.
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: toolhead:gpio26

max_power: 0.001
pwm_cycle_time: 0.00001 #50khz, critical otehrwise the votlage ripple (espcaily with thin resitive power cable) kills the stepper driver motor from the votlage swings

# control = pid

# -70 rather than the -100 this used to be, so that a disconnected or broken
# thermistor is treated as a fault instead of as a very cold hot end.
#
# min_temp is the only sensor-integrity check this heater has, and it is used
# in two places that pull in opposite directions. Both bound the value.
#
# 1. It becomes an ADC window the MCU range-checks every report period
#    (adc_temperature.py setup_minmax -> mcu.py MCU_adc._build_config ->
#    src/adccmds.c), and four consecutive samples outside it call
#    try_shutdown("ADC out of range"). An open Generic 3950 on the default
#    4.7k pullup computes to -109.28 C. At -100 the bound worked out at
#    32759.24, which mcu.py rounds up to 32760 -- the full-scale value itself
#    -- and adccmds.c compares inclusively, so the check could never fire. The
#    hot end read "very cold" with the heater commanding full power, and only
#    verify_heater's slower not-heating-at-rate timer was left to catch it.
#    The check is inert at anything below about -96.86, so min_temp must be
#    ABOVE that.
#
# 2. heaters.py:166 silently drops any sample below min_temp - 50 as a glitch.
#    That threshold moves with min_temp, so raising min_temp too far makes the
#    host discard the very reading that proves the sensor is broken: last_temp
#    stops updating, get_temp starts returning 0.0 after QUELL_STALE_TIME, and
#    extruder_homing's min_extrude_temp_override of 0 then reads that 0.0 as
#    warm enough to move. To keep -109.28 visible to the host, min_temp must be
#    AT OR BELOW -59.28.
#
# That leaves (-96.86, -59.28]. -70 sits in the middle of it: max_value 32752,
# so an open circuit trips in about 1.2 s, and the host still sees the fault.
# It also cannot false-trip -- a healthy sensor would have to read below -70 C.
#
# The ticket proposed 0, and -20 looks tempting because it would also catch a
# thermistor stuck at a plausible -40. Both are outside the window: they trip
# the MCU but blind the host and open the homing hole above, and -20 additionally
# faults a healthy sensor in a room below -20 C. Tightening toward -20 means
# first decoupling the heaters.py glitch guard from min_temp. Until then the
# mid-range degraded case stays verify_heater's job (see KAN-99), and this
# closes the open-circuit and short cases.
#
# Arming this check has a cost worth knowing. [mcu toolhead] is is_non_critical,
# so the trip is a toolhead disconnect running TOOLHEAD_DISCONNECT (M104 S0, and
# PAUSE if printing) rather than a printer shutdown. The MCUConnectHelper
# ._is_shutdown latch that used to make that disconnect permanent -- never
# cleared once set, and consulted by _send_get_config before reconnecting -- was
# fixed under KAN-271, so the toolhead can now come back without restarting
# klippy. It is still a visible behaviour change: a sensor that is lying now
# takes the toolhead offline instead of being used to drive the heater.
min_temp: -70
max_temp: 265
max_extrude_cross_section: 4
pressure_advance: 0.076  #TODO MAKE VARIABLE (ADD TO CALIBRATION FILE INSTEAD)
min_extrude_temp: 160



# B1: TMC2241 on toolhead SPI0 CS1 (gpio24). Motor LDO-36STH20-1004AHG round
# pancake: 1.0 A, 2.1 ohm, 1.5 mH, Class H.
[tmc2241 extruder]
cs_pin: toolhead:gpio24
spi_bus: spi0_gpio20_gpio23_gpio22
rref: 12000 # TODO(B1): confirm the toolhead RREF value
run_current: 0.6
interpolate: True
# SpreadCycle, so sensorless_extruder keeps using StallGuard2 (driver_SGT).
stealthchop_threshold: 0
driver_SLOPE_CONTROL: 3
diag0_pin: ^!toolhead:gpio17
# TUNING TODO(B1): driver_SGT for the sensorless filament load; the A1 value
# (2, TMC2130 at 0.4 A) does not carry over.
driver_SGT: 2

# Sensorless filament load: when the filament switch sees filament go in,
# INSERT_FILAMENT_SENSOR drives the extruder until the filament reaches the
# end of its path and stalls the motor, then stops instead of grinding.
# TUNING TODO(B1): driver_SGT on [tmc2241 extruder], velocity and accel.
[extruder_homing sensorless_extruder]
extruder: extruder
endstop_pin: tmc2241_extruder:virtual_endstop
velocity: 15
accel: 50
min_extrude_temp_override: 0

# Toolhead filament switch. Inserting filament runs INSERT_FILAMENT_SENSOR,
# which winds it in and homes it on stall (above). Keep insert_gcode armed:
# scripts/check_m1_armed_hooks.py fails CI if it is commented out, repointed,
# or the sensor is disabled in a shipped macro (KAN-232, Jack 2026-10-10).
# Klipper only runs insert_gcode on a not-detected -> detected edge while not
# printing. Keep the section: macros/toolhead.cfg reads it.
# TODO(B1): runout is not armed. It needs a runout macro that parks off the
# part and drops the hot end before pausing (KAN-236), then pause_on_runout:
# True. PRINT_START also needs to refuse to start with no filament loaded.
[filament_switch_sensor filament_sensor_toolhead]
pause_on_runout: False
insert_gcode: INSERT_FILAMENT_SENSOR
#runout_gcode:
debounce_delay: 0.2
# B1: FIL_SENSE on gpio5 with a 10k pull-up (the A1 line floated, KAN-232).
switch_pin: !toolhead:gpio5

# Umbilical unlock. The umbilical is mechanically locked to the toolhead
# until this button is pressed; the press also retracts the filament out of
# the direct-drive toolhead, so it is not left trapped in it when the
# umbilical comes off. TOOLHEAD_CONNECT/DISCONNECT disarm it around a
# reconnect (MCU-12, MCU-13). The filament cutter has no sensor on B1: it is
# actuated open loop by CUT_FILAMENT at the end of a print.
[gcode_button toolhead_umbilical_unlock_button]
# B1: UNLOCK_BTN on gpio3 with a 10k pull-up.
pin: !toolhead:gpio3
press_gcode: TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_PRESSED
release_gcode: TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_RELEASED
debounce_delay: 0.05

# B1 Z/bed power path (klippy/extras/z_power.py). A TPS16630 eFuse feeds
# 48V_Z to the Z column and through it the bed. It is switched on only when
# the column is present with its lever locked and a plate reads on the bed
# thermistor, so neither the Z connector nor the bed contacts sit live at
# 48 V when nothing is mated. The bed heater refuses a target until PGOOD
# confirms the feed. ILIM is ~6 A in hardware; IMON gives the current.
# EN = gpio5 (R76 pull-down), PGOOD = gpio27, IMON = gpio28 (Iout ~= 2.24 x V),
# Z_PRESENT = gpio29 (10k pull-up, lever divider on the Z backboard).
[z_power]
enable_pin: gpio5
power_good_pin: gpio27
present_pin: gpio29
current_pin: gpio28
# Z_PRESENT has a 10k pull-up to 3.3 V here. On the backboard, R45 (10k)
# goes to GND, and the lever switch (SSCQ110100) shorts Z_PRESENT to GND
# while the lever is up (backboard schematic):
#   no column  pull-up only    ~1.0  (0.977 measured on gimlet)
#   unlocked   switch closed    0 V  -> 0.0
#   locked     R45 divider   1.15 V  -> 0.35 (schematic note; a plain
#                                       10k/10k would be 0.5)
# The locked band covers both 0.35 and 0.5. The gaps between bands read
# as unknown, which keeps the bed unpowered. A short to GND on the
# connector reads as unlocked, which is also safe.
# TODO(B1): confirm the locked ratio with Z_POWER_STATUS on a column.
present_absent_range: 0.90, 1.0
present_unlocked_range: 0.0, 0.12
present_locked_range: 0.22, 0.65
z_change_gcode: _Z_COLUMN_CHANGED
lost_gcode: _Z_POWER_LOST
fault_gcode: _Z_POWER_FAULT

# Live fully-on power for the bed's MPC: V^2 / R, with V the 48 V rail as
# the TMC2241 drivers read it and R the bed heater's resistance. R is
# learnt from the eFuse current (IMON) only while the heater is fully on --
# PWM makes the reading meaningless at any other duty -- so every heat-up
# from cold refreshes it. A new value goes to calibration.cfg with the next
# SAVE_CONFIG. Fully on with R outside resistance_range for fault_time (an
# open heater reads as infinite) latches a z_power fault. heater_power in
# [heater_bed] is only used without this section.
[heater_supply heater_bed]
# 45 V / 170 W. TODO(B1): confirm on a bed with Z_POWER_STATUS.
resistance: 11.9
# Wide on purpose: the trace's temperature coefficient is not measured
# yet. Below about 9 ohm z_power's max_current trips first anyway.
resistance_range: 8.0, 24.0
# Used when the drivers report no supply voltage.
voltage: 45.0
current_source: z_power

[heater_bed]
heater_pin: gpio6
sensor_type: 104JT_XXXX
sensor_pin: gpio26 # B1 THB on ADC0
pwm_cycle_time: 0.05
max_power: 1

# control = mpc
heater_power = 170
cooling_fan = fan

# Pulling the plate opens the bed thermistor circuit, which then reads about
# -20 to -26 C (measured on A1 and B1; diode leakage keeps it off full scale).
# bed_removal_detector turns that into BED_REMOVED. min_temp only has to sit
# well below that reading: the MCU range check trips below min_temp (a full
# shutdown on the critical [mcu]) and heaters.py drops samples below
# min_temp - 50. Anything at or below about -50 works; -100 is kept.
# A removed plate and a disconnected bed thermistor read the same, so the bed
# has no sensor-integrity check beyond max_temp and verify_heater (KAN-112).
# [An earlier comment derived this from a computed -83.76 C; the bench
# reading is about -26 C.]
min_temp: -100
max_temp: 130
# Klipper's default, raised from 0.2. 0.2 was not a short filter, it was no
# filter: heaters.py:180 uses adj_time = min(time_diff / smooth_time, 1.) and
# this thermistor reports every REPORT_TIME = 0.300s (adc_temperature.py:15), so
# any smooth_time <= 0.3 clamps adj_time to 1.0 and smoothed_temp is just the
# raw sample. At 1.0, adj_time is 0.3 -- a ~1s exponential average, which keeps
# the fast edge of the wipe-fan draught and the per-sample ADC noise out of the
# reading [verify_heater heater_bed] compares against. It cannot remove a
# sustained draught offset, only the transient and the noise.
# MPC is not affected either way: heaters.py:178 hands
# control.temperature_update the raw sample, before any smoothing.
smooth_time: 1.0


# Pulling the plate opens the bed thermistor circuit. Once the averaged
# reading drops below remove_threshold (-15 C) the detector zeroes the bed
# target, pauses a print and runs BED_REMOVED; BED_ATTACHED on the way back.
# A zero target is also what stops [verify_heater heater_bed] counting, and
# that is a race: verify_heater would trip about 2 s after removal. The
# detector decides on 2 fresh raw samples (the sensor reports every 0.3 s),
# about 0.6 s. It is the single owner of plate presence: z_power gates the
# bed feed on its verdict. Do not slow the detector down.
# A removed plate reads about -20 to -26 C (A1 and B1), so remove_threshold
# -15 has only ~10 C of margin. TODO(B1): with the Z eFuse module the
# detector should also drop 48V_Z (EN, gpio5) on removal.
[bed_removal_detector]
#remove_threshold: -15
#attach_threshold: -5
#buffer_length: 2
#   Module defaults: the average of the last 2 fresh raw samples.
interval: 0.1

# Thermal-runaway guard for the bed. It ends in a printer shutdown, so the
# numbers are derived, not widened until a nuisance trip stopped (KAN-160):
# - check_gain_time 120 s (Klipper default 60): the only time constant that
#   matters here, because below the band the error accumulator passes
#   max_error within seconds and only the gain check holds the trip off.
#   It covers the bed-cooling draught of the nozzle-wipe fan in PRINT_START.
#   KAN-224 and KAN-221 shortened that draught since, so 60 may be enough;
#   re-derive on the bench before changing it.
# - Cost of 120 over 60: a failed heater, FET, cable or detached thermistor is
#   caught 60 s later. Bed plant 319.6 J/K, 1.195 W/K, 170 W (45 V, 12 ohm):
#   a runaway plate reaches 54 C at 61 s and 77 C at 121 s from 25 C, with
#   a 142 C ceiling over ambient. max_temp 130 is the immediate backstop.
# - Do not raise hysteresis instead: it is where the guard stops looking.
# - These keys are also locked against calibration.cfg by configfile.py
#   (SAFETY_SECTIONS / SAFETY_OPTIONS, KAN-108). The full derivation is in
#   git history (KAN-160) and belongs in the internal docs (THM-16).
[verify_heater heater_bed]
hysteresis: 15
check_gain_time: 120
max_error: 120
heating_gain: 2

[verify_heater extruder]
# KAN-108, as above: this section did not exist, so under that original one-layer
# guard all four of its keys were settable from the calibration overlay on a
# 192 W hot end. Layers 1 and 2 refuse them now; this is the layer-3 lock.
# Every value is the default verify_heater.py:23-26 would apply (check_gain_time
# 20 for a non-bed heater), so this changes no behaviour either.
hysteresis: 5
max_error: 120
heating_gain: 2
check_gain_time: 20



[fan]
pin: gpio11 # B1 CPAP_FAN_PWM
max_power: 1.0
hardware_pwm: True
cycle_time: 0.00005 #20khz
shutdown_speed: 0.0
off_below: 0.0
tachometer_pin: gpio2
tachometer_poll_interval: 0.00025 #20/(2*40000)
kick_start_time: 0.0

# Print modes for the part fan. The CPAP blower is far stronger and louder
# than slicer filament profiles assume, so the slicer's command is mapped
# through the selected mode's curve (commanded:output, 0..1) instead of every
# profile being edited down. Stock profiles then work: 100% commanded is 30%
# real in normal mode, and the full blower is only used in turbo.
# SET_PRINT_MODE MODE=normal|quiet|turbo. M106/M107 go through the curve;
# M106.1 is the raw physical speed for macros tuned to real speeds.
# TODO: per-mode print speed (quiet ~60%, turbo ~150%) needs accel and
# slicer-limit handling first; <mode>_speed_factor applies M220 when set.
[fan_modes]
fan: fan
modes: normal, quiet, turbo
default_mode: normal
normal_curve: 0:0, 1:0.30
quiet_curve: 0:0, 1:0.20
turbo_curve: 0:0, 1:1.0
#quiet_speed_factor: 0.6
#turbo_speed_factor: 1.5

[temperature_fan CPU]
pin: gpio7 # B1 CM4_FAN_PWM
tachometer_pin: gpio13
max_power: 1
shutdown_speed: 0.0
hardware_pwm: True
cycle_time: 0.00005 #20khz

min_temp: -40
max_temp: 150
sensor_type: temperature_host

control: watermark
target_temp: 65

max_speed: 0.40
#TODO, COMBINED TEMP WITH RP2040 Builtin micro-controller temperature sensor rather than just cm4
kick_start_time: 0.0

[temperature_fan Motor_Drivers]
pin: gpio10
tachometer_pin: gpio14
max_power: 1
shutdown_speed: 0.0
hardware_pwm: True
cycle_time: 0.00005 #20khz

min_temp: -40
max_temp: 150
# B1 has no driver-bay thermistor: the hottest TMC2241 die instead.
# TODO(B1): the curve below was set for the A1 bay thermistor; re-derive it
# for die temperatures (the 2241 warns at 120 C).
sensor_type: tmc_driver
sensor_stepper: stepper_x, stepper_y, stepper_z

control: curve
points:
  44.9, 0
  45, 0.25
  70, 0.6
  79.9, 1.0
  #realy audible above 0.6
target_temp: 80

max_speed: 1.0#0.25
min_speed: 0.0
kick_start_time: 0.0


[power_fan Power_Supply]
pin: gpio9
tachometer_pin: gpio12
max_power: 1.0
shutdown_speed: 0.0
hardware_pwm: True
cycle_time: 0.00005 #20khz

system_voltage: 45.0
sample_interval: 0.5
filter_time: 5.0
min_speed_delta: 0.02

resistive_loads:
  heater_bed, 12
  extruder, 12

stepper_loads:
  stepper_x, 5.0
  stepper_y, 5.0
  stepper_z, 5.0
  extruder, 5.0

fan_loads:
  fan, 30.0

fixed_loads:
  controller, 7.0

points:
  0, 0.0
  40, 0.0
  70, 0.2
  180, 0.5
  300, 1.0

# KAN-230: a brief full-power kick when the fan starts or is stepped up
# sharply, to break stiction, so PSU_FAN_CHECK has less of a blind window
# to tolerate after every start. Matched A/B on an identical bed-heater
# step, time from commanded-on to first tacho reading:
#
#   kick 0.0   n=3   mean 0.92 s   max 1.25 s   150-617 rpm at first read
#   kick 0.5   n=5   mean 0.65 s   max 0.76 s   1949-2000 rpm
#
# Not just faster to register - the fan is properly turning by then rather
# than barely creeping, which is the point of a kick-start.
kick_start_time: 0.5


[temperature_sensor toolhead_fan_air]
sensor_type: CMFD473F4050HANT
sensor_pin: toolhead:gpio28 # B1 T_HSAIR

[temperature_sensor toolhead_extruder_motor]
sensor_type: CMFD473F4050HANT
sensor_pin: toolhead:gpio27 # B1 T_EMOT


[temperature_fan toolhead_heatsink]
pin: toolhead:gpio10 # B1 FAN_LOGIC
hardware_pwm: True
cycle_time: 0.00001
tachometer_pin: toolhead:gpio9 # B1 FAN_TAC_LOGIC

max_power: 1.0
min_temp: -50
max_temp: 100

sensor_type: CMFD473F4050HANT
sensor_pin: toolhead:gpio29 # B1 T_HS

control: curve
points:
  37.9, 0
  38, 0.3
  45, 0.85
  50, 1.0
target_temp: 65
min_speed: 0
max_speed: 1
cooling_hysteresis: 1

# KAN-227: full, not half. This applies ONLY on an MCU shutdown - fan.py calls
# setup_max_duration(0.) for this pin, so there is no host-comms watchdog on it
# and the value is unreachable in normal operation. In a shutdown the extruder
# heater is on the same toolhead MCU and dies within MAX_HEAT_TIME, so what is
# left is a possibly-hot nozzle with no control loop. The right answer there is
# the heatsink fan flat out. temperature_fan.py constructs its Fan with
# default_shutdown_speed=1. for exactly this reason; 0.5 overrode it.
shutdown_speed: 1.0
kick_start_time: 0.0







[neopixel Left]
pin: gpio4
chain_count: 40
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
output_gamma: 2.2

[neopixel Right]
pin: gpio8
chain_count: 40
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
output_gamma: 2.2



[force_move]
# KAN-60. This said "#todo disable for production". Do not do that: it
# would brick the machine, not harden it.
#
# In this fork force_move.py also gates SET_KINEMATIC_POSITION on this
# flag, and the shipped config calls SET_KINEMATIC_POSITION from 23 sites
# -- every branch of G28, _HOME_X/_HOME_Y/_HOME_Z, filament load and
# unload, and position.cfg. FORCE_MOVE itself is called from toolhead.cfg
# to retract the extruder before the umbilical unlock, which has to work
# with a cold hot end and so cannot use G1 E (min_extrude_temp: 160).
# Setting this false removes all of those commands and homing stops
# working on every unit in the field.
#
# force_move.py now registers SET_KINEMATIC_POSITION unconditionally, as
# upstream Klipper does, so this flag governs only FORCE_MOVE. The
# remaining blocker to setting it false is the unlock retract above,
# tracked separately. Note that nothing in the tree currently restricts
# who can reach the G-code endpoint, so this flag is presently unguarded
# on a shipped machine -- that is the reason to keep the follow-up moving,
# not a reason to flip it here.
#
# Asserted by recipes/klipper_moonraker_fluidd/tests/test_production_config.py
# in MuonOS, which pins the value so a change here is deliberate.
enable_force_move = true
