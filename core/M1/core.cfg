[include macros/macros.cfg]

[virtual_sdcard]
path: /home/printer_data/gcodes
# Klipper's default on_error_gcode only turns the heaters off. A print file
# that dies on an error, PRINT_START's own lines included, also has to clear
# the PRINT_START phase it was publishing; see _ON_PRINT_ERROR in
# macros/print.cfg, which keeps the heaters-off.
on_error_gcode: _ON_PRINT_ERROR

[pause_resume]
[display_status]
[exclude_object]

# Klipper's default idle gcode is TURN_OFF_HEATERS then M84, and with no
# [idle_timeout] section that default applied to a paused print too. Ten
# minutes into a pause the hot end went cold AND the steppers dropped,
# which clears homed_axes -- so a resume after that fed a cold nozzle into
# a machine that no longer knew where it was. Nothing announced either.
#
# Paused is now its own case. The hot end is still shed, because a nozzle
# left at print temperature unattended cooks the filament sitting in the
# melt zone and drools onto whatever is under it -- that is the risk the
# timeout exists to cover and it does not go away just because a print is
# paused. What changes is the other two: the bed stays at target so the
# part keeps its adhesion, and M84 is not issued, so the print can still
# be resumed. RESUME puts the hot end back and waits for it before the
# toolhead moves -- see _RESUME_RESTORE_HOTEND and PAUSE's
# saved_hotend_target in macros/print.cfg.
#
# Not paused, this is Klipper's own DEFAULT_IDLE_GCODE, unchanged.
[idle_timeout]
timeout: 600
gcode:
    # Idle means no gcode is running, so no PRINT_START is either. Catches one
    # typed at the console that failed, which on_error_gcode does not see.
    _PRINT_START_PHASE_CLEAR
    {% if printer.pause_resume.is_paused %}
      M104 S0
      {action_respond_info("Paused 10 min: hot end off, RESUME reheats")}
    {% else %}
      TURN_OFF_HEATERS
      M84
    {% endif %}

# Generic cross restart store for calibration state, sits next to
# calibration.cfg in the writable calibration directory so a calibration wipe
# clears both together. Values are written with SAVE_VARIABLE and read back
# from printer.save_variables.variables.<name>
[save_variables]
filename: /home/printer_data/calibration/variables.cfg

# Independent heater safety state (D-018, 20 Oct 2026). An ABSENT file means
# no fault, so a freshly flashed M1 can heat. A file that exists but is
# corrupt or unreadable latches heating until Fan checked is pressed.
[hotend_fan_latch]
state_file: /home/printer_data/calibration/hotend_fan_latch.state



[mcu]
serial: /dev/UART-MAIN
baud: 3000000#250000
restart_method: swdio
openocd_config: /opt/klipper/core/M1/firmware/openocd.main.config

[mcu rpi]
serial: /home/printer_admin/comms/klipper_host_mcu
restart_method: command

[mcu toolhead]
serial: /dev/UART-TOOLHEAD
baud: 3000000#250000
restart_method: swdio
openocd_config: /opt/klipper/core/M1/firmware/openocd.toolhead.config
is_non_critical: True
connect_macro: TOOLHEAD_CONNECT
disconnect_macro: TOOLHEAD_DISCONNECT

[printer]
kinematics: corexy
max_velocity: 800 #can go faster but at lower accelerations
max_accel: 20000#can go higher at higher currents,14000 #limited by input shaper
square_corner_velocity: 7#20 for higher speed prints
max_z_velocity: 15
max_z_accel: 1000



[adxl345]
cs_pin: toolhead:gpio21
spi_bus: spi0_gpio20_gpio23_gpio22#spi0d
axes_map: x,y,z

[adxl345_probe]
chip: adxl345
probe_pin: toolhead:gpio25
int_pin: int1

# Global defaults
tap_thresh: 15000
tap_dur: 0.03
homing_tap_arm_delay: 0.1

# X axis homing profile
x_tap_thresh: 20000
# x_tap_dur: 0.010
x_tap_axes: x

# Y axis homing profile
y_tap_thresh: 15000
# y_tap_dur: 0.010
y_tap_axes: y

# Tap confirmation (KAN-197). After the first tap the axis backs off
# tap_confirm_retract_dist, re-approaches at tap_confirm_speed (default:
# homing_speed, so the impact is as hard as the first one) and must tap
# again within tap_confirm_tolerance of the previous trigger position.
# tap_confirm_samples agreeing taps in a row are required; a disagreement
# restarts the count (up to tap_confirm_retries times). No tap within
# 2 * tap_confirm_retract_dist means the previous tap was spurious: the
# seek resumes in the homing direction (tap_confirm_seek_retries times,
# bounded by tap_confirm_max_seek_dist, default: the axis travel).
# The retract must exceed homing_speed * homing_tap_arm_delay (6mm here)
# or the tap is not yet armed when the frame is reached.
# Each option also accepts an x_/y_ prefix for per-axis values.
# Y only: on boxwood (2026-09-23) Y confirmed 3/3, but X taps disagreed
# by a steady 1.60mm (~one tap_dur at 60mm/s) and failed 3/3. X stays
# single-tap until that is understood; see PR #45.
tap_confirm_samples: 1
y_tap_confirm_samples: 2
tap_confirm_tolerance: 0.2
tap_confirm_retries: 2
tap_confirm_retract_dist: 8
tap_confirm_seek_retries: 1

enable_z_probe: False


[resonance_tester]
accel_chip: adxl345
probe_points:
    100,100, 20
min_freq: 30
max_freq: 110
hz_per_sec: 2
move_speed: 200

# Set in calibration config file, located in printer_data
[input_shaper]
#shaper_type_x = mzv
#shaper_freq_x = 52.2
#shaper_type_y = zv
#shaper_freq_y = 77.8



