[include macros/macros.cfg]

[virtual_sdcard]
path: /home/printer_data/gcodes

[pause_resume]
[display_status]
[exclude_object]

# Generic cross restart store for calibration state, sits next to
# calibration.cfg in the writable calibration directory so a calibration wipe
# clears both together. Values are written with SAVE_VARIABLE and read back
# from printer.save_variables.variables.<name>
[save_variables]
filename: /home/printer_data/calibration/variables.cfg



[mcu]
serial: /dev/UART-MAIN
baud: 3000000#250000
restart_method: swdio
openocd_config: /opt/klipper/core/M1/firmware/openocd.main.config

[mcu rpi]
serial: /home/printer_admin/comms/klipper_host_mcu
restart_method: command

[mcu toolhead]
serial: /dev/UART-TOOLHEAD
baud: 3000000#250000
restart_method: swdio
openocd_config: /opt/klipper/core/M1/firmware/openocd.toolhead.config
is_non_critical: True
connect_macro: TOOLHEAD_CONNECT
disconnect_macro: TOOLHEAD_DISCONNECT

[printer]
kinematics: corexy
max_velocity: 800 #can go faster but at lower accelerations
max_accel: 20000#can go higher at higher currents,14000 #limited by input shaper
square_corner_velocity: 7#20 for higher speed prints
max_z_velocity: 15
max_z_accel: 1000



[adxl345]
cs_pin: toolhead:gpio21
spi_bus: spi0_gpio20_gpio23_gpio22#spi0d
axes_map: x,y,z

[adxl345_probe]
chip: adxl345
probe_pin: toolhead:gpio25
int_pin: int1

# Global defaults
tap_thresh: 15000
tap_dur: 0.03
homing_tap_arm_delay: 0.1

# X axis homing profile
x_tap_thresh: 20000
# x_tap_dur: 0.010
x_tap_axes: x

# Y axis homing profile
y_tap_thresh: 15000
# y_tap_dur: 0.010
y_tap_axes: y

enable_z_probe: False


[resonance_tester]
accel_chip: adxl345
probe_points:
    100,100, 20
min_freq: 30
max_freq: 110
hz_per_sec: 2
move_speed: 200

# Set in calibration config file, located in printer_data
[input_shaper]
#shaper_type_x = mzv
#shaper_freq_x = 52.2
#shaper_type_y = zv
#shaper_freq_y = 77.8



[stepper_x]
step_pin: gpio17
dir_pin: !gpio16
enable_pin: !gpio15
microsteps: 64
rotation_distance: 40 #20t * 2mm gt2 pitch
full_steps_per_rotation: 200

#homing_retract_dist: 4 #disbaled due to https://github.com/Klipper3d/klipper/issues/1311
homing_retract_dist: 0
position_endstop: 200
homing_positive_dir: True #home at the right
position_max: 200.1

endstop_pin: adxl345_probe:x_virtual_endstop
homing_speed: 60


[tmc2130 stepper_x]
cs_pin: rpi:None
spi_bus: spidev6.0


run_current: 0.8
sense_resistor: 0.1
stealthchop_threshold: 0#9999999
interpolate = false

diag0_pin: ^!gpio18
driver_SGT: 2
driver_TBL: 1
driver_TOFF: 3
driver_HSTRT: 5
driver_HEND: 3



[stepper_y]
step_pin: gpio21
dir_pin: !gpio20
enable_pin: !gpio19
microsteps: 64
rotation_distance: 40 #34t * 2mm gt2 pitch
rotation_distance: 40 #34t * 2mm gt2 pitch
full_steps_per_rotation: 200
#homing_retract_dist: 4 #disbaled due to https://github.com/Klipper3d/klipper/issues/1311
homing_retract_dist: 0



homing_positive_dir: True
position_min: -10
position_endstop: 174
position_max: 174.1



endstop_pin: adxl345_probe:y_virtual_endstop
homing_speed: 60



[tmc2130 stepper_y]
cs_pin: rpi:None
spi_bus: spidev6.1


run_current: 0.8
sense_resistor: 0.1
stealthchop_threshold: 0#9999999
interpolate: false

diag0_pin: ^!gpio22
driver_SGT: 2

driver_TBL: 1
driver_TOFF: 3
driver_HSTRT: 5
driver_HEND: 3


[stepper_z]
step_pin: gpio24
dir_pin: !gpio23
enable_pin: !gpio25

microsteps: 64
rotation_distance: 4 #4mm pitch leadscrew
gear_ratio: 12:20, 30:15
full_steps_per_rotation: 200

position_min: -4
position_max: 160

endstop_pin: toolhead:gpio4 #UNUSED PIN
#Load cell probe is not an endstop and doesn't support endstop: prove:z_virtual_endstop. For the time being you'll need to configure your z axis with an MCU pin as its endstop. You won't actually be using the pin but for the time being you have to configure something.
#https://www.klipper3d.org/Load_Cell.html#homing-macros
position_endstop: 0


[tmc2130 stepper_z]
cs_pin: rpi:None
spi_bus: spidev6.2

run_current: 0.7
# hold_current: 0.3
sense_resistor: 0.1
stealthchop_threshold: 0#9999999 #stealthshop quiter but hotter
interpolate: false

driver_TBL: 1
driver_TOFF: 3
driver_HSTRT: 2
driver_HEND: 3

#for secondary sensorless homign at top of axis
driver_SGT: 1
diag0_pin: ^!gpio3


[advanced_homing_movement]
axis: z
stepper: stepper_z
driver: tmc2130
# Keep Z on TMC virtual endstop (stall) and use configured endstops on XY.
endstop_source_x: configured
endstop_source_y: configured
direction: max
speed: 15
retract: 10
retract_speed: 20
overshoot: 5


[load_cell_probe]
# --- Sensor (ADS1220) ---
sensor_type: ads1220
cs_pin: toolhead:gpio7
spi_speed: 512000
spi_bus: spi0_gpio20_gpio23_gpio22
data_ready_pin: toolhead:gpio14
gain: 64
sample_rate: 2000
input_mux: AIN0_AIN1
vref: REF0
sensor_orientation: inverted

# --- Preloaded-max model (active) ---
safety_model: preloaded_max
trigger_percent: 10
max_load_safety_margin_percent: 5.0
max_load_safety_margin_counts: 0   # 0 = use percent margin above
# reference_max_load_counts is set via LOAD_CELL_CALIBRATE_MAX + SAVE_CONFIG.

# --- Legacy gram-based options (disabled) ---
# force_safety_limit: 100
# trigger_force: 30
# counts_per_gram: ...
# reference_tare_counts: ...
# z_offset: 0.0  # nozzle is probe

# --- Probe behavior ---
tare_time: 0.04
speed: 4
samples: 2
sample_retract_dist: 0.4
lift_speed: 10
samples_result: average
samples_tolerance: 0.03
samples_tolerance_retries: 3

# --- Optional filtering (disabled) ---
# drift_filter_cutoff_frequency: 0.8
# drift_filter_delay: 2
# buzz_filter_cutoff_frequency: 100.0
# buzz_filter_delay: 2
# notch_filter_frequencies: 50, 60
# notch_filter_quality: 2.0

[skew_correction]
#autocalibrated by auto_skew in bed_mesh

[bed_mesh]
speed: 250
horizontal_move_z: 2
mesh_min: 10, 7
mesh_max: 190, 170
probe_count: 4, 3
# fade_start: 1
# fade_end: 15
# fade_target: 0
adaptive_margin: 5
no_go_traverse_z: 6
no_go_region_1_min: 75, 0
no_go_region_1_max: 125, 34
no_go_boundary_tolerance: 10
auto_skew: True


[thermistor CMFD473F4050HANT]
temperature1: 25
resistance1: 47000
beta: 4150

[thermistor 104JT_XXXX]
temperature1: 25
resistance1: 100000
beta: 4390



[extruder]
step_pin: toolhead:gpio19
dir_pin: !toolhead:gpio18
enable_pin: !toolhead:gpio16

rotation_distance: 36.1  #TODO MAKE VARIABLE (ADD TO CALIBRATION FILE INSTEAD)
gear_ratio: 91:10


microsteps: 16
full_steps_per_rotation: 400 #200 #1.8deg Motor

max_extrude_only_distance: 400
max_extrude_only_velocity: 150.0
max_extrude_only_accel: 10000

nozzle_diameter: 0.4  #TODO MAKE VARIABLE (ADD TO CALIBRATION FILE INSTEAD)
filament_diameter: 1.75

heater_pin: toolhead:gpio10 #HE1
sensor_type: Generic 3950
sensor_pin: toolhead:gpio27

max_power: 0.5
pwm_cycle_time: 0.00001 #50khz, critical otehrwise the votlage ripple (espcaily with thin resitive power cable) kills the stepper driver motor from the votlage swings

# control = pid

# -70 rather than the -100 this used to be, so that a disconnected or broken
# thermistor is treated as a fault instead of as a very cold hot end.
#
# min_temp is the only sensor-integrity check this heater has, and it is used
# in two places that pull in opposite directions. Both bound the value.
#
# 1. It becomes an ADC window the MCU range-checks every report period
#    (adc_temperature.py setup_minmax -> mcu.py MCU_adc._build_config ->
#    src/adccmds.c), and four consecutive samples outside it call
#    try_shutdown("ADC out of range"). An open Generic 3950 on the default
#    4.7k pullup computes to -109.28 C. At -100 the bound worked out at
#    32759.24, which mcu.py rounds up to 32760 -- the full-scale value itself
#    -- and adccmds.c compares inclusively, so the check could never fire. The
#    hot end read "very cold" with the heater commanding full power, and only
#    verify_heater's slower not-heating-at-rate timer was left to catch it.
#    The check is inert at anything below about -96.86, so min_temp must be
#    ABOVE that.
#
# 2. heaters.py:166 silently drops any sample below min_temp - 50 as a glitch.
#    That threshold moves with min_temp, so raising min_temp too far makes the
#    host discard the very reading that proves the sensor is broken: last_temp
#    stops updating, get_temp starts returning 0.0 after QUELL_STALE_TIME, and
#    extruder_homing's min_extrude_temp_override of 0 then reads that 0.0 as
#    warm enough to move. To keep -109.28 visible to the host, min_temp must be
#    AT OR BELOW -59.28.
#
# That leaves (-96.86, -59.28]. -70 sits in the middle of it: max_value 32752,
# so an open circuit trips in about 1.2 s, and the host still sees the fault.
# It also cannot false-trip -- a healthy sensor would have to read below -70 C.
#
# The ticket proposed 0, and -20 looks tempting because it would also catch a
# thermistor stuck at a plausible -40. Both are outside the window: they trip
# the MCU but blind the host and open the homing hole above, and -20 additionally
# faults a healthy sensor in a room below -20 C. Tightening toward -20 means
# first decoupling the heaters.py glitch guard from min_temp. Until then the
# mid-range degraded case stays verify_heater's job (see KAN-99), and this
# closes the open-circuit and short cases.
#
# Arming this check has a cost worth knowing. [mcu toolhead] is is_non_critical,
# so the trip is a toolhead disconnect running TOOLHEAD_DISCONNECT (M104 S0, and
# PAUSE if printing) rather than a printer shutdown. The MCUConnectHelper
# ._is_shutdown latch that used to make that disconnect permanent -- never
# cleared once set, and consulted by _send_get_config before reconnecting -- was
# fixed under KAN-271, so the toolhead can now come back without restarting
# klippy. It is still a visible behaviour change: a sensor that is lying now
# takes the toolhead offline instead of being used to drive the heater.
min_temp: -70
max_temp: 265
max_extrude_cross_section: 4
pressure_advance: 0.076  #TODO MAKE VARIABLE (ADD TO CALIBRATION FILE INSTEAD)
min_extrude_temp: 160



[tmc2130 extruder]
cs_pin: toolhead:gpio24
spi_bus: spi0_gpio20_gpio23_gpio22#spi0d
run_current: 0.8
#hold_current: 0.7
sense_resistor: 0.1
stealthchop_threshold: 0#9999999 #stelathchop quiter but hotter
interpolate: False

diag0_pin: ^!toolhead:gpio17
driver_SGT: 2 #for motor current 0.4a

driver_TBL:   2
driver_TOFF:  4
driver_HSTRT: 4
driver_HEND:  0

[extruder_homing sensorless_extruder]
extruder: extruder
endstop_pin: tmc2130_extruder:virtual_endstop
velocity: 15
accel: 50
min_extrude_temp_override: 0


[filament_switch_sensor filament_sensor_toolhead]
# KAN-232: toolhead:gpio3 FLOATS. Both automatic hooks are disarmed until the
# line is repaired.
#
# It reads "detected" with the toolhead confirmed empty by eye, and it survived
# a full UNLOAD_FILAMENT plus 300 mm of further retraction still reading
# "detected". It is not merely stuck, which would be the harmless failure:
# insert_gcode fired on a false->true transition on 2026-08-23, so the line
# reads both states, just not in response to filament. The pin is inverted, so
# a floating line drifting low presents as "filament detected".
#
# That spurious insert is not passive. It ran the whole load flow on an empty
# toolhead - opened a Filament Load prompt, moved the extruder 4.74 mm and
# announced "Filament grabbed" against air. And min_extrude_temp_override: 0
# below means nothing refuses a cold extrude, so a phantom insert grinds the
# drive gear on a cold nozzle.
#
# What is actually lost by disarming: nothing that worked. A line whose state
# does not track filament cannot report a runout, and runout_gcode was #TODO
# anyway, so the only armed action was a bare PAUSE that could never fire
# correctly. What is gained: no more phantom cold load flows.
#
# pause_on_runout is the switch that matters. Commenting out runout_gcode alone
# does nothing - filament_switch_sensor.py substitutes an EMPTY template
# whenever pause_on_runout is true and then issues the pause unconditionally.
#
# Keep the section. Deleting it breaks macros/toolhead.cfg:17 with a Jinja error
# and loses QUERY_FILAMENT_SENSOR, which is the acceptance test for the repair.
#
# TO RE-ARM after the harness is fixed: confirm with QUERY_FILAMENT_SENSOR that
# the reading follows filament in and out, set pause_on_runout back to True,
# uncomment insert_gcode, and write a real runout_gcode - a bare PAUSE leaves
# the nozzle hot and parked over the part.
pause_on_runout: False
#insert_gcode: INSERT_FILAMENT_SENSOR
#runout_gcode: #TODO
debounce_delay: 0.2
switch_pin: !toolhead:gpio3

[gcode_button toolhead_umbilical_unlock_button]
pin: !toolhead:gpio5
press_gcode: TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_PRESSED
release_gcode: TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_RELEASED
debounce_delay: 0.05

# [gcode_button toolhead_fillament_cuttor_sensor]
# pin: !toolhead:gpio12
# press_gcode: TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_PRESSED
# release_gcode: press_gcode: TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_RELEASED
# debounce_delay: 0



#TODO TEMP SOLOUTION TO PREVENT BED PINS FROM OVERHEATING
# ^ kept verbatim: it predates this note and it is not clear it refers to the
# override below rather than to a separate hardware concern.
# The override itself does nothing, and in particular the bed thermistor is NOT shared with the
# extruder one. pins.py:98 keys the duplicate check on "<chip>:<pin>", so
# [heater_bed] sensor_pin: gpio27 is "mcu:gpio27" and [extruder] sensor_pin:
# toolhead:gpio27 is "toolhead:gpio27" -- different physical pins on different
# MCUs that happen to share a number, and they never collide. "pins: gpio27"
# with no chip prefix resolves to "mcu:gpio27" (pins.py:133), which is used
# exactly once in this config, so the override whitelists a duplicate that does
# not exist. Left in place rather than removed as it is inert either way.
[duplicate_pin_override]
pins: gpio27

[heater_bed]
heater_pin: gpio6
sensor_type: 104JT_XXXX
sensor_pin: gpio27
pwm_cycle_time: 0.05
max_power: 1

# control = mpc
heater_power = 170
cooling_fan = fan

# Do NOT raise this. Unlike the extruder above, -100 here is load-bearing.
#
# Plate detection reads this heater's own thermistor: pulling the magnetic bed
# opens the circuit, the 104JT_XXXX computes to -83.76 C, and
# bed_removal_detector.py fires BED_REMOVED once its 5-sample average crosses
# remove_threshold (-15). Two separate limits sit above that, and the lower one
# binds first:
#
#   above about -83.76 + 50 = -33.76, heaters.py:166 discards the bed-removal
#   samples as glitches, so the host stops seeing them at all; and
#
#   above about -74.18, the MCU ADC window trips. This sensor is on the main
#   [mcu], which is critical, so that is invoke_async_shutdown -- a full
#   printer shutdown, not the contained disconnect the toolhead gets.
#
# So the -20 the KAN-112 ticket proposed as a floor would end an ordinary plate
# removal in a shutdown mid-print, with the graceful BED_REMOVED path skipped.
# Left at -100.
#
# The consequence is that the bed keeps no sensor-integrity check: a failed bed
# thermistor is indistinguishable from a removed plate and reads as one. Fixing
# that means decoupling plate detection from the heater bounds -- a dedicated
# [temperature_sensor] or a discrete switch -- which is hardware work, not a
# config value. See KAN-112.
min_temp: -100
max_temp: 130
# Klipper's default, raised from 0.2. 0.2 was not a short filter, it was no
# filter: heaters.py:180 uses adj_time = min(time_diff / smooth_time, 1.) and
# this thermistor reports every REPORT_TIME = 0.300s (adc_temperature.py:15), so
# any smooth_time <= 0.3 clamps adj_time to 1.0 and smoothed_temp is just the
# raw sample. At 1.0, adj_time is 0.3 -- a ~1s exponential average, which keeps
# the fast edge of the wipe-fan draught and the per-sample ADC noise out of the
# reading [verify_heater heater_bed] compares against. It cannot remove a
# sustained draught offset, only the transient and the noise.
# MPC is not affected either way: heaters.py:178 hands
# control.temperature_update the raw sample, before any smoothing.
smooth_time: 1.0


[bed_removal_detector]
# threshold_temp: -15  # Temperature threshold to detect bed removal
interval: 0.1

[verify_heater heater_bed]
# This guard ends in printer.invoke_shutdown() (verify_heater.py:105), not in a
# warning, so these numbers are derived below rather than widened until the
# nuisance error stopped.
#
# WHY check_gain_time AND NOT hysteresis. verify_heater.py:75 adds
# (target - hysteresis) - temp to an error accumulator every second the bed is
# below the band. On a cold bed at a 100C target that is 60/s, so it is past
# max_error (120) after two seconds and stays there. The error branch is
# therefore never what decides anything here; the gain check is the only thing
# holding the shutdown off, and check_gain_time is its only time constant.
# Widening hysteresis instead would just move the temperature at which the guard
# stops looking at all -- a blunter knob aimed at the wrong mechanism.
#
# WHAT HAS TO FIT IN THE WINDOW. PRINT_START now sets the full bed target before
# NOZZLE_WIPE_SMART, whose fan blows over
# the bed thermistor. Once verify_heater.py:87 has seen one gain, goal_temp is
# frozen at (temp + heating_gain), so a draught that depresses the reading has to
# be climbed back out of before the window closes. Model the draught as the
# fraction A of (plate - air) the thermistor loses while the fan is on -- a
# fraction rather than a fixed offset, because that is what an air-side
# conductance does, and it is the only shape that explains why a 65C bed was fine
# and a 100C one was not. Bed plant from the shipped MPC calibration
# (calibration.cfg): 319.565 J/K, 1.19495 W/K, 170W, sensor tau = 1/0.113720 =
# 8.8s, fan_ambient_transfer interpolating to 1.317 W/K at 20% fan.
#
# The bar this was set against is not a guess, it is the configuration already in
# the field: a PLA print at BED=60 was never capped (min(60,65) = 60), so the 60C
# path has always run its whole wipe with the fan on and the guard armed, and it
# does not nuisance-trip. So the uncapped high-temperature path is acceptable if
# it tolerates a worse draught than the 60C path that already works. Largest A
# survived, by wipe length:
#     wipe    60C now    100C at 60s    100C at 120s
#      60s     0.543        0.596          0.988
#     120s     0.476        0.596          0.735
#     180s     0.451        0.596          0.735
#     240s     0.443        0.224          0.735
# 120s clears the bar at every wipe length the wipe can actually have. (The wipe
# is bounded by the hotend: 25->195C up and 195->160C down on the calibrated
# extruder model is about 20s + 26s, so 60-120s, and FAN_COOL exits on its first
# tick because stop_temp and fan_off_temp are both 160.)
#
# WHAT KAN-224 AND KAN-221 CHANGED, AND WHAT THAT DOES TO THIS NUMBER. Read
# everything above as history: it describes the machine as it was when 120 was
# chosen, and two changes since have moved its premises.
#
#   KAN-224 the fan no longer runs through HEAT_WAIT, only from the first wipe
#           pass onward. The line above about the fan running across the whole
#           wipe was true then and is not now, and the empirical bar -- the 60C
#           path that has always run its whole wipe with the fan on -- no longer
#           describes any path on this machine. Both sides of that comparison
#           moved the same way, so the comparison survives; the description of
#           it does not.
#   KAN-221 the hot end is pre-heated before G28, cutting HEAT_WAIT from about
#           42.6s to about 20s. That shortens the wipe, moving it toward the
#           table's 60s row, where the tolerance is widest.
#
# Both reduce the draught the bed is fighting, so the A values above are now
# conservative lower bounds rather than the operating point. With the fan off
# this plant reaches 0.532 C/s at 25C, 0.457 C/s at 45C and 0.308 C/s at 85C
# (the top of the armed range for a 100C target); through the 8.8s sensor lag a
# 2C measured gain from a standing start takes about 10s. Against that, 120s is
# roughly a 6x margin and 60s roughly 3x.
#
# THIS IS NOT ONLY A COMMENT FIX, AND THE NEXT READER SHOULD NOT TREAT IT AS
# ONE. check_gain_time is a detection deadline: margin against a false trip is
# the same quantity as delay before a real heater fault is caught. The draught
# that made slow gain normal -- the whole reason a short deadline would
# nuisance-trip -- is what these two changes remove. Note also what the table
# above already said before either landed: compare its "100C at 60s" column
# against the "60C now" bar and 60s clears at 60s, 120s and 180s wipes, failing
# only at 240s, which is outside the 60-120s the wipe can actually be. 120 was
# the more conservative of two values that both cleared, not the only one that
# did.
#
# So this block no longer contains an argument for 120 over 60. It wants
# re-deriving on the bench once KAN-224 and KAN-221 are both in, and if that
# lands on 60 it is a change to make on purpose rather than a reversion to the
# Klipper default to be avoided. It is left at 120 here for three reasons and
# none of them is that 60 is wrong: 120 is the value the shipped derivation was
# actually done for; shortening a thermal-safety deadline should not be a side
# effect of a wipe-fan change; and 120 still buys margin against a wipe that
# some future change lengthens again, which is the case the 240s row shows 60
# losing. KAN number pending.
#
# WHAT IS STILL DETECTED AT 120s. Any bed that fails to gain 2C in 120s while
# commanded to heat is still shut down, one second after the window closes. That
# is the entire fault set this check has ever covered: a dead heater, an open or
# shorted FET, a disconnected bed cable, a thermistor that has come off the
# plate, and a thermistor stuck at a fixed reading. None of those can produce a
# 2C rise, so none of them becomes invisible -- each is caught 60s later than
# before, and nothing else changes. On this bed 60s costs 23C: 170W into
# 319.565 J/K against 1.19495 W/K of loss puts a runaway plate at 54C after the
# old 61s and 77C after the new 121s, from a 25C start. The plate's asymptote is
# 170/1.19495 = 142C over ambient with a 267s time constant, so it cannot reach
# anywhere dangerous inside either window. max_temp: 130 on [heater_bed] is the
# independent and immediate backstop for every failure in which the thermistor
# is still reading the plate.
#
# WHERE THIS STOPS WORKING, AND WHAT NOT TO DO ABOUT IT. Past a wipe of roughly
# 270s the bed reaches target while the fan is still blowing, the climb stops,
# and no value of check_gain_time helps: the guard can then only go quiet by
# reaching target - hysteresis, which needs A <= hysteresis / (target - air) =
# 15/75 = 0.20 at a 100C target against 15/35 = 0.43 at 60C. That floor is the
# real reason a 65C cap worked. Do NOT answer it by raising hysteresis: matching
# the 60C path at a 100C target would take hysteresis of about 33C, and unlike
# check_gain_time hysteresis is the point at which the guard stops looking at all
# for the rest of the print, so it would leave a bed sitting 33C under target
# unremarked. Keep the wipe short instead -- which is also why fan_pct in
# nozzle_wipe.cfg should not be lowered, since the fan there is the nozzle
# cooler and a smaller one lengthens COOL_WIPE.
hysteresis: 15
check_gain_time: 120



[fan]
pin: gpio7
max_power: 1.0
hardware_pwm: True
cycle_time: 0.00005 #20khz
shutdown_speed: 0.0
off_below: 0.0
tachometer_pin: gpio2
tachometer_poll_interval: 0.00025 #20/(2*40000)
kick_start_time: 0.0

[temperature_fan CPU]
pin: gpio11
tachometer_pin: gpio13
max_power: 1
shutdown_speed: 0.0
hardware_pwm: True
cycle_time: 0.00005 #20khz

min_temp: -40
max_temp: 150
sensor_type: temperature_host

control: watermark
target_temp: 65

max_speed: 0.40
#TODO, COMBINED TEMP WITH RP2040 Builtin micro-controller temperature sensor rather than just cm4
kick_start_time: 0.0

[temperature_fan Motor_Drivers]
pin: gpio10
tachometer_pin: gpio14
max_power: 1
shutdown_speed: 0.0
hardware_pwm: True
cycle_time: 0.00005 #20khz

min_temp: -40
max_temp: 150
sensor_type: CMFD473F4050HANT
sensor_pin: gpio26

control: curve
points:
  44.9, 0
  45, 0.25
  70, 0.6
  79.9, 1.0
  #realy audible above 0.6
target_temp: 80

max_speed: 1.0#0.25
min_speed: 0.0
kick_start_time: 0.0


[power_fan Power_Supply]
pin: gpio9
tachometer_pin: gpio12
max_power: 1.0
shutdown_speed: 0.0
hardware_pwm: True
cycle_time: 0.00005 #20khz

system_voltage: 45.0
sample_interval: 0.5
filter_time: 5.0
min_speed_delta: 0.02

resistive_loads:
  heater_bed, 12
  extruder, 12

stepper_loads:
  stepper_x, 5.0
  stepper_y, 5.0
  stepper_z, 5.0
  extruder, 5.0

fan_loads:
  fan, 30.0

fixed_loads:
  controller, 7.0

points:
  0, 0.0
  40, 0.0
  70, 0.2
  180, 0.5
  300, 1.0

# KAN-230: a brief full-power kick when the fan starts or is stepped up
# sharply, to break stiction, so PSU_FAN_CHECK has less of a blind window
# to tolerate after every start. Matched A/B on an identical bed-heater
# step, time from commanded-on to first tacho reading:
#
#   kick 0.0   n=3   mean 0.92 s   max 1.25 s   150-617 rpm at first read
#   kick 0.5   n=5   mean 0.65 s   max 0.76 s   1949-2000 rpm
#
# Not just faster to register - the fan is properly turning by then rather
# than barely creeping, which is the point of a kick-start.
kick_start_time: 0.5


[temperature_sensor toolhead_fan_air]
sensor_type: CMFD473F4050HANT
sensor_pin: toolhead:gpio29

[temperature_sensor toolhead_extruder_motor]
sensor_type: CMFD473F4050HANT
sensor_pin: toolhead:gpio26


[temperature_fan toolhead_heatsink]
pin: toolhead:gpio9
hardware_pwm: True
cycle_time: 0.00001
tachometer_pin: toolhead:gpio11

max_power: 1.0
min_temp: -50
max_temp: 100

sensor_type: CMFD473F4050HANT
sensor_pin: toolhead:gpio28

control: curve
points:
  37.9, 0
  38, 0.3
  45, 0.85
  50, 1.0
target_temp: 65
min_speed: 0
max_speed: 1
cooling_hysteresis: 1

# KAN-227: full, not half. This applies ONLY on an MCU shutdown - fan.py calls
# setup_max_duration(0.) for this pin, so there is no host-comms watchdog on it
# and the value is unreachable in normal operation. In a shutdown the extruder
# heater is on the same toolhead MCU and dies within MAX_HEAT_TIME, so what is
# left is a possibly-hot nozzle with no control loop. The right answer there is
# the heatsink fan flat out. temperature_fan.py constructs its Fan with
# default_shutdown_speed=1. for exactly this reason; 0.5 overrode it.
shutdown_speed: 1.0
kick_start_time: 0.0







[neopixel Left]
pin: gpio4
chain_count: 40
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
output_gamma: 2.2

[neopixel Right]
pin: gpio8
chain_count: 40
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
output_gamma: 2.2



[force_move]
# KAN-60. This said "#todo disable for production". Do not do that: it
# would brick the machine, not harden it.
#
# In this fork force_move.py also gates SET_KINEMATIC_POSITION on this
# flag, and the shipped config calls SET_KINEMATIC_POSITION from 23 sites
# -- every branch of G28, _HOME_X/_HOME_Y/_HOME_Z, filament load and
# unload, and position.cfg. FORCE_MOVE itself is called from toolhead.cfg
# to retract the extruder before the umbilical unlock, which has to work
# with a cold hot end and so cannot use G1 E (min_extrude_temp: 160).
# Setting this false removes all of those commands and homing stops
# working on every unit in the field.
#
# force_move.py now registers SET_KINEMATIC_POSITION unconditionally, as
# upstream Klipper does, so this flag governs only FORCE_MOVE. The
# remaining blocker to setting it false is the unlock retract above,
# tracked separately. Note that nothing in the tree currently restricts
# who can reach the G-code endpoint, so this flag is presently unguarded
# on a shipped machine -- that is the reason to keep the follow-up moving,
# not a reason to flip it here.
#
# Asserted by recipes/klipper_moonraker_fluidd/tests/test_production_config.py
# in MuonOS, which pins the value so a change here is deliberate.
enable_force_move = true
