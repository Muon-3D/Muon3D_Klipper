#####################################################################
#   Homing Macros
#####################################################################

[force_move]
enable_force_move: true


### LOAD CELL HOMING PROCEDURE
#https://www.klipper3d.org/Load_Cell.html#homing-macros

[homing_override]
gcode:
  _LOAD_CELL_HOME_Z
axes: z

[gcode_macro _HOME_Z_FROM_LAST_PROBE]
gcode:
    {% set z_probed = printer.probe.last_probe_position.z %}
    {% set z_position = printer.toolhead.position[2] %}
    {% set z_actual = z_position - z_probed %}
    SET_KINEMATIC_POSITION Z={z_actual}

[gcode_macro _LOAD_CELL_HOME_Z]
# tolerance: how far apart (mm) the confirming tap's samples may be, for the
# next home only. 0 is the [load_cell_probe] samples_tolerance. _HOME_Z sets
# it (G28 TOLERANCE=), and it is reset here first, so a failed home never
# leaves a loose tolerance behind for the next one.
variable_tolerance: 0
gcode:
    {% set tol = printer["gcode_macro _LOAD_CELL_HOME_Z"].tolerance|float(0) %}
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_HOME_Z VARIABLE=tolerance VALUE=0
    SET_GCODE_OFFSET Z=0  # load cell probes dont need a Z offset
    # position toolhead for homing Z, edit for your printers size
    #G90  # absolute move
    #G1 Y50 X50 F{5 * 60}  # move to X/Y position for homing

    # soft home the z axis to its limit so it can be moved:
    SET_KINEMATIC_POSITION Z={printer.toolhead.axis_maximum[2]}

    # Fast approach and tap
    LOAD_CELL_TARE
    PROBE PROBE_SPEED=15 LIFT_SPEED=10 SAMPLES=1
    _HOME_Z_FROM_LAST_PROBE

    # lift z to 1mm
    G91  # relative move
    G1 Z1 F{10 * 60}

    # # probe at standard speed
    PROBE{" SAMPLES_TOLERANCE=%.3f" % tol if tol > 0}
    _HOME_Z_FROM_LAST_PROBE

    # lift z to 10mm for clearance
    G91  # relative move
    G1 Z10 F{10 * 60}






# Cancel and close any open prompt
[gcode_macro CANCEL_AND_CLOSE]
gcode:
  CANCEL_PRINT
  RESPOND TYPE=command MSG="action:prompt_end"

# ---------- Unified gate for homing ----------
# Z=1 (the default) is the gate for Z homing: the Z column locked and the bed
# plate fitted, because Z homes by tapping the plate. Z=0 is the gate for an
# X/Y-only home: the Z column only has to be plugged in (locked or not), so
# the gantry is known to be clear, and the bed is not needed. Both need the
# toolhead: the X/Y endstops are taps on its accelerometer.
[gcode_macro HOMING_GATE]
description: Block homing until the toolhead, Z column and (for Z) bed are OK
gcode:
  RESPOND TYPE=command MSG=action:prompt_end

  {% set for_z = params.Z|default(1)|int %}
  # default(True) is deliberate: an absent key must refuse to home,
  # not open the gate. Undefined is falsy, so without it a rename reads as OK.
  {% set toolhead_ok = not printer['mcu toolhead'].non_critical_disconnected|default(True) %}
  {% set bed_ok = not for_z or not printer.bed_removal_detector.bedRemoved|default(True) %}
  {% set z_state = printer.z_power.z|default("unknown") %}
  {% if for_z %}
    {% set z_ok = z_state == "locked" %}
  {% else %}
    # z_power decides (xy_requires_column lets a development unit run
    # without a column).
    {% set z_ok = printer.z_power.xy_allowed|default(False) %}
  {% endif %}

  {% if not toolhead_ok or not bed_ok or not z_ok %}
    M117 Homing blocked
    RESPOND TYPE=command MSG="action:prompt_begin Homing blocked"
    {% if not toolhead_ok %} RESPOND TYPE=command MSG="action:prompt_text • Connect the toolhead umbilical" {% endif %}
    {% if not bed_ok %}     RESPOND TYPE=command MSG="action:prompt_text • Re-attach the bed"                 {% endif %}
    {% if not z_ok and for_z %} RESPOND TYPE=command MSG="action:prompt_text • Fit the Z column and push the locking lever down" {% endif %}
    {% if not z_ok and not for_z %} RESPOND TYPE=command MSG="action:prompt_text • Fit the Z column" {% endif %}
    # The callback is quoted: unquoted, Klipper keeps only its first word,
    # and CONTINUE on a blocked "G28 X Y" ran a bare G28 (Z included).
    RESPOND TYPE=command MSG="action:prompt_footer_button CONTINUE|HOMING_GATE Z={for_z} CALLBACK='{params.CALLBACK}'|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button CANCEL|CANCEL_AND_CLOSE|error"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    {params.CALLBACK}
  {% endif %}

# ---------- G28 orchestrator ----------
[gcode_macro G28]
rename_existing: G28.1
description: Homing with a Z lift first + hardcoded Z gate
gcode:
  {% set RP = rawparams|default("")|upper %}
  {% set TOK = RP.split() %}
  # The axes asked for. A word made only of X, Y and Z names each of them
  # ("XY", "ZX"), and an axis with a number names that axis ("X0 Y0", as
  # Marlin slicers write it; the number is ignored, as in stock Klipper).
  # Before 2026-11-10 only a bare "X", "Y" or "Z" counted, so "G28 XY" and
  # "G28 X0" homed all three axes, Z included (Harry, on sloe).
  {% set AX = [] %}
  {% for t in TOK if '=' not in t %}
    {% if t|replace("X", "")|replace("Y", "")|replace("Z", "") == "" %}
      {% set _ = AX.extend(t|list) %}
    {% elif t[0] in "XYZ" and t[1:]|float(none) is not none %}
      {% set _ = AX.append(t[0]) %}
    {% endif %}
  {% endfor %}
  {% set rq_all = not AX %}
  {% set rq_x = 'X' in AX %}
  {% set rq_y = 'Y' in AX %}
  {% set rq_z = 'Z' in AX %}
  {% set OPT  = 'O' in TOK %}
  # G28 is a traditional G-code, so Klipper parses PARK=0 as PARK with the
  # value "=0". Strip the "=", or X_OFFSET=-5 reads as 0 and PARK=1 as 0
  # (both did, before 2026-11-08).
  {% set PARK = params.PARK|default("1")|string|replace("=", "")|int(1) %}
  {% set X_OFFSET = params.X_OFFSET|default("0")|string|replace("=", "")|float(0) %}
  # TOLERANCE: the Z home's confirming tap may differ this much (mm), for a
  # rough home on a nozzle that may carry ooze. 0 is the probe's own.
  {% set TOLERANCE = params.TOLERANCE|default("0")|string|replace("=", "")|float(0) %}

  {% set HA = printer.toolhead.homed_axes|default("") %}
  {% set home_x = (rq_all or rq_x) and not (OPT and ('x' in HA)) %}
  {% set home_y = (rq_all or rq_y) and not (OPT and ('y' in HA)) %}
  {% set home_z = (rq_all or rq_z) and not (OPT and ('z' in HA)) %}
  # Z homes by tapping the plate at X100 Y60 (_HOME_Z), so it needs X and
  # Y. Without this, "G28 Z" on an unhomed machine lifted Z and then
  # failed on that move with "Must home axis first".
  {% set home_x = home_x or (home_z and 'x' not in HA) %}
  {% set home_y = home_y or (home_z and 'y' not in HA) %}

  # default: proceed with homing
  {% set proceed = 1 %}

  # B1: an X/Y-only home needs the Z column plugged in (locked or not), so
  # the gantry is known to be clear, and the toolhead, whose accelerometer
  # is the X/Y endstop. Not the bed: only Z homing touches it. Z homing
  # needs the column locked as well (below). Same rules as HOMING_GATE.
  # default(True) is deliberate: an absent key must refuse to home,
  # not open the gate. Undefined is falsy, so without it a rename reads as OK.
  {% set z_state = printer.z_power.z|default("unknown") %}
  {% set z_present = printer.z_power.xy_allowed|default(False) %}
  {% set z_ok = z_state == "locked" %}
  {% set toolhead_ok = not printer['mcu toolhead'].non_critical_disconnected|default(True) %}
  {% if not home_z and (home_x or home_y) and not (z_present and toolhead_ok) %}
    HOMING_GATE Z=0 CALLBACK="G28 {rawparams}"
    {% set proceed = 0 %}
  {% endif %}

  # If Z is requested, hard-gate before any moves (toolhead + bed + column)
  {% if home_z %}
    {% set bed_ok = not printer.bed_removal_detector.bedRemoved|default(True) %}
    {% if not (toolhead_ok and bed_ok and z_ok) %}
      HOMING_GATE CALLBACK="G28 {rawparams}"
      {% set proceed = 0 %}
    {% endif %}
  {% endif %}

  {% if proceed %}
    # Lift the nozzle clear of the plate before anything moves.
    # Z homed: up to Z10 by a normal move, and Z stays homed. Before
    #   2026-11-10 every G28 made the blind lift below, so "G28 X Y" also
    #   forgot Z, and a homed Z already above 10 still went up 10.
    # Z not homed: the position is unknown, so lift 10 mm blind, stopping
    #   on a stall. Z stays unhomed. (A z_lifted_once flag used to skip
    #   this after a G28 that failed part way, which is exactly when the
    #   nozzle may be down on the plate.)
    {% set lift_dist = 10|float %}
    {% set z_homed  = 'z' in HA %}
    {% set z_pos    = printer.toolhead.position.z|float %}
    {% set any_home = (home_x or home_y or home_z) %}

    {% if any_home and z_homed %}
      {% if z_pos < lift_dist %}
        SAVE_GCODE_STATE NAME=G28_LIFT
        G90
        G1 Z{lift_dist} F600
        RESTORE_GCODE_STATE NAME=G28_LIFT
      {% endif %}
    {% elif any_home %}
      SET_KINEMATIC_POSITION Z=100 SET_HOMED=Z
      AXIS_PROTECTED_MOVE AXIS=Z DIST={lift_dist}
      SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
    {% endif %}

    # Homing sequence. X and Y share one homing-current change.
    {% if home_x or home_y %} _HOMING_CURRENT {% endif %}
    {% if home_y %} _HOME_Y {% endif %}
    {% if home_x %} _HOME_X {% endif %}
    {% if home_x or home_y %} _HOMING_CURRENT RESTORE=1 {% endif %}
    {% if home_z %} _HOME_Z PARK={PARK} X_OFFSET={X_OFFSET} TOLERANCE={TOLERANCE} {% endif %}
  {% endif %}


# ---------- X/Y homing current ----------
# X and Y home at a lower motor current. Each SET_TMC_CURRENT waits ~0.1 s
# for its register write, so G28 sets it once for all axes and restores it
# once at the end; _HOME_X/_HOME_Y set and restore it only when called on
# their own (when the current is not already the homing current).
[gcode_macro _HOMING_CURRENT]
description: X/Y motors to the homing current, or RESTORE=1 to run_current
variable_current: 0.6
gcode:
  {% if params.RESTORE|default(0)|int %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer.configfile.settings['tmc2241 stepper_x'].run_current|float}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer.configfile.settings['tmc2241 stepper_y'].run_current|float}
  {% else %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={current}
  {% endif %}

# ---------- Axis helpers (kept straightforward) ----------
[gcode_macro _HOME_X]
gcode:
  SAVE_GCODE_STATE NAME=STATE_HOME_X
  # First, move y back to make sure we dont colide with the fillament cutter arm.
  {% set y_homed = ("y" in printer.toolhead.homed_axes) %}
  {% set x_homed = ("x" in printer.toolhead.homed_axes) %}
  {% set z_homed = ("z" in printer.toolhead.homed_axes) %}
  {% set x_pos = printer.toolhead.position.x|float %}
  {% set x_max = printer.toolhead.axis_maximum.x|float %}
  {% if not y_homed %}
    SET_KINEMATIC_POSITION Y=100 X=100 SET_HOMED=YX
  {% endif %}
  {% if not x_homed %}
    SET_KINEMATIC_POSITION X=100 SET_HOMED=X
  {% endif %}
  {% if not z_homed %}
      SET_KINEMATIC_POSITION SET_HOMED=Z
  {% endif %}

  {% if y_homed %}
    {% set y_pos = printer.toolhead.position.y %}
    {action_respond_info("Y position: %.3f" % y_pos)}
    {% if y_pos <= 10 %}
      G90
      G1 Y10 F4800
    {% elif y_pos >= 20 %}
      #prevent x having to home right at the end where pulleys can rub
      G91
      G1 Y-10 F4800
    {% endif %}
  {% else %}
    AXIS_PROTECTED_MOVE AXIS=Y DIST=10 SPEED={printer.configfile.settings.stepper_y.homing_speed}
  {% endif %}

  # Run-up: the tap endstop only arms homing_tap_arm_delay (0.1 s) into a
  # homing move, 6 mm at homing_speed 60, so a stop reached sooner is not
  # seen and the axis grinds. Back off until the stop is at least 10 mm
  # away first. The back-offs are AXIS_PROTECTED_MOVEs at the axis homing
  # speed: from an unknown position they stop on a tap (after the same 6 mm
  # arm delay) instead of driving on into whatever is there.
  {% if x_homed and y_homed %}
    {% set x_back = 10.0 - (x_max - x_pos) %}
  {% else %}
    {% set x_back = 10.0 %}
  {% endif %}
  {% if x_back > 2 %}
    AXIS_PROTECTED_MOVE AXIS=X DIST=-{x_back} SPEED={printer.configfile.settings.stepper_x.homing_speed}
  {% endif %}
  # No M400: the homing move starts after everything queued anyway, and
  # waiting for the queue to drain first only adds an idle gap.

  {% if not y_homed %}
    SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=YX
  {% endif %}
  {% if not x_homed %}
    SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=X
  {% endif %}
  {% if not z_homed %}
      SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
  {% endif %}

  {% set own_current = (printer['tmc2241 stepper_x'].run_current|float - printer['gcode_macro _HOMING_CURRENT'].current|float)|abs > 0.01 %}
  {% if own_current %}
    _HOMING_CURRENT
  {% endif %}
  G28.1 X


  RESTORE_GCODE_STATE NAME=STATE_HOME_X
  {% if own_current %}
    _HOMING_CURRENT RESTORE=1
  {% endif %}

[gcode_macro _HOME_Y]
gcode:
  SAVE_GCODE_STATE NAME=STATE_HOME_Y

    {% set y_homed = ("y" in printer.toolhead.homed_axes) %}
  {% set x_homed = ("x" in printer.toolhead.homed_axes) %}
  {% set z_homed = ("z" in printer.toolhead.homed_axes) %}
  {% if not y_homed %}
    SET_KINEMATIC_POSITION Y=100 SET_HOMED=Y
  {% endif %}
  {% if not x_homed %}
    SET_KINEMATIC_POSITION X=5 SET_HOMED=X
  {% endif %}
  {% if not z_homed %}
      SET_KINEMATIC_POSITION SET_HOMED=Z
  {% endif %}

  # Run-up: the tap endstop only arms homing_tap_arm_delay (0.1 s) into a
  # homing move, 6 mm at homing_speed 60, so a stop reached sooner is not
  # seen and the axis grinds. Back off until the stop is at least 10 mm
  # away first. The back-offs are AXIS_PROTECTED_MOVEs at the axis homing
  # speed: from an unknown position they stop on a tap (after the same 6 mm
  # arm delay) instead of driving on into whatever is there.
  {% set y_pos = printer.toolhead.position.y|float %}
  {% set y_max = printer.toolhead.axis_maximum.y|float %}
  {% if y_homed %}
    {% set y_back = 10.0 - (y_max - y_pos) %}
  {% else %}
    {% set y_back = 10.0 %}
  {% endif %}
  {% if y_back > 2 %}
    AXIS_PROTECTED_MOVE AXIS=Y DIST=-{y_back} SPEED={printer.configfile.settings.stepper_y.homing_speed}
  {% endif %}
  # No M400: the homing move starts after everything queued anyway, and
  # waiting for the queue to drain first only adds an idle gap.

  {% if not y_homed %}
    SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Y
  {% endif %}
  {% if not x_homed %}
    SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=X
  {% endif %}
  {% if not z_homed %}
      SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
  {% endif %}


  {% set own_current = (printer['tmc2241 stepper_x'].run_current|float - printer['gcode_macro _HOMING_CURRENT'].current|float)|abs > 0.01 %}
  {% if own_current %}
    _HOMING_CURRENT
  {% endif %}
  G28.1 Y
  RESTORE_GCODE_STATE NAME=STATE_HOME_Y
  {% if own_current %}
    _HOMING_CURRENT RESTORE=1
  {% endif %}

[gcode_macro _HOME_Z]
gcode:
  {% set x_offset = params.X_OFFSET|default(0)|float %}
  {% set x_home = 100 + x_offset %}
  SAVE_GCODE_STATE NAME=STATE_HOME_Z
  SET_KINEMATIC_POSITION SET_HOMED=Z
  G90
  G0 X{x_home} Y60 F7800
  M400
  {% if params.TOLERANCE|default(0)|float(0) > 0 %}
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_HOME_Z VARIABLE=tolerance VALUE={params.TOLERANCE|float}
  {% endif %}
  G28.1 Z
  # G90 first: _LOAD_CELL_HOME_Z ends in relative mode (G91), so this was
  # 10 mm more, not Z10, and the head finished at about Z20.
  G90
  G0 Z10 F7800
  # KAN-226: park with margin instead of at X200. axis_maximum.x is 200.1,
  # and auto_skew derives XZ/YZ factors from the bed plane that shift X as a
  # function of Z - about +0.115 mm at travel height. X200 then resolves to
  # 200.115 and a bare G28 dies with "Move out of range". PRINT_START never
  # hit it because it passes PARK=0; Home All from the UI does.
  # Park at the homing corner (back right), not the front: X and Y home by
  # driving into their stops at homing_speed (60 mm/s) from wherever the
  # head is, so a head left at Y0 costs the next G28 the full 174 mm of Y
  # (~3 s) while a head left here costs it the 5 mm back-off. Same margin
  # on Y as on X: auto_skew shifts Y with Z as well, and axis_maximum.y
  # is 174.1.
  {% set _park_x = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set _park_y = printer.toolhead.axis_maximum.y|float - 5.0 %}
  {% if params.PARK|default(1)|int %} G0 X{_park_x} Y{_park_y} F7800 {% endif %}
  M400
  RESTORE_GCODE_STATE NAME=STATE_HOME_Z

# Convenience alias: conditional home
[gcode_macro CHOME]
gcode:
  G28 O
