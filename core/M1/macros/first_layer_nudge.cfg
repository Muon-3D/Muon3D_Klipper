#####################################################################
#   First-layer Z nudge safety cap
#####################################################################

[gcode_macro _FIRST_LAYER_NUDGE_RESET]
description: Reset the per-print first-layer Z nudge budget
gcode:
    {% set baseline = printer.gcode_move.homing_origin.z|float %}
    SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=baseline_z_offset VALUE={"%.6f"|format(baseline)}
    SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=net_adjustment VALUE=0.0
    SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=armed VALUE=1


[gcode_macro _FIRST_LAYER_NUDGE_DISARM]
description: Prevent first-layer Z nudges outside the print which armed them
gcode:
    SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=armed VALUE=0


[gcode_macro FIRST_LAYER_NUDGE]
description: Move the nozzle 0.01 mm closer or further during layers 1 through 3
variable_baseline_z_offset: 0.0
variable_net_adjustment: 0.0
variable_armed: 0
gcode:
    {% set state = printer.print_stats.state|default("")|string|lower %}
    {% set paused = printer.pause_resume.is_paused|default(false) %}
    {% set layer = printer.print_stats.info.current_layer|default(0, true)|int %}
    {% set direction = params.DIRECTION|default("")|string|upper %}
    {% set me = printer["gcode_macro FIRST_LAYER_NUDGE"] %}
    {% set current_net = printer.gcode_move.homing_origin.z|float - me.baseline_z_offset|float %}

    {% if params|length != 1 or direction not in ["CLOSER", "FURTHER"] %}
        {action_raise_error("FIRST_LAYER_NUDGE requires exactly DIRECTION=CLOSER or DIRECTION=FURTHER; each call is one 0.01 mm step")}
    {% elif not me.armed|int %}
        {action_raise_error("FIRST_LAYER_NUDGE refused: PRINT_START has not armed nudging for this print")}
    {% elif paused or state != "printing" %}
        {action_raise_error("FIRST_LAYER_NUDGE refused: a print must be actively printing and not paused")}
    {% elif layer < 1 or layer > 3 %}
        {action_raise_error("FIRST_LAYER_NUDGE refused: current layer is %d; only layers 1 through 3 are allowed" % layer)}
    {% else %}
        {% set step = -0.01 if direction == "CLOSER" else 0.01 %}
        {% set new_net = current_net + step %}
        {% if new_net|abs > 0.100001 %}
            {action_raise_error("FIRST_LAYER_NUDGE refused: requested step would exceed the +/-0.10 mm cap from the PRINT_START Z-offset baseline (current net %.2f mm)" % current_net)}
        {% else %}
            SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=net_adjustment VALUE={"%.6f"|format(new_net)}
            SET_GCODE_OFFSET Z_ADJUST={"%.2f"|format(step)} MOVE=1
            RESPOND TYPE=echo MSG="First-layer nozzle nudge: net {'%.2f'|format(new_net)} mm from starting Z offset {'%.3f'|format(me.baseline_z_offset|float)} mm"
        {% endif %}
    {% endif %}
