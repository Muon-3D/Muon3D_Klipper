#####################################################################
#   First-layer Z nudge safety cap
#####################################################################

[gcode_macro _FIRST_LAYER_NUDGE_RESET]
description: Consume PRINT_START's one-shot token and reset the nudge budget
gcode:
    {% set me = printer["gcode_macro FIRST_LAYER_NUDGE"] %}
    {% if not me.reset_token|int %}
        {action_raise_error("_FIRST_LAYER_NUDGE_RESET refused: only PRINT_START may reset the nudge budget")}
    {% else %}
        {% set baseline = printer.gcode_move.homing_origin.z|float %}
        {% set filename = printer.print_stats.filename|default("")|string %}
        {% set marker = me.print_marker|int + 1 %}
        {% set started = printer.print_stats.total_duration|default(0.0)|float %}
        SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=baseline_z_offset VALUE={"%.6f"|format(baseline)}
        SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=last_reported_net VALUE=0.0
        SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=armed_filename VALUE='{filename|tojson}'
        SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=armed_start_duration VALUE={"%.6f"|format(started)}
        SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=print_marker VALUE={marker}
        SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=armed_marker VALUE={marker}
        SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=reset_token VALUE=0
        SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=armed VALUE=1
    {% endif %}


[gcode_macro _FIRST_LAYER_NUDGE_ALLOW_RESET]
description: Give the next PRINT_START reset a one-shot token
gcode:
    SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=reset_token VALUE=1


[gcode_macro _FIRST_LAYER_NUDGE_DISARM]
description: Prevent first-layer Z nudges outside the print which armed them
gcode:
    SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=armed VALUE=0


[gcode_macro _FIRST_LAYER_NUDGE_IDENTITY_REFUSAL]
description: Raise only after the stale print authorization has been disarmed
gcode:
    {action_raise_error("FIRST_LAYER_NUDGE refused: armed print identity no longer matches the current print")}


[gcode_macro FIRST_LAYER_NUDGE]
description: Move 0.01 mm during 1-based layers 1-3; None/0 are refused fail-safe
variable_baseline_z_offset: 0.0
variable_last_reported_net: 0.0
variable_armed: 0
variable_reset_token: 0
variable_armed_filename: ''
variable_armed_start_duration: 0.0
variable_print_marker: 0
variable_armed_marker: 0
gcode:
    {% set state = printer.print_stats.state|default("")|string|lower %}
    {% set paused = printer.pause_resume.is_paused|default(false) %}
    {% set layer = printer.print_stats.info.current_layer|default(0, true)|int %}
    {% set direction = params.DIRECTION|default("")|string|upper %}
    {% set me = printer["gcode_macro FIRST_LAYER_NUDGE"] %}
    {% set current_net = printer.gcode_move.homing_origin.z|float - me.baseline_z_offset|float %}
    {% set current_um = (current_net * 1000.0)|round(0)|int %}
    {% set step_um = -10 if direction == "CLOSER" else 10 %}
    {% set candidate = current_net + step_um / 1000.0 %}
    {% set candidate_um = current_um + step_um %}
    # Formatting removes binary float noise from exact 0.01 mm steps, without
    # widening the decimal boundary or hiding a real sub-micrometre excess.
    {% set fractional_net = ("%.9f"|format(current_net - current_um / 1000.0))|float %}
    {% set candidate_outside = (("%.6f"|format(candidate))|float|abs > 0.1
                                or (candidate_um|abs == 100 and fractional_net != 0.0)) %}
    {% set filename = printer.print_stats.filename|default("")|string %}
    {% set elapsed = printer.print_stats.total_duration|default(0.0)|float %}
    {% set print_matches = (filename == me.armed_filename|string
                            and me.armed_marker|int == me.print_marker|int
                            and elapsed >= me.armed_start_duration|float) %}

    {% if params|length != 1 or direction not in ["CLOSER", "FURTHER"] %}
        {action_raise_error("FIRST_LAYER_NUDGE requires exactly DIRECTION=CLOSER or DIRECTION=FURTHER; each call is one 0.01 mm step")}
    {% elif not me.armed|int %}
        {action_raise_error("FIRST_LAYER_NUDGE refused: PRINT_START has not armed nudging for this print")}
    {% elif not print_matches %}
        _FIRST_LAYER_NUDGE_DISARM
        _FIRST_LAYER_NUDGE_IDENTITY_REFUSAL
    {% elif paused or state != "printing" %}
        {action_raise_error("FIRST_LAYER_NUDGE refused: a print must be actively printing and not paused")}
    {% elif layer < 1 or layer > 3 %}
        {action_raise_error("FIRST_LAYER_NUDGE refused: current layer is %d; only layers 1 through 3 are allowed" % layer)}
    {% else %}
        {% set step = step_um / 1000.0 %}
        {% set new_net = candidate_um / 1000.0 %}
        {% if candidate_um|abs > 100 or candidate_outside %}
            {action_raise_error("FIRST_LAYER_NUDGE refused: requested step would exceed the +/-0.10 mm cap from the PRINT_START Z-offset baseline (current net %.2f mm)" % current_net)}
        {% else %}
            SET_GCODE_VARIABLE MACRO=FIRST_LAYER_NUDGE VARIABLE=last_reported_net VALUE={"%.6f"|format(new_net)}
            SET_GCODE_OFFSET Z_ADJUST={"%.2f"|format(step)} MOVE=1 MOVE_SPEED=5
            RESPOND TYPE=echo MSG="First-layer nozzle nudge: net {'%.2f'|format(new_net)} mm from starting Z offset {'%.3f'|format(me.baseline_z_offset|float)} mm"
        {% endif %}
    {% endif %}
