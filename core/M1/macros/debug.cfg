[gcode_macro BUZZ_EXTRUDER]
description: "Buzz the extruder motor back and forth rapidly (filament removed!)"
# You can call like “BUZZ_EXTRUDER COUNT=40 LENGTH=5 SPEED=8000”
# COUNT = number of back‐and‐forth cycles
# LENGTH = extrusion amount (mm) for each direction
# SPEED = feedrate (mm/min)
gcode:
    {% set count  = params.COUNT  | default(20) | int    %}
    {% set length = params.LENGTH | default(10)  | float  %}
    {% set speed  = params.SPEED  | default(10000) | int %}

    # Ensure we start from E=0 (optional; comment out if you prefer)
    G92 E0

    # Loop: extrude forward then backward, quickly, count times
    {% for i in range(count) %}
    G1 E{length}  F{speed}
    G1 E-{length} F{speed}
    {% endfor %}

    # Reset extruder position when done
    G92 E0




[gcode_macro WEAR_TEST]
description: Wear-test Z axis: 5 → 150 mm @30 mm/s for one week AND PROBE
gcode:
    {% set start_z = 5 %}
    {% set end_z = 150 %}
    {% set speed = 30 %}            
    {% set feed = speed * 60 %}     
    {% set cycle_s = 2*(end_z - start_z) / speed %}
    {% set total_s = 7*24*3600 %}
    {% set loops = (total_s / cycle_s) | int %}
    G21                         
    G90                         
    G1 Z{start_z} F{feed}  
    {% for i in range(loops) %}
    DEPLOY_PROBE
    G1 Z{end_z} F{feed}  
    QUERY_ENDSTOPS 
    RETRACT_PROBE  
    G1 Z{start_z} F{feed}  
    QUERY_ENDSTOPS 
    M118 wear AND PROBE test: {i+1} cycles
    {% endfor %}
    



[gcode_macro TEST_SPEED]
# Home, get position, throw around toolhead, home again.
# If MCU stepper positions (first line in GET_POSITION) are greater than a full step different (your number of microsteps), then skipping occured.
# We only measure to a full step to accomodate for endstop variance.
# Example: TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=10

description: Test for max speed and acceleration parameters for the printer. Procedure: Home -> ReadPositionFromMCU -> MovesToolhead@Vel&Accel -> Home -> ReadPositionfromMCU

gcode:
    # Speed
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(5)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    # Minimum Cruise Ratio
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    # Bounding inset for large pattern (helps prevent slamming the toolhead into the sides after small skips, and helps to account for machines with imperfectly set dimensions)
    {% set bound = params.BOUND|default(20)|int %}
    # Size for small pattern box
    {% set smallpatternsize = params.SMALLPATTERNSIZE|default(20)|int %}
    
    # Large pattern
        # Max positions, inset by BOUND
        {% set x_min = printer.toolhead.axis_minimum.x %}
        {% if x_min < 0 %}
            {% set x_min = 0 %}
        {% endif %}
    
        {% set y_min = printer.toolhead.axis_minimum.y %}
        {% if y_min < 0 %}
            {% set y_min = 0 %}
        {% endif %}
    
        {% set x_min = x_min + bound %}
        {% set x_max = printer.toolhead.axis_maximum.x - bound %}
        {% set y_min = y_min + bound %}
        {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    
    # Small pattern at center
        # Find X/Y center point
        {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
        {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
        
        # Set small pattern box around center point
        {% set x_center_min = x_center - (smallpatternsize/2) %}
        {% set x_center_max = x_center + (smallpatternsize/2) %}
        {% set y_center_min = y_center - (smallpatternsize/2) %}
        {% set y_center_max = y_center + (smallpatternsize/2) %}

    # Save current gcode state (absolute/relative, etc)
    SAVE_GCODE_STATE NAME=TEST_SPEED
    
    # Output parameters to g-code terminal
    { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }
    
    # Home and get position for comparison later:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28
        # QGL if not already QGLd (only if QGL section exists in config)
        {% if printer.configfile.settings.quad_gantry_level %}
            {% if printer.quad_gantry_level.applied == False %}
                QUAD_GANTRY_LEVEL
                G28 Z
            {% endif %}
        {% endif %} 
        # Move 50mm away from max position and home again (to help with hall effect endstop accuracy - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/24)
        G90
        G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 X Y
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Go to starting position
    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}

    # Set new limits
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    {% endif %}

    {% for i in range(iterations) %}
        # Large pattern diagonals
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        
        # Large pattern box
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
    
        # Small pattern diagonals
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        
        # Small pattern box
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}

    # Restore max speed/accel/accel_to_decel to their configured values
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio} 
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}

    # Re-home and get position again for comparison:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 # This is a full G28 to fix an issue with CoreXZ - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/12
        # Go to XY home positions (in case your homing override leaves it elsewhere)
        G90
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Restore previous gcode state (absolute/relative, etc)
    RESTORE_GCODE_STATE NAME=TEST_SPEED
    


#####################################################################
#   STEPLOSS_TEST: lost X/Y steps after fast moves (bench only)
#####################################################################
# Measures where the X and Y tap stops trigger, runs COUNT cycles of fast
# diagonal and straight moves at SPEED and ACCEL, measures again and
# reports the shift. The tap repeats to about 0.01-0.03 mm and a lost full
# step is 0.2 mm (rotation_distance 40 / 200), so a shift over 0.1 mm is
# lost steps. On CoreXY one slipped motor shows in both X and Y.
#
#   STEPLOSS_TEST SPEED=600 ACCEL=12000 COUNT=20 STEALTH=-1 CURRENT=0
#     STEALTH  -1 keep the configured driver mode; 0 SpreadCycle only;
#              >0 StealthChop below that many mm/s, SpreadCycle above
#     CURRENT  0 keep run_current, else X/Y run current in A for the test
#
# Each run prints one STEPLOSS line; collect them to map where each mode
# holds (Harry, 2026-11-10: tune StealthChop or keep SpreadCycle). The
# driver mode and current go back to the configured ones at the end. The
# moves stay inside X 15-185, Y 25-155: clear of the cutter nub at the back
# and of the X/Y stops.
[gcode_macro STEPLOSS_TEST]
description: Bench: measure lost X/Y steps after fast moves at SPEED/ACCEL
variable_x_before: None
variable_y_before: None
variable_x_after: None
variable_y_after: None
gcode:
    {% set HA = printer.toolhead.homed_axes %}
    {% set speed = params.SPEED|default(600)|float %}
    {% set accel = params.ACCEL|default(12000)|float %}
    {% set count = params.COUNT|default(20)|int %}
    {% set stealth = params.STEALTH|default(-1)|float %}
    {% set current = params.CURRENT|default(0)|float %}
    {% if speed > printer.configfile.settings.printer.max_velocity|float %}
        {action_raise_error("STEPLOSS_TEST: SPEED is above max_velocity")}
    {% endif %}
    {% if not ('x' in HA and 'y' in HA) %}
        G28 X Y
    {% endif %}
    _STEPLOSS_LIFT
    # Both measurements in the configured mode and current, so only the
    # moves between them differ.
    _STEPLOSS_MEASURE SLOT=before
    _STEPLOSS_MODE STEALTH={stealth} CURRENT={current}
    _STEPLOSS_STRESS SPEED={speed} ACCEL={accel} COUNT={count}
    _STEPLOSS_MODE RESTORE=1
    _STEPLOSS_MEASURE SLOT=after
    _STEPLOSS_REPORT SPEED={speed} ACCEL={accel} COUNT={count} STEALTH={stealth} CURRENT={current}

[gcode_macro _STEPLOSS_LIFT]
gcode:
    {% set th = printer.toolhead %}
    {% if 'z' in th.homed_axes %}
        {% if th.position.z|float < 20 %}
            G90
            G1 Z20 F600
        {% endif %}
    {% else %}
        SET_KINEMATIC_POSITION Z=100 SET_HOMED=Z
        AXIS_PROTECTED_MOVE AXIS=Z DIST=15
        SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
    {% endif %}

# Driver mode and current for the test, or RESTORE=1 for the configured ones.
# en_pwm_mode only changes at standstill, which is where this runs.
[gcode_macro _STEPLOSS_MODE]
gcode:
    {% set cfg = printer.configfile.settings %}
    M400
    {% for s in ['stepper_x', 'stepper_y'] %}
        {% set tcfg = cfg['tmc2241 ' ~ s] %}
        {% if params.RESTORE|default(0)|int %}
            {% set st = tcfg.stealthchop_threshold|default(0)|float %}
            {% set cur = tcfg.run_current|float %}
        {% else %}
            {% set st = params.STEALTH|default(-1)|float %}
            {% set cur = params.CURRENT|default(0)|float %}
        {% endif %}
        {% if st == 0 %}
            SET_TMC_FIELD STEPPER={s} FIELD=en_pwm_mode VALUE=0
        {% elif st > 0 %}
            SET_TMC_FIELD STEPPER={s} FIELD=tpwmthrs VELOCITY={st}
            SET_TMC_FIELD STEPPER={s} FIELD=en_pwm_mode VALUE=1
        {% endif %}
        {% if cur > 0 %}
            SET_TMC_CURRENT STEPPER={s} CURRENT={cur}
        {% endif %}
    {% endfor %}

# Tap X then Y from 15 mm away, as a homing move would, and record where
# each triggered (printer.advanced_homing_movement.last). A stop that is not
# reached within the 15 mm reads as None: the axis is more than ~0.1 mm
# short of it.
[gcode_macro _STEPLOSS_MEASURE]
gcode:
    {% set th = printer.toolhead %}
    {% set xmax = th.axis_maximum.x|float %}
    {% set ymax = th.axis_maximum.y|float %}
    {% set slot = params.SLOT %}
    G90
    G1 X{xmax - 15} Y100 F7800
    _HOMING_CURRENT
    AXIS_PROTECTED_MOVE AXIS=X DIR=MAX DIST=15 SPEED={printer.configfile.settings.stepper_x.homing_speed}
    _HOMING_CURRENT RESTORE=1
    _STEPLOSS_SAVE AXIS=x SLOT={slot}
    G1 X{xmax - 15} F3000
    G1 X100 Y{ymax - 15} F7800
    _HOMING_CURRENT
    AXIS_PROTECTED_MOVE AXIS=Y DIR=MAX DIST=15 SPEED={printer.configfile.settings.stepper_y.homing_speed}
    _HOMING_CURRENT RESTORE=1
    _STEPLOSS_SAVE AXIS=y SLOT={slot}
    G1 Y{ymax - 15} F3000

[gcode_macro _STEPLOSS_SAVE]
gcode:
    {% set r = printer.advanced_homing_movement.last %}
    {% set pos = r.position if (r.axis == params.AXIS and r.triggered) else none %}
    SET_GCODE_VARIABLE MACRO=STEPLOSS_TEST VARIABLE={params.AXIS}_{params.SLOT} VALUE={pos if pos is not none else 'None'}

[gcode_macro _STEPLOSS_STRESS]
gcode:
    {% set cfg = printer.configfile.settings.printer %}
    {% set f = params.SPEED|float * 60 %}
    SET_VELOCITY_LIMIT VELOCITY={params.SPEED} ACCEL={params.ACCEL}
    G90
    G1 X15 Y25 F{f}
    {% for i in range(params.COUNT|int) %}
        G1 X185 Y155 F{f}
        G1 X15 Y155 F{f}
        G1 X185 Y25 F{f}
        G1 X185 Y155 F{f}
        G1 X15 Y25 F{f}
        G1 X185 Y25 F{f}
        G1 X15 Y155 F{f}
        G1 X15 Y25 F{f}
    {% endfor %}
    M400
    SET_VELOCITY_LIMIT VELOCITY={cfg.max_velocity} ACCEL={cfg.max_accel}

[gcode_macro _STEPLOSS_REPORT]
gcode:
    {% set t = printer["gcode_macro STEPLOSS_TEST"] %}
    {% set st = params.STEALTH|float %}
    {% set mode = 'config' if st < 0 else ('spreadcycle' if st == 0 else 'stealth<%d' % st) %}
    {% set ns = namespace(txt='', fail=0) %}
    {% for a in ['x', 'y'] %}
        {% set b = t[a ~ '_before'] %}
        {% set af = t[a ~ '_after'] %}
        {% if b is none %}
            {% set ns.txt = ns.txt ~ ' %s: no tap before' % a.upper() %}
            {% set ns.fail = 1 %}
        {% elif af is none %}
            {% set ns.txt = ns.txt ~ ' %s: no tap after (short by over 0.1 mm)' % a.upper() %}
            {% set ns.fail = 1 %}
        {% else %}
            {% set d = af - b %}
            {% set ns.txt = ns.txt ~ ' %s %+.3f mm (%+.1f steps)' % (a.upper(), d, d / 0.2) %}
            {% if d|abs > 0.1 %}{% set ns.fail = 1 %}{% endif %}
        {% endif %}
    {% endfor %}
    {action_respond_info("STEPLOSS %s speed=%d accel=%d count=%d mode=%s current=%s:%s" % ('FAIL' if ns.fail else 'PASS', params.SPEED|float, params.ACCEL|float, params.COUNT|int, mode, params.CURRENT if params.CURRENT|float > 0 else 'run', ns.txt))}
