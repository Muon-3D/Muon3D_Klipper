[gcode_macro PROBE_CALIBRATE]
rename_existing: PROBE_CALIBRATE_
gcode:
    CALIBRATE_PROBE

#todo chnage to force sensor on probe
#somthing like, tare, then place good ammount of force on nozzle, and call this 200g (max trvael of inverted force sensor)

[gcode_macro CALIBRATE_PROBE]
description: "Calibrate the Probes Z Offset"
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Probe Calibrate"
    # 2) Ask for confirmation
    RESPOND TYPE=command MSG="action:prompt_text Please fetch a piece of paper to perform Probe Z Offset Calibration"
    
    # 3) Footer buttons: Unload (primary) / Cancel (error)
    RESPOND TYPE=command MSG="action:prompt_footer_button I Have Paper, Continue|_DO_CALIBRATE_PROBE|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Help|_HELP_CALIBRATE_PROBE|info"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_CLOSE_CALIBRATE_PROBE|error"
    # 4) Show the prompt
    RESPOND TYPE=command MSG="action:prompt_show"
    #TODO CHECK IF BED IS INSTALLED
    G28 O
    G90
    G1 X100 Y100

[gcode_macro _CLOSE_CALIBRATE_PROBE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro _HELP_CALIBRATE_PROBE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin How to Calibrate the Probe"
    # 2) Ask for confirmation
    RESPOND TYPE=command MSG="action:prompt_text 1) Ensure the nozzle is clear of any debris"
    # TODO WIPE NOZZLE
    RESPOND TYPE=command MSG="action:prompt_text 2) Place the paper between the nozzle and the bed"
    RESPOND TYPE=command MSG="action:prompt_text 3) Lower the nozzle using the on screen buttons until it just catches the bed between the bed and nozzle"
    # 3) Footer buttons: Unload (primary) / Cancel (error)
    RESPOND TYPE=command MSG="action:prompt_footer_button I Have Paper, Continue|_DO_CALIBRATE_PROBE|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_CLOSE_CALIBRATE_PROBE|error"
    # 4) Show the prompt
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _DO_CALIBRATE_PROBE]
gcode:
    _CLOSE_CALIBRATE_PROBE
    PROBE_CALIBRATE_

[gcode_macro FINETUNE_RESONANCE]
description: Sweep ±10 Hz around the saved input shaper freqs, only when the stored calibration is no longer trusted
# Re-sweep policy, all three are meant to be retuned here:
#   recalibrate_every_prints  prints allowed on one sweep before sweeping again.
#                             PLACEHOLDER value: the honest interval needs the
#                             drift-across-power-cycles measurement KAN-161 asks
#                             for, which needs hardware. 0 disables the counter.
#                             This is a print count, not days, because Klipper
#                             macros have no wall clock (the Jinja context is
#                             only printer + the action_* helpers).
#   sweep_span_hz             half width of the narrow sweep around saved freqs.
variable_recalibrate_every_prints: 25
variable_sweep_span_hz: 10
# configfile.settings is only built once at startup, so the freqs that
# SAVE_CONFIG NO_RESTART=1 writes are not readable again until the next restart.
# This remembers that we produced them earlier in this session.
variable_swept_this_session: 0
gcode:

    {% set me = printer["gcode_macro FINETUNE_RESONANCE"] %}
    {% set force = params.FORCE|default(0)|int(0) %}
    {% set every = me.recalibrate_every_prints|int(0) %}
    {% set span = me.sweep_span_hz|float %}

    # Anything missing or unparsable in the stored record must fall through to a
    # sweep, never to a skip.
    {% set saved = printer.save_variables.variables if 'save_variables' in printer else {} %}
    {% set valid = saved.resonance_valid|default(0)|int(0) %}
    {% set prints = saved.resonance_prints|default(-1)|int(-1) %}

    # shaper_freq_x/y read back as 0 until something has been calibrated and
    # saved, and SHAPER_CALIBRATE rejects FREQ_START below 1, so only narrow the
    # sweep when the saved freqs are actually usable.
    {% set fx = printer.configfile.settings.input_shaper.shaper_freq_x|default(0)|float %}
    {% set fy = printer.configfile.settings.input_shaper.shaper_freq_y|default(0)|float %}
    {% set narrow = 1 if (fx - span) > 1 and (fy - span) > 1 else 0 %}
    {% set have_freqs = 1 if narrow == 1 or me.swept_this_session|int(0) == 1 else 0 %}

    {% if force == 1 %}
        {% set reason = "requested" %}
    {% elif valid != 1 %}
        {% set reason = "no trusted stored calibration" %}
    {% elif have_freqs == 0 %}
        {% set reason = "saved shaper frequencies are gone" %}
    {% elif prints < 0 %}
        {% set reason = "print counter unreadable" %}
    {% elif every > 0 and prints >= every %}
        {% set reason = prints ~ " prints since the last sweep" %}
    {% else %}
        {% set reason = "" %}
    {% endif %}

    {% if reason != "" %}
        {action_respond_info("FINETUNE_RESONANCE: sweeping, " ~ reason)}
        # HZ_PER_SEC stays at 2 and the span stays at ±10 Hz deliberately. The
        # sweep is rare now, so there is nothing to gain from a coarser sweep,
        # and this fork caps HZ_PER_SEC at 2 anyway.
        {% if narrow == 1 %}
            SHAPER_CALIBRATE AXIS=x FREQ_START={fx - span} FREQ_END={fx + span} HZ_PER_SEC=2
            SHAPER_CALIBRATE AXIS=y FREQ_START={fy - span} FREQ_END={fy + span} HZ_PER_SEC=2
        {% else %}
            # Nothing saved to narrow around, sweep the full [resonance_tester] range
            SHAPER_CALIBRATE AXIS=x HZ_PER_SEC=2
            SHAPER_CALIBRATE AXIS=y HZ_PER_SEC=2
        {% endif %}
        SET_GCODE_VARIABLE MACRO=FINETUNE_RESONANCE VARIABLE=swept_this_session VALUE=1
        SAVE_VARIABLE VARIABLE=resonance_prints VALUE=0
        SAVE_VARIABLE VARIABLE=resonance_valid VALUE=1
    {% else %}
        SAVE_VARIABLE VARIABLE=resonance_prints VALUE={prints + 1}
        {action_respond_info("FINETUNE_RESONANCE: reusing stored calibration, " ~ (prints + 1) ~ " prints since the last sweep")}
    {% endif %}

[gcode_macro RESET_RESONANCE_CALIBRATION]
description: "Discard the stored resonance calibration so the next print re-runs the sweep"
gcode:
    SAVE_VARIABLE VARIABLE=resonance_valid VALUE=0
    SAVE_VARIABLE VARIABLE=resonance_prints VALUE=0
    SET_GCODE_VARIABLE MACRO=FINETUNE_RESONANCE VARIABLE=swept_this_session VALUE=0
    {action_respond_info("Resonance calibration discarded, the next print will re-run the sweep")}


#####################################################################
#   Bed mesh reuse
#####################################################################
# PRINT_START used to re-probe the whole mesh on every print. It now reuses the
# stored mesh when a record on disk proves the mesh still covers the area this
# print needs, at a bed temperature close to the one it was taken at. Every
# unknown resolves to "probe anyway": a mesh wrongly trusted is a failed first
# layer or a nozzle in the glass, a mesh needlessly re-probed only costs time.
#
# The record lives in the same [save_variables] store as the resonance record:
#   mesh_valid      1 only while the mesh below is trusted
#   mesh_min_x/y    region the stored mesh actually covers, as probed
#   mesh_max_x/y
#   mesh_bed_temp   BED target of the print the mesh was taken during

[gcode_macro _BED_MESH_INVALIDATE]
description: Mark the stored bed mesh record untrusted, without a user message
gcode:
    SAVE_VARIABLE VARIABLE=mesh_valid VALUE=0

[gcode_macro RESET_MESH_CALIBRATION]
description: "Discard the stored bed mesh record so the next print re-probes the bed"
gcode:
    _BED_MESH_INVALIDATE
    {action_respond_info("Bed mesh record discarded, the next print will probe the bed")}

[gcode_macro RESET_CALIBRATION]
description: "Discard every stored calibration record so the next print re-derives them"
gcode:
    RESET_RESONANCE_CALIBRATION
    RESET_MESH_CALIBRATION

[gcode_macro _BED_MESH_RECORD]
description: Record the region and bed temperature of the mesh that is loaded right now
gcode:
    # Called after BED_MESH_CALIBRATE, never inline with it. A macro renders in
    # full before any of the gcode it emits runs, so printer.bed_mesh inside
    # _BED_MESH_ENSURE is still the pre-probe mesh; only a separate macro sees
    # the mesh that was just probed.
    {% set bm = printer.bed_mesh if 'bed_mesh' in printer else {} %}
    {% set loaded = bm.profile_name|default("")|string %}
    # Region as probed, which is what the mesh really covers. It is not always
    # the requested region: bed_mesh derives it from the generated points, and
    # no_go_region snapping can move the outermost ones.
    {% set _min = bm.mesh_min|default([0, 0]) %}
    {% set _max = bm.mesh_max|default([0, 0]) %}
    {% set min_x = _min[0]|default('')|float(0) %}
    {% set min_y = _min[1]|default('')|float(0) %}
    {% set max_x = _max[0]|default('')|float(0) %}
    {% set max_y = _max[1]|default('')|float(0) %}
    # The BED target of this print, not the live bed reading. The probe always
    # happens at the same point of PRINT_START relative to that target, so
    # target against target is the comparison that stays stable print to print.
    {% set bed = params.BED|default('')|float(-999) %}

    {% if loaded != "" and max_x > min_x and max_y > min_y and bed > -998 %}
        SAVE_VARIABLE VARIABLE=mesh_min_x VALUE={min_x}
        SAVE_VARIABLE VARIABLE=mesh_min_y VALUE={min_y}
        SAVE_VARIABLE VARIABLE=mesh_max_x VALUE={max_x}
        SAVE_VARIABLE VARIABLE=mesh_max_y VALUE={max_y}
        SAVE_VARIABLE VARIABLE=mesh_bed_temp VALUE={bed}
        # mesh_valid goes last so a write that dies part way leaves the record
        # untrusted rather than half written and trusted.
        SAVE_VARIABLE VARIABLE=mesh_valid VALUE=1
        {action_respond_info("BED MESH: stored " ~ min_x ~ "," ~ min_y ~ " to " ~ max_x ~ "," ~ max_y ~ " taken at bed " ~ bed ~ "C")}
    {% else %}
        _BED_MESH_INVALIDATE
        {action_respond_info("BED MESH: nothing usable to record, the next print will probe the bed")}
    {% endif %}

[gcode_macro _BED_MESH_ENSURE]
description: Probe the requested mesh region, or reuse the stored mesh when the record proves it still covers that region at that bed temperature
# Reuse policy, meant to be retuned here:
#   mesh_temp_band_c  how far this print's BED target may sit from the target
#                     the stored mesh was taken at before the bed is re-probed.
#                     PLACEHOLDER value: the honest band needs the mesh against
#                     bed temperature measurement KAN-159 asks for, which needs
#                     hardware. 0 re-probes on any temperature change at all.
variable_mesh_temp_band_c: 5
gcode:

    {% set me = printer["gcode_macro _BED_MESH_ENSURE"] %}
    {% set band = me.mesh_temp_band_c|float %}
    {% set force = params.FORCE|default(0)|int(0) %}
    {% set pc = params.PROBE_COUNT|default("")|string %}
    {% set algo = params.ALGORITHM|default("bicubic", true)|string %}
    {% set bed = params.BED|default('')|float(-999) %}

    # Requested region, as the "x,y" pairs PRINT_START clamps and passes on. A
    # missing or unparsable half lands on a sentinel no stored region can cover,
    # so a malformed request costs a probe instead of skipping one.
    {% set _rmin = (params.MESH_MIN|default("")|string).split(',') %}
    {% set _rmax = (params.MESH_MAX|default("")|string).split(',') %}
    {% set r_min_x = _rmin[0]|default('')|float(-999999) %}
    {% set r_min_y = _rmin[1]|default('')|float(-999999) %}
    {% set r_max_x = _rmax[0]|default('')|float(999999) %}
    {% set r_max_y = _rmax[1]|default('')|float(999999) %}
    {% set req_ok = 1 if r_min_x > -999998 and r_min_y > -999998
                      and r_max_x < 999998 and r_max_y < 999998
                      and r_max_x >= r_min_x and r_max_y >= r_min_y else 0 %}

    # Stored record. Same sentinel trick in the other direction: anything
    # missing or unparsable yields an empty region that covers nothing.
    {% set saved = printer.save_variables.variables if 'save_variables' in printer else {} %}
    {% set valid = saved.mesh_valid|default(0)|int(0) %}
    {% set s_min_x = saved.mesh_min_x|default('')|float(999999) %}
    {% set s_min_y = saved.mesh_min_y|default('')|float(999999) %}
    {% set s_max_x = saved.mesh_max_x|default('')|float(-999999) %}
    {% set s_max_y = saved.mesh_max_y|default('')|float(-999999) %}
    {% set s_temp = saved.mesh_bed_temp|default('')|float(-999) %}
    {% set covers_stored = 1 if s_min_x <= r_min_x and s_min_y <= r_min_y
                              and s_max_x >= r_max_x and s_max_y >= r_max_y else 0 %}
    {% set temp_ok = 1 if bed > -998 and s_temp > -998
                       and (bed - s_temp)|abs <= band else 0 %}

    # The mesh actually applied right now, loaded by BED_MESH_PROFILE LOAD in
    # PRINT_START before this runs. The record alone is not enough: a hand run
    # BED_MESH_CALIBRATE, or an edited profile, moves the mesh under a record
    # that still says valid. Skipping is only safe if the mesh on the machine
    # covers this print too.
    {% set bm = printer.bed_mesh if 'bed_mesh' in printer else {} %}
    {% set loaded = bm.profile_name|default("")|string %}
    {% set _lmin = bm.mesh_min|default([999999, 999999]) %}
    {% set _lmax = bm.mesh_max|default([-999999, -999999]) %}
    {% set l_min_x = _lmin[0]|default('')|float(999999) %}
    {% set l_min_y = _lmin[1]|default('')|float(999999) %}
    {% set l_max_x = _lmax[0]|default('')|float(-999999) %}
    {% set l_max_y = _lmax[1]|default('')|float(-999999) %}
    {% set covers_loaded = 1 if l_min_x <= r_min_x and l_min_y <= r_min_y
                              and l_max_x >= r_max_x and l_max_y >= r_max_y else 0 %}

    {% if force == 1 %}
        {% set reason = "requested" %}
    {% elif req_ok == 0 %}
        {% set reason = "no usable mesh region from the slicer" %}
    {% elif bed <= -998 %}
        {% set reason = "no bed temperature given" %}
    {% elif valid != 1 %}
        {% set reason = "no trusted stored mesh" %}
    {% elif s_min_x > 999998 or s_min_y > 999998 or s_max_x < -999998 or s_max_y < -999998 %}
        {% set reason = "the stored mesh region is missing or unreadable" %}
    {% elif s_temp <= -998 %}
        {% set reason = "the stored mesh has no readable bed temperature" %}
    {% elif covers_stored == 0 %}
        {% set reason = "stored mesh " ~ s_min_x ~ "," ~ s_min_y ~ " to " ~ s_max_x ~ "," ~ s_max_y ~ " does not cover " ~ r_min_x ~ "," ~ r_min_y ~ " to " ~ r_max_x ~ "," ~ r_max_y %}
    {% elif temp_ok == 0 %}
        {% set reason = "bed " ~ bed ~ "C is more than " ~ band ~ "C from the " ~ s_temp ~ "C the stored mesh was taken at" %}
    {% elif loaded == "" %}
        {% set reason = "no mesh profile is loaded" %}
    {% elif covers_loaded == 0 %}
        {% set reason = "the loaded mesh does not cover the requested region" %}
    {% else %}
        {% set reason = "" %}
    {% endif %}

    {% if reason != "" %}
        {action_respond_info("BED MESH: probing, " ~ reason)}
        # Drop the record before probing, not after. If the probe aborts part
        # way the print stops here, and the next one must not fall back on a
        # record describing a mesh that is no longer on the machine.
        _BED_MESH_INVALIDATE
        BED_MESH_CLEAR
        {% if req_ok == 1 and pc != "" %}
            BED_MESH_CALIBRATE MESH_MIN={params.MESH_MIN} MESH_MAX={params.MESH_MAX} PROBE_COUNT={pc} ALGORITHM={algo} ADAPTIVE=0 ADAPTIVE_MARGIN=0
        {% else %}
            # No usable bounds to work from, probe the whole configured region
            BED_MESH_CALIBRATE
        {% endif %}
        _BED_MESH_RECORD BED={bed}
    {% else %}
        # Nothing to do: BED_MESH_PROFILE LOAD in PRINT_START already applied
        # this mesh, and the skip path deliberately never calls BED_MESH_CLEAR.
        {action_respond_info("BED MESH: reusing the stored mesh, " ~ s_min_x ~ "," ~ s_min_y ~ " to " ~ s_max_x ~ "," ~ s_max_y ~ " taken at bed " ~ s_temp ~ "C")}
    {% endif %}
