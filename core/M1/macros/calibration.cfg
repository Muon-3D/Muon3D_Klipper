[gcode_macro CALIBRATE_PROBE]
description: "Calibrate the Probes Z Offset"
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Probe Calibrate"
    # 2) Ask for confirmation
    RESPOND TYPE=command MSG="action:prompt_text Please fetch a piece of paper to perform Probe Z Offset Calibration"
    
    # 3) Footer buttons: Unload (primary) / Cancel (error)
    RESPOND TYPE=command MSG="action:prompt_footer_button I Have Paper, Continue|_DO_CALIBRATE_PROBE|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Help|_HELP_CALIBRATE_PROBE|info"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_CLOSE_CALIBRATE_PROBE|error"
    # 4) Show the prompt
    RESPOND TYPE=command MSG="action:prompt_show"
    #TODO CHECK IF BED IS INSTALLED
    G28 O
    G90
    G1 X100 Y100

[gcode_macro _CLOSE_CALIBRATE_PROBE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro _HELP_CALIBRATE_PROBE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin How to Calibrate the Probe"
    # 2) Ask for confirmation
    RESPOND TYPE=command MSG="action:prompt_text 1) Ensure the nozzle is clear of any debris"
    # TODO WIPE NOZZLE
    RESPOND TYPE=command MSG="action:prompt_text 2) Place the paper between the nozzle and the bed"
    RESPOND TYPE=command MSG="action:prompt_text 3) Lower the nozzle using the on screen buttons until it just catches the bed between the bed and nozzle"
    # 3) Footer buttons: Unload (primary) / Cancel (error)
    RESPOND TYPE=command MSG="action:prompt_footer_button I Have Paper, Continue|_DO_CALIBRATE_PROBE|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_CLOSE_CALIBRATE_PROBE|error"
    # 4) Show the prompt
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _DO_CALIBRATE_PROBE]
gcode:
    _CLOSE_CALIBRATE_PROBE
    PROBE_CALIBRATE_

[gcode_macro FINETUNE_RESONANCE]
description: Sweep ±10 Hz around the saved input shaper freqs, only when the stored calibration is no longer trusted
# Re-sweep policy, all three are meant to be retuned here:
#   recalibrate_every_prints  prints allowed on one sweep before sweeping again.
#                             PLACEHOLDER value: the honest interval needs the
#                             drift-across-power-cycles measurement KAN-161 asks
#                             for, which needs hardware. 0 disables the counter.
#                             This is a print count, not days, because Klipper
#                             macros have no wall clock (the Jinja context is
#                             only printer + the action_* helpers).
#   sweep_span_hz             half width of the narrow sweep around saved freqs.
variable_recalibrate_every_prints: 25
variable_sweep_span_hz: 10
# configfile.settings is only built once at startup, so the freqs that
# SAVE_CONFIG NO_RESTART=1 writes are not readable again until the next restart.
# This remembers that we produced them earlier in this session.
variable_swept_this_session: 0
# What the most recent call did: 1 swept, 0 reused the stored calibration,
# -1 not called yet this session. Read by _PRINT_START_MARK (KAN-201) so the
# resonance phase time is labelled with which of the two it was -- the same
# phase is tens of seconds on one and near-instant on the other.
variable_last_swept: -1
gcode:

    {% set me = printer["gcode_macro FINETUNE_RESONANCE"] %}
    {% set force = params.FORCE|default(0)|int(0) %}
    {% set every = me.recalibrate_every_prints|int(0) %}
    {% set span = me.sweep_span_hz|float %}

    # Anything missing or unparsable in the stored record must fall through to a
    # sweep, never to a skip.
    {% set saved = printer.save_variables.variables if 'save_variables' in printer else {} %}
    {% set valid = saved.resonance_valid|default(0)|int(0) %}
    {% set prints = saved.resonance_prints|default(-1)|int(-1) %}

    # shaper_freq_x/y read back as 0 until something has been calibrated and
    # saved, and SHAPER_CALIBRATE rejects FREQ_START below 1, so only narrow the
    # sweep when the saved freqs are actually usable.
    {% set fx = printer.configfile.settings.input_shaper.shaper_freq_x|default(0)|float %}
    {% set fy = printer.configfile.settings.input_shaper.shaper_freq_y|default(0)|float %}
    {% set narrow = 1 if (fx - span) > 1 and (fy - span) > 1 else 0 %}
    {% set have_freqs = 1 if narrow == 1 or me.swept_this_session|int(0) == 1 else 0 %}

    {% if force == 1 %}
        {% set reason = "requested" %}
    {% elif valid != 1 %}
        {% set reason = "no trusted stored calibration" %}
    {% elif have_freqs == 0 %}
        {% set reason = "saved shaper frequencies are gone" %}
    {% elif prints < 0 %}
        {% set reason = "print counter unreadable" %}
    {% elif every > 0 and prints >= every %}
        {% set reason = prints ~ " prints since the last sweep" %}
    {% else %}
        {% set reason = "" %}
    {% endif %}

    {% if reason != "" %}
        {action_respond_info("FINETUNE_RESONANCE: sweeping, " ~ reason)}
        # HZ_PER_SEC stays at 2 and the span stays at ±10 Hz deliberately. The
        # sweep is rare now, so there is nothing to gain from a coarser sweep,
        # and this fork caps HZ_PER_SEC at 2 anyway.
        {% if narrow == 1 %}
            SHAPER_CALIBRATE AXIS=x FREQ_START={fx - span} FREQ_END={fx + span} HZ_PER_SEC=2
            SHAPER_CALIBRATE AXIS=y FREQ_START={fy - span} FREQ_END={fy + span} HZ_PER_SEC=2
        {% else %}
            # Nothing saved to narrow around, sweep the full [resonance_tester] range
            SHAPER_CALIBRATE AXIS=x HZ_PER_SEC=2
            SHAPER_CALIBRATE AXIS=y HZ_PER_SEC=2
        {% endif %}
        SET_GCODE_VARIABLE MACRO=FINETUNE_RESONANCE VARIABLE=swept_this_session VALUE=1
        SET_GCODE_VARIABLE MACRO=FINETUNE_RESONANCE VARIABLE=last_swept VALUE=1
        SAVE_VARIABLE VARIABLE=resonance_prints VALUE=0
        SAVE_VARIABLE VARIABLE=resonance_valid VALUE=1
    {% else %}
        SET_GCODE_VARIABLE MACRO=FINETUNE_RESONANCE VARIABLE=last_swept VALUE=0
        SAVE_VARIABLE VARIABLE=resonance_prints VALUE={prints + 1}
        {action_respond_info("FINETUNE_RESONANCE: reusing stored calibration, " ~ (prints + 1) ~ " prints since the last sweep")}
    {% endif %}

[gcode_macro RESET_RESONANCE_CALIBRATION]
description: "Discard the stored resonance calibration so the next print re-runs the sweep"
gcode:
    SAVE_VARIABLE VARIABLE=resonance_valid VALUE=0
    SAVE_VARIABLE VARIABLE=resonance_prints VALUE=0
    SET_GCODE_VARIABLE MACRO=FINETUNE_RESONANCE VARIABLE=swept_this_session VALUE=0
    {action_respond_info("Resonance calibration discarded, the next print will re-run the sweep")}


#####################################################################
#   Bed mesh: probed before every print
#####################################################################
# The M1 is folded and packed between prints, so a mesh is never trusted
# from one print to the next: PRINT_START probes before every print (Harry,
# 2026-10-17). This replaced a stored-mesh reuse scheme (mesh_valid and
# friends in [save_variables]) that saved seconds at the cost of reliability.
#
# Two macros, because a macro renders in full before any of its gcode runs:
# _BED_MESH_PLAN publishes the points about to be probed (MuonUI draws them
# live) before _HOTEND_RAMP_UNDER_MESH and _BED_MESH_ENSURE are rendered.

[gcode_macro RESET_MESH_CALIBRATION]
description: "Kept for compatibility: the bed is re-probed before every print anyway"
gcode:
    {action_respond_info("The bed mesh is re-probed before every print; nothing to reset")}

[gcode_macro RESET_CALIBRATION]
description: "Discard every stored calibration record so the next print re-derives them"
gcode:
    RESET_RESONANCE_CALIBRATION
    RESET_MESH_CALIBRATION

[gcode_macro _BED_MESH_PLAN]
description: Publish the points the coming bed probe will visit, in probe order
# Published for MuonUI's live probing view (src/panel/meshProbe.ts) and for
# _HOTEND_RAMP_UNDER_MESH:
#   points      [x, y] in probe order, as bed_mesh will generate them,
#               including the M1's no-go region snapping
#   will_probe  always 1 now; kept because readers still check it
#   bounds_ok   1 if the slicer region parsed and is used for the probe
variable_will_probe: 1
variable_bounds_ok: 0
variable_points: []
gcode:
    {% set _rmin = (params.MESH_MIN|default("")|string).split(',') %}
    {% set _rmax = (params.MESH_MAX|default("")|string).split(',') %}
    {% set r_min_x = _rmin[0]|default('')|float(-999999) %}
    {% set r_min_y = _rmin[1]|default('')|float(-999999) %}
    {% set r_max_x = _rmax[0]|default('')|float(999999) %}
    {% set r_max_y = _rmax[1]|default('')|float(999999) %}
    {% set req_ok = 1 if r_min_x > -999998 and r_min_y > -999998
                      and r_max_x < 999998 and r_max_y < 999998
                      and r_max_x >= r_min_x and r_max_y >= r_min_y else 0 %}
    # MuonUI recognises this line; keep its start as it is.
    {% if req_ok == 1 %}
        {action_respond_info("BED MESH: probing, " ~ r_min_x ~ "," ~ r_min_y ~ " to " ~ r_max_x ~ "," ~ r_max_y)}
    {% else %}
        {action_respond_info("BED MESH: probing, the configured region (no usable region from the slicer)")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_BED_MESH_PLAN VARIABLE=will_probe VALUE=1
    SET_GCODE_VARIABLE MACRO=_BED_MESH_PLAN VARIABLE=bounds_ok VALUE={req_ok}

    # The points bed_mesh will probe: its generate_points() serpentine over
    # the region and probe count, with a point inside a no-go region moved to
    # the nearest boundary within no_go_boundary_tolerance, or dropped.
    {% set cfg = printer.configfile.settings.bed_mesh
                 if 'configfile' in printer
                 and 'bed_mesh' in printer.configfile.settings else {} %}
    {% set pc = params.PROBE_COUNT|default("")|string %}
    {% if req_ok == 1 and pc != "" %}
        {% set p_min = [r_min_x, r_min_y] %}
        {% set p_max = [r_max_x, r_max_y] %}
        {% set p_cnt = pc.split(',') %}
    {% else %}
        {% set _c = cfg.mesh_min|default([0, 0]) %}
        {% set p_min = _c.split(',') if _c is string else _c %}
        {% set _c = cfg.mesh_max|default([0, 0]) %}
        {% set p_max = _c.split(',') if _c is string else _c %}
        {% set _c = cfg.probe_count|default([0, 0]) %}
        {% set p_cnt = _c.split(',') if _c is string
                       else ([_c] if _c is number else _c) %}
    {% endif %}
    {% set min_x = p_min[0]|float(0) %}
    {% set min_y = p_min[1]|float(0) %}
    {% set max_x = p_max[0]|float(0) %}
    {% set max_y = p_max[1]|float(0) %}
    {% set x_cnt = p_cnt[0]|int(0) %}
    {% set y_cnt = (p_cnt[1] if p_cnt|length > 1 else p_cnt[0])|int(0) %}
    {% set x_dist = ((max_x - min_x) / [x_cnt - 1, 1]|max)|round(2, 'floor') %}
    {% set y_dist = ((max_y - min_y) / [y_cnt - 1, 1]|max)|round(2, 'floor') %}
    {% set top_x = min_x + x_dist * (x_cnt - 1) %}
    {% set ng = namespace(regions=[]) %}
    {% for i in range(1, 100) %}
        {% set _a = cfg['no_go_region_%d_min' % i] %}
        {% set _b = cfg['no_go_region_%d_max' % i] %}
        {% if _a is defined and _b is defined and _a and _b %}
            {% set ax = _a[0]|float %}
            {% set ay = _a[1]|float %}
            {% set bx = _b[0]|float %}
            {% set by = _b[1]|float %}
            {% set ng.regions = ng.regions
                + [[[ax, bx]|min, [ay, by]|min, [ax, bx]|max, [ay, by]|max]] %}
        {% endif %}
    {% endfor %}
    {% set tol = cfg.no_go_boundary_tolerance|default(0)|float(0) %}
    {% set e = 0.000001 %}
    {% set ns = namespace(points=[], y=min_y) %}
    {% if x_cnt >= 3 and y_cnt >= 3 and x_dist >= 1 and y_dist >= 1 %}
        {% for i in range(y_cnt) %}
            {% for j in range(x_cnt) %}
                {% set px = min_x + j * x_dist if i % 2 == 0
                            else top_x - j * x_dist %}
                {% set pt = namespace(x=px, y=ns.y, keep=1, hit=0, done=0) %}
                {% for r in ng.regions %}
                    {% if pt.hit == 0 and r[0] - e <= px <= r[2] + e
                          and r[1] - e <= ns.y <= r[3] + e %}
                        {% set pt.hit = 1 %}
                        {% set pt.keep = 0 %}
                        {% set cands = [[px - r[0], r[0], ns.y],
                                        [r[2] - px, r[2], ns.y],
                                        [ns.y - r[1], px, r[1]],
                                        [r[3] - ns.y, px, r[3]]]|sort(attribute='0') %}
                        {% for c in cands if tol > 0 %}
                            {% if pt.done == 0 and c[0] > tol + e %}
                                {% set pt.done = 1 %}
                            {% elif pt.done == 0
                                    and min_x - e <= c[1] <= top_x + e
                                    and min_y - e <= c[2] <= max_y + e %}
                                {% set pt.x = c[1] %}
                                {% set pt.y = c[2] %}
                                {% set pt.keep = 1 %}
                                {% set pt.done = 1 %}
                            {% endif %}
                        {% endfor %}
                    {% endif %}
                {% endfor %}
                {% if pt.keep == 1 %}
                    {% set ns.points = ns.points
                        + [[pt.x|round(2), pt.y|round(2)]] %}
                {% endif %}
            {% endfor %}
            {% set ns.y = ns.y + y_dist %}
        {% endfor %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_BED_MESH_PLAN VARIABLE=points VALUE='{ns.points|tojson}'
    SET_GCODE_VARIABLE MACRO=_BED_MESH_ENSURE VARIABLE=probed_count VALUE=0

[gcode_macro _BED_MESH_ENSURE]
description: Probe the bed mesh for this print
# last_probed: 1 once a probe has run this session, -1 before; read by
# _PRINT_START_MARK (KAN-201) to label the mesh phase.
# probed_count: how many of _BED_MESH_PLAN.points have been probed. It is 0
# until the probe completes and then all of them at once (BED_MESH_CALIBRATE
# runs its point loop without returning to gcode); MuonUI reads it.
variable_last_probed: -1
variable_probed_count: 0
gcode:
    {% set plan = printer["gcode_macro _BED_MESH_PLAN"] %}
    {% set pc = params.PROBE_COUNT|default("")|string %}
    {% set algo = params.ALGORITHM|default("bicubic", true)|string %}
    {% set have_bounds = 1 if params.MESH_MIN is defined and params.MESH_MAX is defined else 0 %}
    {% set n_points = plan.points|default([])|length %}
    SET_GCODE_VARIABLE MACRO=_BED_MESH_ENSURE VARIABLE=probed_count VALUE=0
    BED_MESH_CLEAR
    # PRB-30: TAIL, MCUTARE, LIFTLAST and ZLEAD remove the host-side waits
    # between taps (44.5 s -> 22.4 s for 12 points); LIFT_SPEED is PRB-25.
    {% if plan.bounds_ok|default(0)|int(0) == 1 and have_bounds == 1 and pc != "" %}
        BED_MESH_CALIBRATE MESH_MIN={params.MESH_MIN} MESH_MAX={params.MESH_MAX} PROBE_COUNT={pc} ALGORITHM={algo} ADAPTIVE=0 ADAPTIVE_MARGIN=0 LIFT_SPEED=15 TAIL=0.05 MCUTARE=1 LIFTLAST=1 ZLEAD=10
    {% else %}
        BED_MESH_CALIBRATE LIFT_SPEED=15 TAIL=0.05 MCUTARE=1 LIFTLAST=1 ZLEAD=10
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_BED_MESH_ENSURE VARIABLE=probed_count VALUE={n_points}
    SET_GCODE_VARIABLE MACRO=_BED_MESH_ENSURE VARIABLE=last_probed VALUE=1
    SET_GCODE_VARIABLE MACRO=_BED_MESH_PLAN VARIABLE=bounds_ok VALUE=0

#####################################################################
#   Making the calibrations durable
#####################################################################
# SAVE_CONFIG is what puts the freshly probed mesh and the freshly swept shaper
# frequencies on disk: BED_MESH_CALIBRATE and SHAPER_CALIBRATE only stage them
# (bed_mesh.py:2059 save_profile calls configfile.set), and configfile.py:387
# cmd_SAVE_CONFIG is what writes the file.
#
# It runs right after the mesh in PRINT_START. Every print probes a new mesh,
# so something is staged on every print; the stored mesh is only what
# PRINT_START loads for the moves before its own probe. There is no longer a
# mesh record on disk that could outlive the mesh it describes (the old reuse
# scheme's hazard, KAN-159/KAN-162), so the write could move to PRINT_END if
# its time ever matters.
#
# _SAVE_CONFIG_IF_PENDING still skips the write when nothing is staged:
# configfile.py's save_config_pending starts False at boot and is set only
# when something is staged, while a bare SAVE_CONFIG re-reads, rewrites and
# backs up the whole config every time.
[gcode_macro _SAVE_CONFIG_IF_PENDING]
description: Write staged calibration to disk, but only when something has actually been staged
# What the most recent call did: 1 wrote, 0 nothing staged, -1 not called yet
# this session. Read by _PRINT_START_MARK (KAN-201).
variable_last_wrote: -1
gcode:
    # Unreadable means save: the cost of a needless write is a config rewrite,
    # the cost of a needless skip is a calibration that is not on disk while a
    # record on disk says it is.
    {% set cf = printer.configfile if 'configfile' in printer else {} %}
    {% set pending = 1 if cf.save_config_pending|default(true) else 0 %}

    SET_GCODE_VARIABLE MACRO=_SAVE_CONFIG_IF_PENDING VARIABLE=last_wrote VALUE={pending}
    {% if pending == 1 %}
        SAVE_CONFIG NO_RESTART=1
    {% else %}
        {action_respond_info("SAVE_CONFIG: nothing staged this print, config left alone")}
    {% endif %}
