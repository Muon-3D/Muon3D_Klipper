#####################################################################
#   Print Macros
#####################################################################

[gcode_macro _PRINT_START_MARK]
description: Emit one machine-readable PRINT_START timing mark (KAN-201)
# PRINT_START emits one of these at every real command boundary, so that
# time-to-first-layer can be measured per phase instead of inferred from the
# six M73 progress markers, which merge independent operations (the resonance
# sweep with the Z home, the mesh probe with SAVE_CONFIG, the three end-phase
# heat waits with each other) exactly where the startup epic wants numbers.
#
# WHY A SEPARATE MACRO. A gcode_macro renders in full before any of the gcode
# it emits runs, so a timestamp written inline in PRINT_START would be taken
# at render time -- every mark would carry the same instant. A mark has to be
# its own command so it renders when the queue reaches it. Same reasoning as
# _BED_MESH_PLAN and _RESUME_RESTORE_HOTEND.
#
# WHICH CLOCK. printer.toolhead.estimated_print_time is the MCU clock as the
# host currently estimates it, in seconds, monotonic within a klippy session.
# Differences between marks are wall seconds, and the host collector
# (MuonOS recipes/startup_timing) also stamps each mark on receipt with its
# own clock -- the two agreed to 0.01 s on the bench.
#
# WHAT A MARK MEASURES. A mark renders when the command before it has been
# dispatched. Blocking commands (G28, NOZZLE_WIPE_SMART, SHAPER_CALIBRATE,
# TEMPERATURE_WAIT, BED_MESH_CALIBRATE, M190) have finished by then; plain
# moves have only been queued. There is deliberately no M400 in front of a
# mark: draining the queue would perturb the thing being measured, and every
# phase that matters ends on a blocking command anyway. Queue-closed phases
# (the lifts and travels) therefore read as ~0 and their time lands in the
# next blocking phase.
#
# THE LINE. `PRINT_START_MARK seq=<n> phase=<name> t=<seconds> k=v ...`,
# via action_respond_info, so it reaches every gcode-output subscriber and
# klippy.log. Every extra parameter given to this macro is forwarded as a
# lower-cased k=v, which is how the start mark carries BED/EXTRUDER/MATERIAL.
# Three phases also say whether the work they cover actually ran, because
# without that the numbers are not comparable between runs:
#   resonance    swept=1|0   FINETUNE_RESONANCE swept, or reused the stored
#                            calibration (resonance_valid / print-count gate)
#   mesh         probed=1|0  _BED_MESH_ENSURE probed, or kept the loaded mesh
#   save_config  wrote=1|0   _SAVE_CONFIG_IF_PENDING wrote, or had nothing
#                            staged
# -1 means the source macro has not run this session, which should not be
# seen from PRINT_START and is left visible rather than mapped to 0.
#
# seq restarts at 0 on phase=start, so the collector can tell a PRINT_START
# that was cancelled part way from the next one without a wall clock.
variable_seq: 0
gcode:
    {% set phase = params.PHASE|default("")|string|lower %}
    {% set me = printer["gcode_macro _PRINT_START_MARK"] %}
    {% set seq = 0 if phase == "start" else me.seq|int(0) + 1 %}
    {% set t = printer.toolhead.estimated_print_time|float %}

    {% set ns = namespace(extra="") %}
    {% for k, v in params|dictsort %}
        {% if k|upper != "PHASE" %}
            {% set ns.extra = ns.extra ~ " " ~ k|lower ~ "=" ~ v %}
        {% endif %}
    {% endfor %}

    {% if phase == "resonance" %}
        {% set fr = printer["gcode_macro FINETUNE_RESONANCE"] %}
        {% set ns.extra = ns.extra ~ " swept=" ~ fr.last_swept|default(-1)|int(-1) %}
    {% elif phase == "mesh" %}
        {% set bm = printer["gcode_macro _BED_MESH_ENSURE"] %}
        {% set ns.extra = ns.extra ~ " probed=" ~ bm.last_probed|default(-1)|int(-1) %}
    {% elif phase == "save_config" %}
        {% set sc = printer["gcode_macro _SAVE_CONFIG_IF_PENDING"] %}
        {% set ns.extra = ns.extra ~ " wrote=" ~ sc.last_wrote|default(-1)|int(-1) %}
    {% endif %}

    {action_respond_info("PRINT_START_MARK seq=" ~ seq ~ " phase=" ~ phase ~ " t=" ~ "%.3f"|format(t) ~ ns.extra)}
    SET_GCODE_VARIABLE MACRO=_PRINT_START_MARK VARIABLE=seq VALUE={seq}


[gcode_macro PRINT_START]
description: print startup sequence
gcode:
    {% set BED_TEMP = params.BED|default(65)|float %}
    {% set READY_TEMP = BED_TEMP - 10 %}
    # The temperature the nozzle is held at from the end of homing until the bed
    # mesh is done, low enough that it cannot ooze while it is undocked and
    # moving over the bed. _HOTEND_RAMP_UNDER_MESH raises it part of the way to
    # the print temperature for the length of the probe, per material, and this
    # is the floor it is not allowed to go below.
    {% set PREHEAT_EXTRUDER_TEMP = 135 %} #ENSURE NO OOZE
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(190)|float %}
    {% set MATERIAL = params.MATERIAL | upper %}

    # _SET_MPC_MATERIAL MATERIAL={MATERIAL}
    # Using PID now instead

    SAVE_GCODE_STATE NAME=STATE_PRINT_START

    # KAN-201: one mark per phase boundary, see _PRINT_START_MARK. Each mark
    # closes the phase named on it.
    _PRINT_START_MARK PHASE=start BED={BED_TEMP} EXTRUDER={EXTRUDER_TEMP} MATERIAL={MATERIAL}

    BED_MESH_PROFILE LOAD=default #WILL RECLAIBRATE LATER, JUST APPLIES THE PROFILE FOR ANY MOVEMENTS

    SET_PRINT_STATS_INFO TOTAL_LAYER=100 CURRENT_LAYER=0 # False print start to be able to run M73 without klipper reset
    M73 P0
    LED_SETUP_PROGRESS # Start LED progress bar for setup

    ;PCF_CHECK                          ; test part cooling fan, disable for fans without tachometer
    M107                                ; turn off part fan
    # The real target, from here on. This used to be min(BED_TEMP, 65) so that
    # the bed did not climb during NOZZLE_WIPE_SMART, whose fan blows across the
    # bed thermistor and tripped [verify_heater heater_bed] -- which does not
    # warn, it calls invoke_shutdown(). Anything above a 65C bed (ABS, ASA, PC,
    # most PETG) therefore spent the whole homing and wipe window not heating and
    # then paid for it at the TEMPERATURE_WAIT below.
    #
    # What the cap actually bought was that the bed crossed target-hysteresis
    # (65-15 = 50C) within one check_gain_time of the fan starting, and
    # verify_heater.py:65 stops checking entirely above that line. There is no
    # equivalent for a 100C target, where the guard stays armed until 85C, so the
    # guard was retuned deliberately instead -- see [verify_heater heater_bed] in
    # core.cfg for the derivation and for what it still catches.
    M140 S{BED_TEMP}                    ; set bed temperature

    # KAN-221: start the hot end now, not when the wipe asks for it. The wipe's
    # HEAT_WAIT phase is 42.63 s of polling with nothing moving, and the G28
    # below runs 20.85 s with the heater idle. Pre-heating here overlaps the two
    # and cuts HEAT_WAIT to roughly 20 s. The bed is pre-heated one line above
    # for exactly this reason.
    #
    # Homing Z warm shifts the Z datum, which sets the wipe's plunge depth, but
    # ~0.017 mm of thermal expansion against a 1.2 mm plunge is not material,
    # and ~100 C is well below where PLA flows so the tap stays clean.
    #
    # Read from the wipe's own configured value so the two cannot drift apart.
    # NOTE the source changed: NOZZLE_WIPE_SMART is no longer a gcode_macro with
    # a wipe_temp variable, it is klippy/extras/nozzle_wipe_smart.py, and its
    # get_status() does not publish wipe_temp. configfile.settings is where the
    # [nozzle_wipe_smart] section's value is readable from a macro. Guarded, so
    # a missing section degrades to not pre-heating rather than breaking
    # PRINT_START -- but note that is a silent degrade, which is why the source
    # is named here.
    {% set _nws = printer.configfile.settings.nozzle_wipe_smart
                  if 'configfile' in printer
                  and 'nozzle_wipe_smart' in printer.configfile.settings
                  else {} %}
    {% set _wt = _nws.wipe_temp|default(0)|float %}
    {% if _wt > 0 %}
        M104 S{_wt}                     ; pre-heat for the wipe, overlaps G28
    {% endif %}

    G28 PARK=0                                    ; home all
    _PRINT_START_MARK PHASE=home

    M73 P20

    NOZZLE_WIPE_SMART
    _PRINT_START_MARK PHASE=wipe

    M73 P40

    # No second M140 here. It used to be the line that released the bed from the
    # cap; with the cap gone it would re-set a target the bed is already on, so
    # it is a no-op. Deliberately not re-issued at a nudged value either: any
    # M140 whose argument differs from the current target resets verify_heater's
    # gain window (verify_heater.py:77), which would buy the same slack as the
    # core.cfg change but hide it here, where nobody reviewing the guard looks.
    G28 Z PARK=0 X_OFFSET=-5   ;x OFFSET HERE PREVENT ANY BLOBS FROM INTIAL PROBING FROM INTERFERING WITH THE PROBING
    _PRINT_START_MARK PHASE=home_z
    # BED_TILT_CALIBRATE
    M104 S{PREHEAT_EXTRUDER_TEMP}
    FINETUNE_RESONANCE
    _PRINT_START_MARK PHASE=resonance

    M73 P50

    IF_BED_TEMP_ANTI_OOZE_NOZZLE_DOCK TEMP={READY_TEMP}
    _PRINT_START_MARK PHASE=dock_pre_mesh

    TEMPERATURE_WAIT SENSOR="heater_bed" MINIMUM={READY_TEMP}   ; wait for bed to mostly heat up, limiting ooze
    _PRINT_START_MARK PHASE=bed_wait

    M73 P60

    G91
    G0 Z10 F200  #LIFT OFF NOZZLE BRUSH
    G90
    G0 Y60 F7800 #MOVE TO MIDDLE TO RPEVENT NOZLE IMPACT WITH BED BLOCK, READY FOR PRINT BED MESH

    #Wait for bed to warm before adaptive mesh
    {% if params.MESH_MIN is defined and params.MESH_MAX is defined %}

      # Parse slicer-passed bounds (these come in as "x,y")
      {% set _min_in = params.MESH_MIN.split(',') %}
      {% set _max_in = params.MESH_MAX.split(',') %}
      {% set in_min_x = _min_in[0]|float %}
      {% set in_min_y = _min_in[1]|float %}
      {% set in_max_x = _max_in[0]|float %}
      {% set in_max_y = _max_in[1]|float %}

      # Read [bed_mesh] limits from printer.cfg
      # Depending on Klipper version, these may be a tuple/list (x,y) OR a string "x,y"
      {% set cfg_min_raw = printer.configfile.settings['bed_mesh']['mesh_min'] %}
      {% set cfg_max_raw = printer.configfile.settings['bed_mesh']['mesh_max'] %}

      {% if cfg_min_raw is string %}
          {% set _cfg_min = cfg_min_raw.split(',') %}
          {% set cfg_min_x = _cfg_min[0]|float %}
          {% set cfg_min_y = _cfg_min[1]|float %}
      {% else %}
          {% set cfg_min_x = cfg_min_raw[0]|float %}
          {% set cfg_min_y = cfg_min_raw[1]|float %}
      {% endif %}

      {% if cfg_max_raw is string %}
          {% set _cfg_max = cfg_max_raw.split(',') %}
          {% set cfg_max_x = _cfg_max[0]|float %}
          {% set cfg_max_y = _cfg_max[1]|float %}
      {% else %}
          {% set cfg_max_x = cfg_max_raw[0]|float %}
          {% set cfg_max_y = cfg_max_raw[1]|float %}
      {% endif %}

      # Clamp slicer bounds to cfg bounds
      {% set mesh_min_x = [ [in_min_x, cfg_min_x] | max, cfg_max_x ] | min %}
      {% set mesh_min_y = [ [in_min_y, cfg_min_y] | max, cfg_max_y ] | min %}
      {% set mesh_max_x = [ [in_max_x, cfg_min_x] | max, cfg_max_x ] | min %}
      {% set mesh_max_y = [ [in_max_y, cfg_min_y] | max, cfg_max_y ] | min %}

      # Ensure min <= max
      {% if mesh_max_x < mesh_min_x %}
          {% set _t = mesh_min_x %}{% set mesh_min_x = mesh_max_x %}{% set mesh_max_x = _t %}
      {% endif %}
      {% if mesh_max_y < mesh_min_y %}
          {% set _t = mesh_min_y %}{% set mesh_min_y = mesh_max_y %}{% set mesh_max_y = _t %}
      {% endif %}

      # Compute probe counts:
      {% set width_x = mesh_max_x - mesh_min_x %}
      {% set depth_y = mesh_max_y - mesh_min_y %}
      {% set step = 37.9 %}
      {% set eps = 0.0001 %}

      # required points = ceil(L/step) + 1 #
      {% set pc_x = (((width_x + step - eps) / step) | int) + 1 %}
      {% set pc_y = (((depth_y + step - eps) / step) | int) + 1 %}

      # clamp to minimum 3 #
      {% if pc_x < 3 %}
        {% set pc_x = 3 %}
      {% endif %}
      {% if pc_y < 3 %}
        {% set pc_y = 3 %}
      {% endif %}

      {% if pc_x > 6 %}
        {% set pc_x = 6 %}
      {% endif %}
      {% if pc_y > 5 %}
        {% set pc_y = 5 %}
      {% endif %}

      
      {% set algo = params.ALGORITHM|default("bicubic") %}

      # Three commands, and the order of them is the whole point.
      #
      # A gcode_macro renders in full before any of the gcode it emits runs, so
      # everything below this line was already turned into text before
      # _BED_MESH_PLAN got the chance to decide anything. PRINT_START therefore
      # cannot branch on whether the bed is about to be probed -- not with a
      # Jinja conditional, not by reading a variable, not at all. The only way
      # to put a decision in front of a consumer is a command boundary between
      # them: _BED_MESH_PLAN executes and publishes its decision, and only then
      # does _HOTEND_RAMP_UNDER_MESH get rendered, so it can read it.
      #
      # PLAN decides about the region it is handed and ENSURE probes the region
      # it is handed, so the two must be given the same region.
      _BED_MESH_PLAN BED={BED_TEMP} MESH_MIN={mesh_min_x},{mesh_min_y} MESH_MAX={mesh_max_x},{mesh_max_y}
      _HOTEND_RAMP_UNDER_MESH MATERIAL={MATERIAL} TARGET={EXTRUDER_TEMP + 3} FLOOR={PREHEAT_EXTRUDER_TEMP}
      # Clears and re-probes exactly as before unless the stored record proves
      # the mesh already on the machine covers this region at this bed temp.
      _BED_MESH_ENSURE BED={BED_TEMP} MESH_MIN={mesh_min_x},{mesh_min_y} MESH_MAX={mesh_max_x},{mesh_max_y} PROBE_COUNT={pc_x},{pc_y} ALGORITHM={algo}
    {% else %}
      # No slicer bounds, so there is no region to check the record against,
      # _BED_MESH_PLAN always decides to probe and _BED_MESH_ENSURE always
      # probes the full configured region -- which is a probe to ramp under.
      _BED_MESH_PLAN BED={BED_TEMP}
      _HOTEND_RAMP_UNDER_MESH MATERIAL={MATERIAL} TARGET={EXTRUDER_TEMP + 3} FLOOR={PREHEAT_EXTRUDER_TEMP}
      _BED_MESH_ENSURE BED={BED_TEMP}
    {% endif %}
    # Was a bare SAVE_CONFIG NO_RESTART=1. It stays here rather than moving to
    # PRINT_END as KAN-162 suggests: the mesh record written by _BED_MESH_RECORD
    # a moment ago is already on disk, and it must not outlive the mesh it
    # describes. See "Making the calibrations durable" in calibration.cfg for
    # why that is a nozzle-into-the-bed hazard and not just a stale file, and for
    # why the write is skipped entirely when nothing was staged.
    # Closes lift, travel, _BED_MESH_PLAN, the partial hotend ramp and the
    # probe (or the skip) as one phase; probed=1|0 on the mark says which.
    _PRINT_START_MARK PHASE=mesh
    _SAVE_CONFIG_IF_PENDING
    _PRINT_START_MARK PHASE=save_config

    M73 P80

    ANTI_OOZE_NOZZLE_DOCK
    _PRINT_START_MARK PHASE=dock

    # The rest of the ramp, and the only one that is allowed above the ooze
    # limit, because the nozzle is now parked in the silicone brush. Unchanged:
    # _HOTEND_RAMP_UNDER_MESH only ever moves the nozzle part of the way here,
    # and on a print that reused the mesh it does not move it at all, so this is
    # still the single line that reaches the print temperature.
    M104 S{EXTRUDER_TEMP + 3}  #TEMP HACK: slightly overheat as MPC soemtiems strugles to reach the temp smoothly if MPC is not fully claibrated properly
    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={180}   
    _PRINT_START_MARK PHASE=hotend_wait_180
    G1 E-1.0 F300 #RETRACT to limit ooze

    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={EXTRUDER_TEMP-0.5}     #continuation of temp hack
    _PRINT_START_MARK PHASE=hotend_wait_target

    # KAN-222: M104, not M109. The TEMPERATURE_WAIT above has already
    # guaranteed >= EXTRUDER_TEMP-0.5, so the hot end is AT temperature.
    # M109 would block a further 7.28 s (18.01 s on a warm machine) purely
    # waiting for the +3 overshoot to flatten to under PID_SETTLE_SLOPE
    # (0.1 C/s, heaters.py) -- a settle nothing downstream is waiting for.
    # Handover now happens at 215-216 C settling toward 215, and cannot be
    # cold. The +3 overshoot itself stays: sweeping it showed +3 is optimal
    # (+1 -> 54.4 s, +2 -> 38.4, +3 -> 38.4, +5 -> 38.4, +8 -> 47.4) and
    # removing it costs 4.38 s.
    M104 S{EXTRUDER_TEMP}               ; at temperature already; let it settle while we hand over
    M190 S{BED_TEMP}                    ; wait for bed temperature
    _PRINT_START_MARK PHASE=bed_settle
    # NOZZLE_UNDOCK                       ; undock the nozzle 

    G91
    G0 Z10 F200  #LIFT OFF NOZZLE BRUSH

    G90                                 ; use absolute coordinates
    G0 X130.0 Y2.0 F7800 #MOVE TO SIDE TO RPEVENT NOZLE IMPACT WITH BED BLOCK, READY FOR PRINT START PURGE

    M73 P100
    
    RESTORE_GCODE_STATE NAME=STATE_PRINT_START

    {% set zoff = printer.configfile.settings.load_cell_probe.z_offset|float %}
    SET_GCODE_OFFSET Z={zoff}

    
    G1 E1.0 F300 #UNRETRACT

    LED_PRINTING

    # Last mark: the lift off the brush, the travel to the purge position,
    # the state restore, the Z offset and the un-retract, i.e. everything
    # between the bed settling and the first slicer line. Moves are queued not
    # complete here (see _PRINT_START_MARK), so this phase reads as queue time.
    _PRINT_START_MARK PHASE=handover
    
    M73 P0

    # NOZZLE_PURGE #do nozzle purge in slicer


[gcode_macro _HOTEND_RAMP_UNDER_MESH]
description: Take the hotend part of the way to the print temperature while the bed is being probed, so that part of the ramp is not paid for with the user watching
# PRINT_START holds the nozzle at PREHEAT_EXTRUDER_TEMP from the end of homing
# until after the mesh purely so it cannot ooze, and only then ramps to the
# print temperature, which is dead time with nothing else happening. Probing is
# dead time too, so as much of the ramp as the material allows is moved under
# it. Called between _BED_MESH_PLAN and _BED_MESH_ENSURE, and does nothing at
# all when the plan says the mesh is being reused: with no probe to hide under
# there is nothing to gain from stopping part way, and PRINT_START's own
# M104 S{EXTRUDER_TEMP + 3} after the mesh block goes straight to the print
# temperature as it always did.
#
# WHY THESE TEMPERATURES ARE LOW. The nozzle is not docked here. The dock is
# what makes the full ramp after the mesh block safe, and PRINT_START lifts off
# the brush before this point and only docks again after the mesh block, so for
# the whole of the probe the nozzle is undocked and travelling over the bed --
# where a drip lands on the plate, and where a bead on the tip corrupts a probe,
# because on this machine the nozzle is the probe. So these are undocked ooze
# limits, which are stricter than the docked ones, and they are the reason the
# blanket 135C existed in the first place.
#
# ramp_table  the temperature each material may sit at, undocked, for as long as
#             a mesh probe takes, without drooling. Keys mirror the
#             filament_table in _SET_MPC_MATERIAL, which is the set of materials
#             this printer actually knows about.
#             EVERY VALUE IS A PLACEHOLDER pending validation against the
#             shipped Orca profiles on hardware. Ooze onset cannot be derived,
#             it has to be watched: park the nozzle at the value for as long as
#             a full probe takes and look for a drip or a bead. Until that is
#             done each entry is set roughly 40C under the lowest nozzle
#             temperature the Orca profile for that material uses, and below the
#             point the material starts to flow.
# unknown_material_c
#             what a MATERIAL that is not in the table gets. 0 means no partial
#             ramp at all, which is exactly the behaviour before this macro
#             existed: an unrecognised material gives up the time rather than
#             being guessed an ooze limit.
variable_ramp_table:
    {
        "PLA"       : 150,
        "PLA-CF"    : 150,
        "PETG"      : 170,
        "PETG-CF"   : 170,
        "ABS"       : 190,
        "ABS-CF"    : 190,
        "ASA"       : 190,
        "ASA-CF"    : 190,
        "PC+ABS"    : 195,
        "PC+ABS-CF" : 195,
        "PC"        : 210,
        "PC+CF"     : 210,
        "PA"        : 200,
        "PA6"       : 200,
        "PA6-CF"    : 200,
        "TPU"       : 150,
        "TPU-90A"   : 150,
        "TPU-95A"   : 150,
    }
variable_unknown_material_c: 0
gcode:

    {% set me = printer["gcode_macro _HOTEND_RAMP_UNDER_MESH"] %}
    {% set table = me.ramp_table if me.ramp_table is mapping else {} %}
    {% set material = params.MATERIAL|default("")|string|upper %}
    # TARGET is what PRINT_START is going to command after the mesh block, and
    # FLOOR is the preheat the nozzle is already holding. Anything unreadable
    # lands on a sentinel that suppresses the partial ramp.
    {% set target = params.TARGET|default('')|float(-1) %}
    {% set floor = params.FLOOR|default('')|float(-1) %}

    # Whether there is going to be a probe to ramp under. Unreadable means yes,
    # which at worst wastes the intermediate step on a print that skipped the
    # mesh -- it can never push the nozzle past an ooze limit.
    {% set plan = printer["gcode_macro _BED_MESH_PLAN"] if "gcode_macro _BED_MESH_PLAN" in printer else {} %}
    {% set will_probe = plan.will_probe|default(1)|int(1) %}

    {% set want = table[material]|default('')|float(-1) if material in table
                  else me.unknown_material_c|default('')|float(-1) %}
    # Never above what the print itself asks for, and the branches below never
    # let it go at or under the preheat, so a partial ramp can only ever heat.
    {% set ramp = [want, target]|min %}

    {% if will_probe != 1 %}
        {action_respond_info("HOTEND: mesh reused, no probe to ramp under, going straight to the print temperature")}
    {% elif target <= 0 %}
        {action_respond_info("HOTEND: no print temperature given, holding the preheat")}
    {% elif want <= 0 %}
        {action_respond_info("HOTEND: no ooze limit known for material '" ~ material ~ "', holding the preheat")}
    {% elif ramp <= floor %}
        {action_respond_info("HOTEND: preheat is already at or above the " ~ ramp ~ "C limit for this print, holding it")}
    {% else %}
        M104 S{ramp}
        {action_respond_info("HOTEND: " ~ ramp ~ "C under the bed probe, " ~ target ~ "C after it")}
    {% endif %}

[gcode_macro IF_BED_TEMP_ANTI_OOZE_NOZZLE_DOCK]
description: Dock nozzle only if current bed temp is below TEMP (anti-ooze)
gcode:
    {% set threshold = params.TEMP|float %}
    {% set bed_now = printer.heater_bed.temperature|float %}

    {% if bed_now < threshold %}
        ANTI_OOZE_NOZZLE_DOCK
    {% endif %}

