#####################################################################
#   Print Macros
#####################################################################

[gcode_macro _PRINT_START_MARK]
description: Emit one machine-readable PRINT_START timing mark (KAN-201)
# PRINT_START emits one of these at every real command boundary, so that
# time-to-first-layer can be measured per phase instead of inferred from the
# six M73 progress markers, which merge independent operations (the resonance
# sweep with the Z home, the mesh probe with SAVE_CONFIG, the three end-phase
# heat waits with each other) exactly where the startup epic wants numbers.
#
# WHY A SEPARATE MACRO. A gcode_macro renders in full before any of the gcode
# it emits runs, so a timestamp written inline in PRINT_START would be taken
# at render time -- every mark would carry the same instant. A mark has to be
# its own command so it renders when the queue reaches it. Same reasoning as
# _BED_MESH_PLAN and _RESUME_RESTORE_HOTEND.
#
# WHICH CLOCK. printer.toolhead.estimated_print_time is the MCU clock as the
# host currently estimates it, in seconds, monotonic within a klippy session.
# Differences between marks are wall seconds, and the host collector
# (MuonOS recipes/startup_timing) also stamps each mark on receipt with its
# own clock -- the two agreed to 0.01 s on the bench.
#
# WHAT A MARK MEASURES. A mark renders when the command before it has been
# dispatched. Blocking commands (G28, NOZZLE_WIPE_SMART, SHAPER_CALIBRATE,
# TEMPERATURE_WAIT, BED_MESH_CALIBRATE, M190) have finished by then; plain
# moves have only been queued. There is deliberately no M400 in front of a
# mark: draining the queue would perturb the thing being measured, and every
# phase that matters ends on a blocking command anyway. Queue-closed phases
# (the lifts and travels) therefore read as ~0 and their time lands in the
# next blocking phase.
#
# THE LINE. `PRINT_START_MARK seq=<n> phase=<name> t=<seconds> k=v ...`,
# via action_respond_info, so it reaches every gcode-output subscriber and
# klippy.log. Every extra parameter given to this macro is forwarded as a
# lower-cased k=v, which is how the start mark carries BED/EXTRUDER/MATERIAL.
# Three phases also say whether the work they cover actually ran, because
# without that the numbers are not comparable between runs:
#   resonance    swept=1|0   FINETUNE_RESONANCE swept, or reused the stored
#                            calibration (once-per-Klipper-session gate)
#   mesh         probed=1|0  _BED_MESH_ENSURE probed, or kept the loaded mesh
#   save_config  wrote=1|0   _SAVE_CONFIG_IF_PENDING wrote, or had nothing
#                            staged
# -1 means the source macro has not run this session, which should not be
# seen from PRINT_START and is left visible rather than mapped to 0.
#
# seq restarts at 0 on phase=start, so the collector can tell a PRINT_START
# that was cancelled part way from the next one without a wall clock.
variable_seq: 0
# The same mark as plain status, for a client that subscribes to
# gcode_macro _PRINT_START_MARK instead of reading the console, or that
# connects part way through and missed the line (the app's live printer view).
#   phase    name of the last mark, i.e. the phase that has just closed, or ''
#            when no PRINT_START is running. Cleared by PRINT_START right
#            after its handover mark, by PRINT_END, by CANCEL_PRINT, by
#            _ON_PRINT_ERROR when a print file raises, and by [idle_timeout],
#            so a start that fails part way does not leave a phase behind.
#   phase_t  the mark's t, estimated_print_time. Left alone when phase is
#            cleared, so it then says when the last mark was. -1 until the
#            first mark of the klippy session.
variable_phase: ''
variable_phase_t: -1.0
gcode:
    {% set phase = params.PHASE|default("")|string|lower %}
    {% set me = printer["gcode_macro _PRINT_START_MARK"] %}
    {% set seq = 0 if phase == "start" else me.seq|int(0) + 1 %}
    {% set t = printer.toolhead.estimated_print_time|float %}

    {% set ns = namespace(extra="") %}
    {% for k, v in params|dictsort %}
        {% if k|upper != "PHASE" %}
            {% set ns.extra = ns.extra ~ " " ~ k|lower ~ "=" ~ v %}
        {% endif %}
    {% endfor %}

    {% if phase == "resonance" %}
        {% set fr = printer["gcode_macro FINETUNE_RESONANCE"] %}
        {% set ns.extra = ns.extra ~ " swept=" ~ fr.last_swept|default(-1)|int(-1) %}
    {% elif phase == "mesh" %}
        {% set bm = printer["gcode_macro _BED_MESH_ENSURE"] %}
        {% set ns.extra = ns.extra ~ " probed=" ~ bm.last_probed|default(-1)|int(-1) %}
    {% elif phase == "save_config" %}
        {% set sc = printer["gcode_macro _SAVE_CONFIG_IF_PENDING"] %}
        {% set ns.extra = ns.extra ~ " wrote=" ~ sc.last_wrote|default(-1)|int(-1) %}
    {% endif %}

    {action_respond_info("PRINT_START_MARK seq=" ~ seq ~ " phase=" ~ phase ~ " t=" ~ "%.3f"|format(t) ~ ns.extra)}
    SET_GCODE_VARIABLE MACRO=_PRINT_START_MARK VARIABLE=seq VALUE={seq}
    SET_GCODE_VARIABLE MACRO=_PRINT_START_MARK VARIABLE=phase VALUE='{phase|tojson}'
    SET_GCODE_VARIABLE MACRO=_PRINT_START_MARK VARIABLE=phase_t VALUE={"%.3f"|format(t)}


[gcode_macro _PRINT_START_PHASE_CLEAR]
description: Say that no PRINT_START is running, in _PRINT_START_MARK.phase
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_START_MARK VARIABLE=phase VALUE="''"


[gcode_macro _ON_PRINT_ERROR]
description: What [virtual_sdcard] on_error_gcode runs when a line of a print file raises
# A command that raises inside PRINT_START -- G28, a heat wait, the mesh --
# ends the print on that line. The handover clear never runs, and neither
# PRINT_END nor CANCEL_PRINT is called, so without this the phase of the
# failed start would be published until the next print or klippy restart.
# TURN_OFF_HEATERS is Klipper's own default on_error_gcode, kept as it was.
gcode:
    _PRINT_START_PHASE_CLEAR
    {% if 'heaters' in printer %}
        TURN_OFF_HEATERS
    {% endif %}
    # KAN-568: after the heaters. In a user LED mode the LEDs show the
    # warning for a while, then the mode; 'status' leaves them as they were.
    {% if 'gcode_macro _LED_MODE_AFTER_ERROR' in printer %}
        _LED_MODE_AFTER_ERROR
    {% endif %}


[gcode_macro PRINT_START]
description: print startup sequence
# THE SEQUENCE (Harry, 2026-11-08). The nozzle is the probe, so it is never
# above the anti-ooze temperature while it is over the bed:
#   1. Home X and Y, then a rough Z (one tap, confirmed within 1 mm), with the
#      hot end at the anti-ooze temperature. Ooze on the nozzle can only make
#      Z read high, which makes the wipe's plunge shallower, never deeper.
#   2. Wipe: heat, let it ooze, wipe, heater off, keep wiping until it is
#      back at the anti-ooze temperature.
#   3. Precise Z with the clean nozzle, 5 mm in X from the rough tap.
#   4. Resonance sweep (first print of a Klipper session) while the bed
#      heats, then wait for the bed.
#   5. Mesh this print's region, at the anti-ooze temperature.
#   6. Dock in the wiper, heat to the print temperature, wait for the bed.
#   7. Lift and hand over to the slicer (PURGE_LINE).
#
# ANTI-OOZE TEMPERATURE. One value, [nozzle_wipe_smart] stop_temp
# (nozzle_wipe.cfg): the wipe cools to it, and PRINT_START holds it until
# the nozzle is docked again. m1_machine's pause cool-down uses the same
# number (fan_off_temp).
#
# CANCELLABLE. The print file runs this whole macro as one line, which holds
# Klipper's gcode lock for all of it. abortable lets a cancel stop it between
# any two of the lines below, or inside the heat waits and NOZZLE_WIPE_SMART.
# A line that is a macro (G28, _PRINT_START_MESH, FINETUNE_RESONANCE) runs
# whole, and a cancel takes effect when it returns. See
# gcode.run_abortable_script(). So CANCEL_PRINT -> PRINT_END copes with the
# nozzle anywhere these lines leave it: docked in the wiper (X100 Y14 Z3) or
# mid-wipe, where PRINT_END lifts 6 mm before any XY move. A staged sweep is
# written by CANCEL_PRINT's own _SAVE_CONFIG_IF_PENDING.
abortable: True
gcode:
    # KAN-569: no print starts while a hot-end fan fault stands.
    _HOTEND_FAN_GUARD WHAT=Print
    # The M1 start gate (m1_machine): one live checklist for the Z column,
    # the plate, the toolhead, its hot end, filament and bed power. Before the
    # start mark, so time spent waiting for a person is not time-to-first-layer.
    MACHINE_WAIT_READY ACTION=print
    {% set BED_TEMP = params.BED|default(65)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(190)|float %}
    {% set MATERIAL = params.MATERIAL|default("")|upper %}
    # 130 only where there is no [nozzle_wipe_smart] (the klippy batch test).
    {% set _nws = printer.configfile.settings.nozzle_wipe_smart|default({}) %}
    {% set OOZE_TEMP = _nws.stop_temp|default(130)|float %}
    # The bed is meshed at most this far under its target.
    {% set READY_TEMP = BED_TEMP - 10 %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_START
    # KAN-201: one mark per phase boundary, see _PRINT_START_MARK.
    _PRINT_START_MARK PHASE=start BED={BED_TEMP} EXTRUDER={EXTRUDER_TEMP} MATERIAL={MATERIAL}
    # A fake layer count so M73 works without a Klipper restart.
    SET_PRINT_STATS_INFO TOTAL_LAYER=100 CURRENT_LAYER=0
    M73 P0
    LED_SETUP_PROGRESS
    M107
    # No mesh until this print's own. The stored one is from the last print,
    # or from another bed, and would tilt the homing moves and the wipe.
    BED_MESH_CLEAR
    # The bed heats from here. [verify_heater heater_bed] in core.cfg is tuned
    # for the wipe fan blowing across it.
    M140 S{BED_TEMP}
    M104 S{OOZE_TEMP}

    # 1. X, Y and a rough Z.
    G28 PARK=0 TOLERANCE=1
    _PRINT_START_MARK PHASE=home
    M73 P20

    # 2. Wipe. It cools to OOZE_TEMP, and the hot end is held there.
    NOZZLE_WIPE_SMART
    M104 S{OOZE_TEMP}
    _PRINT_START_MARK PHASE=wipe
    M73 P35

    # 3. Precise Z, off to the side of anything the rough tap left.
    G28 Z PARK=0 X_OFFSET=-5
    _PRINT_START_MARK PHASE=home_z
    M73 P45

    # 4. Resonance while the bed heats. FINETUNE_RESONANCE sweeps on the
    # first print of a Klipper session and reuses it after that. Only a sweep
    # stages anything worth saving, so this is the one SAVE_CONFIG.
    FINETUNE_RESONANCE
    _PRINT_START_MARK PHASE=resonance
    _SAVE_CONFIG_IF_PENDING
    _PRINT_START_MARK PHASE=save_config
    MACHINE_HEAT_WAIT HEATER=heater_bed MINIMUM={READY_TEMP}
    _PRINT_START_MARK PHASE=bed_wait
    M73 P60

    # 5. Mesh at OOZE_TEMP. Not saved: the next print probes its own.
    _PRINT_START_MESH BED={BED_TEMP}{" MESH_MIN=" ~ params.MESH_MIN if params.MESH_MIN is defined}{" MESH_MAX=" ~ params.MESH_MAX if params.MESH_MAX is defined}{" PURGE_LANE=" ~ params.PURGE_LANE if params.PURGE_LANE is defined}{" ALGORITHM=" ~ params.ALGORITHM if params.ALGORITHM is defined}
    _PRINT_START_MARK PHASE=mesh
    M73 P80

    # 6. Dock in the wiper, the only place the nozzle goes above OOZE_TEMP.
    ANTI_OOZE_NOZZLE_DOCK
    _PRINT_START_MARK PHASE=dock
    # +3 C: measured fastest (+1 -> 54.4 s, +3 -> 38.4 s, +8 -> 47.4 s).
    M104 S{EXTRUDER_TEMP + 3}
    MACHINE_HEAT_WAIT HEATER=extruder MINIMUM={[180, EXTRUDER_TEMP - 0.5]|min}
    _PRINT_START_MARK PHASE=hotend_wait_180
    G1 E-1.0 F300  ; retract, against ooze
    MACHINE_HEAT_WAIT HEATER=extruder MINIMUM={EXTRUDER_TEMP - 0.5}
    _PRINT_START_MARK PHASE=hotend_wait_target
    # KAN-222: M104, not M109. It is at temperature; M109 would only wait for
    # the overshoot to flatten.
    M104 S{EXTRUDER_TEMP}
    MACHINE_HEAT_WAIT HEATER=heater_bed MINIMUM={BED_TEMP - 1}
    _PRINT_START_MARK PHASE=bed_settle

    # 7. Hand over: lift out of the wiper, beside the bed block.
    G91
    G0 Z10 F200
    G90
    G0 X130.0 Y2.0 F7800
    M73 P100
    RESTORE_GCODE_STATE NAME=STATE_PRINT_START
    {% set zoff = printer.configfile.settings.load_cell_probe.z_offset|float %}
    SET_GCODE_OFFSET Z={zoff}
    G1 E1.0 F300  ; unretract
    LED_PRINTING
    # Moves are queued, not complete, here (see _PRINT_START_MARK).
    _PRINT_START_MARK PHASE=handover
    # The slicer's own start gcode runs from here.
    _PRINT_START_PHASE_CLEAR
    M73 P0


[gcode_macro _PRINT_START_MESH]
description: Probe this print's bed region, with the purge lane in it (PRINT_START step 5)
# A macro of its own so PRINT_START reads as its sequence. MESH_MIN and
# MESH_MAX are the slicer's region ("x,y"), PURGE_LANE=1 asks for a purge
# lane (KAN-990), ALGORITHM is passed to BED_MESH_CALIBRATE. Without a region
# the whole configured bed is probed.
gcode:
    {% set BED_TEMP = params.BED|default(65)|float %}
    {% if params.MESH_MIN is defined and params.MESH_MAX is defined %}

      # Parse slicer-passed bounds (these come in as "x,y")
      {% set _min_in = params.MESH_MIN.split(',') %}
      {% set _max_in = params.MESH_MAX.split(',') %}
      {% set in_min_x = _min_in[0]|float %}
      {% set in_min_y = _min_in[1]|float %}
      {% set in_max_x = _max_in[0]|float %}
      {% set in_max_y = _max_in[1]|float %}

      # Read [bed_mesh] limits from printer.cfg
      # Depending on Klipper version, these may be a tuple/list (x,y) OR a string "x,y"
      {% set cfg_min_raw = printer.configfile.settings['bed_mesh']['mesh_min'] %}
      {% set cfg_max_raw = printer.configfile.settings['bed_mesh']['mesh_max'] %}

      {% if cfg_min_raw is string %}
          {% set _cfg_min = cfg_min_raw.split(',') %}
          {% set cfg_min_x = _cfg_min[0]|float %}
          {% set cfg_min_y = _cfg_min[1]|float %}
      {% else %}
          {% set cfg_min_x = cfg_min_raw[0]|float %}
          {% set cfg_min_y = cfg_min_raw[1]|float %}
      {% endif %}

      {% if cfg_max_raw is string %}
          {% set _cfg_max = cfg_max_raw.split(',') %}
          {% set cfg_max_x = _cfg_max[0]|float %}
          {% set cfg_max_y = _cfg_max[1]|float %}
      {% else %}
          {% set cfg_max_x = cfg_max_raw[0]|float %}
          {% set cfg_max_y = cfg_max_raw[1]|float %}
      {% endif %}

      # Clamp slicer bounds to cfg bounds
      {% set mesh_min_x = [ [in_min_x, cfg_min_x] | max, cfg_max_x ] | min %}
      {% set mesh_min_y = [ [in_min_y, cfg_min_y] | max, cfg_max_y ] | min %}
      {% set mesh_max_x = [ [in_max_x, cfg_min_x] | max, cfg_max_x ] | min %}
      {% set mesh_max_y = [ [in_max_y, cfg_min_y] | max, cfg_max_y ] | min %}

      # Ensure min <= max
      {% if mesh_max_x < mesh_min_x %}
          {% set _t = mesh_min_x %}{% set mesh_min_x = mesh_max_x %}{% set mesh_max_x = _t %}
      {% endif %}
      {% if mesh_max_y < mesh_min_y %}
          {% set _t = mesh_min_y %}{% set mesh_min_y = mesh_max_y %}{% set mesh_max_y = _t %}
      {% endif %}

      # KAN-990: the purge line goes where this mesh probes. The region above is
      # the print's first layer plus the slicer's margin, and Klipper does not
      # extrapolate a mesh, so a purge drawn outside it runs at the nearest
      # edge's height. The profile's old purge ran along Y -1.5 to 4.5, about
      # 78 mm from a centred part, on a bed that spans 3.6 mm and cannot be
      # levelled (KAN-219). It dragged the nozzle, or tripped contact_guard and
      # aborted the print.
      #
      # So the lane is planned here, before the region is handed on. It is a
      # row PURGE_LINE.gap in front of the region, or behind it when the front
      # has no room, and it is kept off every [bed_mesh] no-go region (the bed
      # block). The region is then grown to take it in, so the lane is one of
      # the rows this mesh probes, and it never crosses the print, which lies
      # inside the region. PURGE_LINE, which the slicer calls after PRINT_START,
      # draws along it.
      #
      # Only when the slicer asks with PURGE_LANE=1, which a profile that calls
      # PURGE_LINE passes. A profile that still draws its own purge gets the
      # region it sent, so its mesh is not grown for a lane nothing uses.
      {% set pl = printer["gcode_macro PURGE_LINE"] %}
      {% set lane = namespace(y=none, toward=1, x0=0.0, x1=0.0) %}
      {% set want_lane = params.PURGE_LANE|default(0)|int == 1 %}
      {% if want_lane and mesh_min_y - pl.gap >= cfg_min_y %}
          {% set lane.y = mesh_min_y - pl.gap %}
      {% elif want_lane and mesh_max_y + pl.gap <= cfg_max_y %}
          {% set lane.y = mesh_max_y + pl.gap %}
          {% set lane.toward = -1 %}
      {% endif %}
      {% set lane.x0 = [ [mesh_min_x, cfg_min_x] | max, cfg_max_x - pl.length ] | min %}
      {% set lane.x1 = [lane.x0 + pl.length, cfg_max_x] | min %}
      {% set _bm = printer.configfile.settings['bed_mesh'] %}
      {% for i in range(1, 100) %}
          {% set _ng_min = _bm.get('no_go_region_%d_min' % i) %}
          {% set _ng_max = _bm.get('no_go_region_%d_max' % i) %}
          {% if lane.y is not none and _ng_min is not none and _ng_max is not none %}
              {% if _ng_min is string %}{% set _ng_min = _ng_min.split(',') %}{% endif %}
              {% if _ng_max is string %}{% set _ng_max = _ng_max.split(',') %}{% endif %}
              {% set nx0 = [_ng_min[0]|float, _ng_max[0]|float] | min - pl.clearance %}
              {% set nx1 = [_ng_min[0]|float, _ng_max[0]|float] | max + pl.clearance %}
              {% set ny0 = [_ng_min[1]|float, _ng_max[1]|float] | min - pl.clearance %}
              {% set ny1 = [_ng_min[1]|float, _ng_max[1]|float] | max + pl.clearance %}
              {% if lane.y >= ny0 and lane.y <= ny1 and lane.x0 < nx1 and lane.x1 > nx0 %}
                  # Step off it to the side the lane was mostly on, so the grown
                  # region stays small; the other side only if that one is too
                  # short. Shortened to fit either way.
                  {% set _left = (lane.x0 + lane.x1) < (nx0 + nx1) %}
                  {% if (_left and nx0 - cfg_min_x >= pl.min_length) or cfg_max_x - nx1 < pl.min_length %}
                      {% set lane.x1 = nx0 %}
                      {% set lane.x0 = [nx0 - pl.length, cfg_min_x] | max %}
                  {% else %}
                      {% set lane.x0 = nx1 %}
                      {% set lane.x1 = [nx1 + pl.length, cfg_max_x] | min %}
                  {% endif %}
              {% endif %}
          {% endif %}
      {% endfor %}
      {% if lane.y is not none and lane.x1 - lane.x0 < pl.min_length %}
          {% set lane.y = none %}
      {% endif %}
      {% if lane.y is not none %}
          {% set mesh_min_x = [mesh_min_x, lane.x0] | min %}
          {% set mesh_max_x = [mesh_max_x, lane.x1] | max %}
          {% set mesh_min_y = [mesh_min_y, lane.y] | min %}
          {% set mesh_max_y = [mesh_max_y, lane.y] | max %}
      {% endif %}

      # Compute probe counts:
      {% set width_x = mesh_max_x - mesh_min_x %}
      {% set depth_y = mesh_max_y - mesh_min_y %}
      {% set step = 37.9 %}
      {% set eps = 0.0001 %}

      # required points = ceil(L/step) + 1 #
      {% set pc_x = (((width_x + step - eps) / step) | int) + 1 %}
      {% set pc_y = (((depth_y + step - eps) / step) | int) + 1 %}

      # clamp to minimum 3 #
      {% if pc_x < 3 %}
        {% set pc_x = 3 %}
      {% endif %}
      {% if pc_y < 3 %}
        {% set pc_y = 3 %}
      {% endif %}

      {% if pc_x > 6 %}
        {% set pc_x = 6 %}
      {% endif %}
      {% if pc_y > 5 %}
        {% set pc_y = 5 %}
      {% endif %}

      
      {% set algo = params.ALGORITHM|default("bicubic") %}

      # Two commands, because a macro renders in full before any of its gcode
      # runs: _BED_MESH_PLAN publishes the points (MuonUI draws them live)
      # before _BED_MESH_ENSURE probes them. Both get the same region and
      # PROBE_COUNT, so the points published are the points probed.
      _BED_MESH_PLAN BED={BED_TEMP} MESH_MIN={mesh_min_x},{mesh_min_y} MESH_MAX={mesh_max_x},{mesh_max_y} PROBE_COUNT={pc_x},{pc_y}
      # Clears and probes this print's region.
      _BED_MESH_ENSURE BED={BED_TEMP} MESH_MIN={mesh_min_x},{mesh_min_y} MESH_MAX={mesh_max_x},{mesh_max_y} PROBE_COUNT={pc_x},{pc_y} ALGORITHM={algo}
    {% else %}
      # No slicer region: probe the whole configured one.
      _BED_MESH_PLAN BED={BED_TEMP}
      _BED_MESH_ENSURE BED={BED_TEMP}
    {% endif %}
    # KAN-990: the lane PURGE_LINE draws along. Set on every print, so a lane
    # from an earlier one is never reused; None when there was no slicer region,
    # no PURGE_LANE=1, or no room for one.
    {% if lane is defined and lane.y is not none %}
    SET_GCODE_VARIABLE MACRO=PURGE_LINE VARIABLE=lane VALUE=[{lane.x0|round(2)},{lane.x1|round(2)},{lane.y|round(2)},{lane.toward}]
    {% else %}
    SET_GCODE_VARIABLE MACRO=PURGE_LINE VARIABLE=lane VALUE=None
    {% endif %}


# [gcode_macro PCF_CHECK]
# description: Use before print startup, checks the part fan for failures
# gcode:
#     M106 S50       ; turn on the part fan

#     G4 P2000        ; wait for the fan to spin up
#     M400            ; wait for wait to finish
#     _PCF_CHECKER    ; check part fan speed & respond
#     M106 S0         ; turn off the part fan


# [gcode_macro _PCF_CHECKER]
# description: Helper macro for PCF_CHECK
# gcode:
#     {% if printer.fan.rpm is not none %}
#         {% if printer.fan.rpm > 500 %}
#             {action_respond_info("Part cooling fan self-test: PASS")}
#         {% else %}
#             CANCEL_PRINT
#             {action_respond_info("Part cooling fan self-test: FAIL!")}
#         {% endif %}
#     {% endif %}


# [gcode_macro NOZZLE_PURGE]
# description: Draw a purge line at the front left edge of the build plate
# gcode:
#     G28 O
#     SAVE_GCODE_STATE NAME=NOZZLE_PURGE
#     G90                     ; Use absolute coordinates
#     G0 X0 Y40 F7200         ; Go to side
#     G0 Z0.2                 ; Drop to bed
#     M83                     ; Set extruder to relative mode
#     G1 X0 Y135 E30 F800     ; print prime line
#     G1 E-0.5 F400           ; Retract a little
#     G1 Y170 F4000           ; Quickly wipe away from the filament line
#     G1 Z0.4                 ; Raise and begin printing.
#     RESTORE_GCODE_STATE NAME=NOZZLE_PURGE


# [gcode_macro NOZZLE_DOCK]
# description: Docks the nozzle at the corner of the bed to prevent ooze
# variable_dock_x: 3.5
# variable_dock_y: 1.0
# variable_dock_z: 0.0
# gcode:
#     G28 O
#     SAVE_GCODE_STATE NAME=NOZZLE_DOCK
#     G91                           ; relative positioning
#     G1 Z5                         ; move nozzle upwards slightly
#     G90                           ; absolute positioning
#     G0 X{dock_x} Y{dock_y} F7200  ; Go dock position
#     G0 Z{dock_z}
#     RESTORE_GCODE_STATE NAME=NOZZLE_DOCK


# [gcode_macro NOZZLE_UNDOCK]
# description: Safely moves the nozzle out of its docking position
# gcode:
#     G28 O
#     SAVE_GCODE_STATE NAME=NOZZLE_UNDOCK
#     G91                            ; relative positioning
#     G1 Z10                         ; move nozzle upwards slightly
#     RESTORE_GCODE_STATE NAME=NOZZLE_UNDOCK


[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    # First, so a cancel that fails further down still clears it.
    _PRINT_START_PHASE_CLEAR
    # Read when this CANCEL_PRINT runs, not when it was requested. A second
    # press queues a second CANCEL_PRINT behind the first, and by the time it
    # runs the first has cancelled the print and PRINT_END has parked and
    # M84'd the head -- so running PRINT_END again only raised "Must home
    # axis first" on its first move. "error" still cleans up: a failed print
    # can be left with the head over the part.
    {% set state = printer.print_stats.state %}
    {% set had_print = state in ["printing", "paused", "error"] %}
    {% set cf = printer.configfile if 'configfile' in printer else {} %}

    CANCEL_PRINT_BASE
    # Ensure we are not left in a paused state that can be resumed
    CLEAR_PAUSE
    {% if had_print %}
        PRINT_END
        # A cancel can now stop PRINT_START part way (abortable, above),
        # including between a mesh record or a resonance sweep and the
        # SAVE_CONFIG that makes the calibration it describes durable. Close
        # that gap here. After PRINT_END (KAN-568), so nothing new stands
        # before the heaters turning off; PRINT_END's park can no longer
        # abort it (print_end_park). A mesh cut short part way is never
        # staged, so this only ever writes a calibration that completed.
        {% if cf.save_config_pending|default(true) %}
            _SAVE_CONFIG_IF_PENDING
        {% endif %}
    {% else %}
        {action_respond_info("CANCEL_PRINT: no print in progress (" ~ state ~ "), nothing to clean up")}
    {% endif %}
    # KAN-569: after PRINT_END, so nothing new stands before the heaters
    # turning off. A release of the unlock button held through the cancel
    # then restores nothing.
    {% if 'gcode_macro _UNLOCK_FORGET' in printer %}
        _UNLOCK_FORGET
    {% endif %}

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
# The hot-end target as it stood when this pause began, for RESUME to put
# back. PAUSE turns the hot end off itself, after the retract (Harry,
# 2026-11-04: a nozzle left hot while paused oozes onto the print). Two
# callers zero it before PAUSE runs and pass the target it had as
# HOTEND_TARGET, which is recorded instead: FAN_STOPPAGE_ROUTINE (fan.cfg)
# and TOOLHEAD_DISCONNECT (toolhead.cfg). 0 means 'nothing to put back',
# which is also the value before the first pause of a session.
#
# The sequence, once per pause: retract, the hot end off, lift Z by `lift`
# (less near the top of Z, so it never runs into the end of the axis), park
# at the back right, then MACHINE_PAUSED. If the part fan was on, it stays at
# the print's speed until the nozzle is below m1_machine's pause_cool_temp,
# and then goes off.
#
# M1 (m1_machine, audit section 6). REASON says why: user (the default),
# plate_removed, column_unlocked, toolhead_disconnected, bed_power_lost,
# bed_power_fault, fan_fault, filament_out, filament_change. m1_machine
# keeps it, the bed target and the part-fan speed FAN (0 to 1, the
# commanded speed by default) for RESUME, and shows the reason's prompt.
variable_saved_hotend_target: 0.0
variable_lift: 5.0
gcode:
    {% set reason = params.REASON|default("user")|lower %}
    {% set job = printer.print_stats.state in ("printing", "paused") %}
    {% if not job %}
      # A pause needs a print. An idle PAUSE used to stand until the next
      # print started, and then paused that (audit F4).
      {action_respond_info("PAUSE: no print to pause")}
    {% elif printer.pause_resume.is_paused %}
      # Already paused: only note the new reason. A second retract, lift
      # and park used to run here, and RESUME un-retracts once (F3).
      MACHINE_PAUSED REASON={reason}
    {% else %}
    # Recorded before PAUSE_BASE, on the transition into a pause.
    # HOTEND_TARGET, when a caller has already zeroed the heater
    # (FAN_STOPPAGE_ROUTINE, TOOLHEAD_DISCONNECT), is what it was.
    # It is checked: anything but a number from 0 to the extruder's
    # max_temp records 0, which RESUME reads as nothing to put back.
    {% if 'HOTEND_TARGET' in params %}
        {% set max_t = printer.configfile.settings.get('extruder', {}).get('max_temp', 0)|float %}
        {% set given = params.HOTEND_TARGET|float(-1) %}
        {% set tgt = given if given >= 0 and given <= max_t else 0.0 %}
    {% else %}
        {% set tgt = printer.extruder.target|float %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=saved_hotend_target VALUE={tgt}
    {% if 'FAN' in params %}
        {% set fan = params.FAN|float(0) %}
    {% elif 'fan_modes' in printer %}
        {% set fan = printer.fan_modes.commanded_speed|float(0) %}
    {% elif 'fan' in printer %}
        {% set fan = printer.fan.speed|float(0) %}
    {% else %}
        {% set fan = 0.0 %}
    {% endif %}

    ##### read E from pause macro #####
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    # Park at the back right (X and Y max, the homing corner, PRN-24), 5 mm
    # in for auto_skew's shift (KAN-226).
    {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
    {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
    # Lift by `lift`, or by what is left below the top of Z.
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set z_safe = [printer["gcode_macro PAUSE"].lift|float, max_z - act_z]|min %}
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-{E} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    # After the retract, which needs the heat. RESUME reheats to the target
    # recorded above before it moves back (_RESUME_RESTORE_HOTEND).
    M104 S0
    {% if "xyz" in printer.toolhead.homed_axes %}
      # Also with the column lever unlocked: the lever only stops the column
      # wobbling, and the Z motor still moves the carriage (Harry,
      # 2026-11-04; the audit's F6 assumed otherwise).
      {% if z_safe > 0 %}
        G1 Z{z_safe} F900
      {% endif %}
      G90
      G1 X{x_park} Y{y_park} F6000
    {% else %}
      {action_respond_info("Printer not homed")}
    {% endif %}
    # m1_machine owns the part fan for the pause: left at the print's speed
    # until the nozzle is below the ooze point, then off. RESUME puts back
    # FAN (F21).
    MACHINE_PAUSED REASON={reason} FAN={fan}
    # KAN-569: last, so that an LED macro that raises can't stop the pause
    # (or the retract and park) from happening. Amber for a pause the
    # machine made, info for one a person asked for.
    {% if reason == "user" %}
      LED_INFO
    {% else %}
      LED_WARNING
    {% endif %}
    {% endif %}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
# The three steps below are three commands rather than one rendered block,
# and that is the whole point. A gcode_macro renders in full before any of
# the gcode it emits runs, so a can_extrude test written here would be
# evaluated against the state RESUME started in -- cold, whenever anything
# shed the hot end during the pause -- no matter how many M104s preceded it
# in the same template. Only a command boundary puts a decision after the
# thing it depends on. Same reasoning as _BED_MESH_PLAN.
gcode:
    # KAN-569: first, so that a refusal runs nothing after it, LEDs included.
    _HOTEND_FAN_GUARD WHAT=Resume
    # The M1 resume gate (m1_machine, audit 6.2): everything a print start
    # needs except a cleared plate. It refuses with the checklist, which then follows the machine and offers Resume once it
    # is complete. WAIT rides out a bed power path that is still starting
    # just after the plate went back or the lever was locked.
    MACHINE_REQUIRE ACTION=resume WAIT=3
    LED_PRINTING
    #### get VELOCITY parameter if specified ####
    {% if 'VELOCITY' in params|upper %}
      {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
    {%else %}
      {% set get_params = "" %}
    {% endif %}
    ##### end of definitions #####
    _RESUME_RESTORE_BED
    _RESUME_RESTORE_HOTEND
    _RESUME_UNRETRACT
    _RESUME_RESTORE_FAN
    MACHINE_RESUMED
    RESUME_BASE {get_params}


[gcode_macro _HOTEND_FAN_GUARD]
description: Refuse (raise) while a hot-end fan fault stands
# KAN-569: no heat into a dead hot-end fan. While HOTEND_FAN_CHECK's sticky
# fault is latched (or a counter stands at 3, max_consecutive_stops in
# fan.cfg), RESUME, _BED_RESUME_NOW (bed.cfg) and PRINT_START run this first.
# It shows the fault prompt again, so the Fan checked button is on screen,
# then raises: the macro that called it stops there, and a paused print
# stays paused. WHAT names the refused action in the message.
gcode:
    {% if 'hotend_fan_latch' in printer %}
        {% set latch = printer.hotend_fan_latch %}
        {% set fan = printer["gcode_macro HOTEND_FAN_CHECK"] if 'gcode_macro HOTEND_FAN_CHECK' in printer else none %}
        {% if latch.latched|int == 1 or (fan is not none and (fan.hotend_stop_count|int >= 3 or fan.sensor_bad_count|int >= 3)) %}
            _HOTEND_FAN_FAULT_PROMPT
            _HOTEND_FAN_REFUSE WHAT="{params.WHAT|default('Resume')}"
        {% endif %}
    {% endif %}

[gcode_macro _HOTEND_FAN_REFUSE]
description: Raise the hot-end fan fault refusal
gcode:
    {action_raise_error("%s refused: hot-end fan fault. Check the fan, then press Fan checked on the printer (or run HOTEND_FAN_FAULT_CLEAR)." % params.WHAT|default("Resume"))}


[gcode_macro _RESUME_RESTORE_BED]
description: Put back the bed target the print had, and wait for it
# Something zeroed it during the pause: z_power on a column unlock,
# bed_removal_detector on a plate pull, or m1_machine's staged idle. The
# print's own target is m1_machine's job_targets.bed (the last one the
# print set), or the detector's restoreTarget, whichever is higher. Like
# the hot end below, it only ever puts heat back. MACHINE_HEAT_WAIT ends the
# resume if the plate comes off again while it waits (audit F7).
gcode:
    {% set m1 = printer.m1_machine if 'm1_machine' in printer else none %}
    {% set det = printer.bed_removal_detector if 'bed_removal_detector' in printer else none %}
    {% set saved = [m1.job_targets.bed|float if m1 is not none else 0.0,
                    det.restoreTarget|float if det is not none else 0.0]|max %}
    {% set now = printer.heater_bed.target|float %}
    {% if printer.pause_resume.is_paused and saved > 0 and now < saved %}
      {action_respond_info("RESUME: reheating the bed to " ~ saved ~ "C")}
      M140 S{saved}
      MACHINE_HEAT_WAIT HEATER=heater_bed MINIMUM={saved - 1}
    {% endif %}


[gcode_macro _RESUME_RESTORE_FAN]
description: Put back the part-fan speed the print had before the pause
# Also when it was off: the pause cool-down may still be running the fan.
gcode:
    {% set fan = printer.m1_machine.saved_fan|float(0) if 'm1_machine' in printer else 0.0 %}
    {% if printer.pause_resume.is_paused %}
      {% if fan > 0 %}
        M106 S{(fan * 255)|round|int}
      {% else %}
        M107
      {% endif %}
    {% endif %}


[gcode_macro _RESUME_RESTORE_HOTEND]
description: Put back the hot-end target PAUSE recorded, and wait for it
# PAUSE turns the hot end off, so this reheats after every pause. It does
# nothing only when someone heated the hot end by hand while paused to at
# least the print's own target.
gcode:
    {% set saved = printer["gcode_macro PAUSE"].saved_hotend_target|float %}
    {% set now = printer.extruder.target|float %}
    # is_paused is load-bearing, not belt and braces. RESUME_BASE does
    # refuse on an unpaused printer, but it refuses *after* this macro has
    # already run, so without the test a stray RESUME after a cancel would
    # heat the nozzle to the finished print's temperature and leave it
    # there with nobody watching.
    #
    # now < saved, not now != saved: a user who raised the temperature by
    # hand while paused -- to purge, or to clear a clog -- keeps their
    # value. This only ever puts heat back, never takes it away.
    {% if printer.pause_resume.is_paused and saved > 0 and now < saved %}
      {action_respond_info("RESUME: reheating hot end to " ~ saved ~ "C")}
      M104 S{saved}
      # The toolhead is still parked off the part here: PAUSE left it at
      # (x_max - 5, y_max - 5) and RESUME_BASE has not moved it back yet,
      # so ooze from the reheat lands beside the print and not on it.
      # MACHINE_HEAT_WAIT, not TEMPERATURE_WAIT: it ends the resume if the
      # toolhead is pulled while it waits, instead of waiting forever.
      MACHINE_HEAT_WAIT HEATER=extruder MINIMUM={saved - 1}
    {% endif %}


[gcode_macro _RESUME_UNRETRACT]
description: The guarded un-retract RESUME has always done
# Unchanged except for being its own command, so that can_extrude is read
# after _RESUME_RESTORE_HOTEND has finished rather than before it started.
# The guard matters: an un-retract below min_extrude_temp (160) raises
# "Extrude below minimum temp", which aborts the macro on that line, so
# everything after it would never run.
gcode:
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G91
      G1 E{E} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}



[gcode_macro PRINT_END]
description: print finish sequence
gcode:

    # Already '' after a completed PRINT_START. Cleared here as well so that
    # nothing which ends a print through PRINT_END leaves a phase standing.
    _PRINT_START_PHASE_CLEAR
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400                                     ; wait for buffer to clear
    # KAN-211: the retract has to be guarded, and TURN_OFF_HEATERS has to be
    # reachable whether or not it runs. Unguarded, a hot end below [extruder]
    # min_extrude_temp (160) makes G1 E-5.0 raise "Extrude below minimum temp",
    # which aborts this macro on that line -- so TURN_OFF_HEATERS and M107 below
    # never execute. CANCEL_PRINT ends by calling PRINT_END, so cancelling
    # a print whose nozzle has dropped below 160 both fails and leaves the bed
    # holding its target. PAUSE and RESUME already guard the identical retract
    # this way, and this spells the test the same way they do.
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G92 E0                               ; zero the extruder
        G1 E-5.0 F3600                       ; retract filament
    {% else %}
        {action_respond_info("PRINT_END: extruder below min_extrude_temp, skipping retract")}
    {% endif %}
    TURN_OFF_HEATERS
    M107                                     ; turn off part fan
    # KAN-272: from here on, pulling the plate is taking the finished print
    # off, not a fault. Without this mark bed_removal_detector paused the
    # file in the park below (the Z lift raises the bed toward the operator),
    # so a finished job was recorded as paused and BED_REMOVED parked the
    # toolhead over the plate being reached for. The heater still goes off
    # and BED_REMOVED still runs; only the pause is skipped. After the
    # heaters on purpose, so nothing new stands in front of them. The mark
    # belongs to this print only and needs no clearing.
    {% if 'bed_removal_detector' in printer %}
        SET_BED_REMOVAL_DETECTOR PRINT_ENDING=1
    {% endif %}
    # Parking can be refused (contact guard, unhomed axes, travel limits).
    # Keep heaters off above it, and always reach the cleanup below it.
    _PRINT_END_PARK

    M84 ; turn off motors
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    # KAN-568: last, so that no LED macro stands between the end of a print
    # and the heaters, fan and motors turning off. A macro that raises ends
    # PRINT_END on that line.
    LED_COMPLETE

[print_end_park]
# This helper catches command refusals only around the optional motion.
# Never continue the cutter sequence after a refused park move.
gcode:
    {% set th = printer.toolhead %}
    {% set z_safe = [th.position.z + 6, th.axis_maximum.z]|min %}
    {% set z_final = [th.position.z + 50, th.axis_maximum.z]|min %}
    G90
    G0 Z{z_safe} F600
    M400
    G90
    G0 X195 Y10 F7800
    G0 Z{z_final} F600
    CUT_FILAMENT




## ----- PURGE LINE, CALLED BY THE SLICER AFTER PRINT_START (KAN-990) ------
# Draws the purge along the lane PRINT_START planned and probed: a row `gap`
# in front of the print's mesh region (behind it if the front has no room),
# off every no-go region, `length` long. It never draws where the mesh did not
# probe. With no lane (no slicer region, or no room) it purges nothing and
# says so: the first layer is a worse purge than a line, but a far better one
# than a nozzle dragged across an unprobed edge. PRINT_START plans a lane only
# when it is given the slicer's MESH_MIN and MESH_MAX and PURGE_LANE=1.
#
# The shape and amounts follow the profile's old L-shaped purge, scaled to the
# lane: a 4 mm prime, the long line, a 2 mm step towards the print (still
# inside the probed region), and a wipe back along half the line.
[gcode_macro PURGE_LINE]
description: Purge along the lane PRINT_START probed for this print
variable_length: 60.0
variable_gap: 6.0
variable_clearance: 2.0
variable_min_length: 30.0
variable_lane: None
gcode:
    {% set lane = printer["gcode_macro PURGE_LINE"].lane %}
    {% if lane is none %}
        {action_respond_info("PURGE_LINE: no purge lane was planned for this print, so there is no probed place to purge. Skipping the purge line. (PRINT_START plans one when it gets MESH_MIN, MESH_MAX and PURGE_LANE=1 and there is room next to the part.)")}
    {% else %}
        {% set x0 = lane[0]|float %}
        {% set x1 = lane[1]|float %}
        {% set y = lane[2]|float %}
        {% set toward = lane[3]|int %}
        {% set run = x1 - x0 %}
        # One lane, one purge.
        SET_GCODE_VARIABLE MACRO=PURGE_LINE VARIABLE=lane VALUE=None
        SAVE_GCODE_STATE NAME=PURGE_LINE
        G90
        M83
        G0 X{x0} Y{y} F8000
        G0 Z0.15 F600
        G1 X{x0 + 4} E5 F300
        G1 X{x1} E{(20 * (run - 4) / 66)|round(3)} F800
        G1 Y{y + 2 * toward} E0.5 F800
        G1 X{x1 - 0.5} E-0.2
        G1 X{(x1 - run / 2)|round(2)} E{(7.5 * (run / 2) / 70)|round(3)} F600
        G1 Z0.6 F800
        RESTORE_GCODE_STATE NAME=PURGE_LINE
    {% endif %}


## ----- USED BY PRINT START GCODE TO SLOW PURGE FOR TPU ------
[gcode_macro SPEED_SLOW_PRE_PURGE_FOR_TPU]
description: If MATERIAL is TPU, slow overall speed to 10% (M220 S10) for purge
gcode:
  {% set mat = params.MATERIAL|default("")|string|upper %}
  {% if "TPU" in mat %}
    M220 S30
  {% endif %}

[gcode_macro SPEED_NORMAL__POST_PURGE_FOR_TPU]
description: If MATERIAL is TPU, restore overall speed to 100% (M220 S100) after purge
gcode:
  {% set mat = params.MATERIAL|default("")|string|upper %}
  {% if "TPU" in mat %}
    M220 S100
  {% endif %}
