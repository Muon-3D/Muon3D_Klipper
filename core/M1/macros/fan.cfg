
[gcode_macro M106]
description: Override M106 to skip if toolhead is disconnected
rename_existing: M106.1
gcode:
  {% set toolhead = printer['mcu toolhead'] %}
  {% set s = params.S|default(0)|int %}

  {% if toolhead.disconnected %}
    RESPOND MSG="Toolhead disconnected — ignoring M106"
    SET_GCODE_VARIABLE MACRO=TOOLHEAD_DISCONNECT VARIABLE=last_partfan_s VALUE={s}
    M106.1 S0
  {% else %}
    M106.1 {rawparams}
  {% endif %}
  


[gcode_macro HOTEND_FAN_CHECK]
variable_hotend_stop_count: 0
# KAN-231: last commanded speed, so the fan is not judged on the pass where it
# was only just told to spin.
variable_hotend_prev_speed: 0.0
# Latches the first time the tachometer ever reports a non-zero reading. The
# tacho on this fan is currently dead (KAN-227: 342 consecutive samples at 0.0
# rpm while the fan demonstrably held the heatsink at 43-46 C against a 200 C
# nozzle), so the stall arm below stays INERT until someone repairs the wire,
# at which point it arms itself. Without this the check cannot be enabled at
# all - it would zero the hot end within 9 seconds of every startup.
variable_tacho_seen: 0
# Arm C's own consecutive-pass counter. Deliberately separate from
# hotend_stop_count - see the block at the end of this macro for why.
variable_sensor_bad_count: 0
gcode:
    # Tacho check for a VARIABLE-SPEED fan (KAN-217).
    #
    # The previous test compared rpm against a fixed floor while this fan's
    # commanded speed varies, so a correctly spinning fan at low speed read
    # as stopped and FAN_STOPPAGE_ROUTINE paused the print and zeroed the
    # hot end.
    #
    # Stall arm only, same reason as CPU -- the heatsink fan was idle (35.9
    # C, target 65). This check is currently commented out of
    # CHECK_ALL_FANS; it is fixed here so re-enabling it does not
    # reintroduce the counter bug.
    {% set max_consecutive_stops = 3 %}
    {% set min_check_speed = 0.25|float %}
    # Heatsink temperature that means the fan has lost, whatever the tacho says.
    #
    # This was 60 C, picked from the HEALTHY envelope alone because nobody had
    # ever measured a stalled fan. E22 measured it, and 60 C was wrong: the
    # heatsink ASYMPTOTES below it. Stalled, no filament, dead-man armed:
    #
    #     nozzle 190 C   41.6 -> 53.7 C, flat by t+470 s, 60 C never reachable
    #     nozzle 215 C   42.9 -> 59.2 C at t+600 s, still creeping at 0.5 C/min
    #
    # So the arm did not fire at all at PLA-low, and would have been about
    # twelve minutes late at PLA-normal. That is the worst place for the gap:
    # PLA's glass transition is ~60 C, so a heatsink parked at 54 C is already
    # in the heat-creep regime this check exists to catch.
    #
    # 51 C is chosen against both failure modes, from five healthy points across
    # two sessions, two nozzle temperatures and both part-fan states:
    #
    #     worst healthy heatsink ever measured    46.4 C   -> +4.6 C of margin
    #     lowest measured stalled asymptote       53.7 C   -> -2.7 C of margin
    #
    # It also carries a meaning rather than being a fitted number. The fan is
    # closed-loop on this sensor and its curve saturates at 50 C, so a healthy
    # machine cannot sit above 50 for long - the loop pulls it back. Above the
    # saturation point the fan is flat out and STILL losing, which is the fault
    # itself rather than a symptom of it.
    #
    # Not lower: 48 C leaves only 1.6 C over the healthy envelope. Not higher:
    # 53 C clears the 190 C asymptote by 0.7 C, so a slightly cooler room would
    # silently stop it firing - reintroducing exactly this bug.
    #
    # Time to fire after the fan stops, measured: 224 s at 190 C, 99 s at 215 C.
    #
    # Replayed at the real 3 s cadence against every healthy sample on record -
    # five sustained holds at nozzle 200 and 215 with the part fan both off and
    # at 20%, five full PRINT_START runs sampled at 1 Hz, and the warm-up phases
    # of both stall runs. Zero false positives; the worst healthy heatsink seen
    # anywhere in that corpus is 47.9 C.
    #
    # One replay hit, and it is not a defect: the recovery immediately after a
    # deliberately induced stall, where the heatsink really was at 59 C with the
    # fan flat out. Firing there is correct - the arm cannot tell "recovering"
    # from "still failing" and should not try. The practical consequence is that
    # a fan-stall diagnostic will trip this arm on its way back down, which is
    # worth knowing before running one.
    #
    # Still NOT validated against a real fan failure. A stall induced in software
    # cannot satisfy the req_speed clause below, because TARGET=0 drops the
    # command with the fan and max_power scales the reported speed along with the
    # drive (fan.py:53 applies it before storing the value). Only unplugging the
    # fan produces "commanded on, not turning". Bench job, with KAN-227.
    # CORRECTION, 2026-08-23. A flat 51.0 false-fired on a HEALTHY fan.
    #
    # The 51 C was chosen from a healthy envelope measured only at nozzle 190
    # and 215 C, where the worst heatsink ever seen is 45.8 C. It was then run
    # at a 255 C nozzle during a hot-end unblocking attempt and the heatsink
    # legitimately reached 51.2 C with the fan flat out at speed 1.0 - so the
    # arm fired on a fan that was working perfectly, and each firing zeroed the
    # extruder heater.
    #
    # The healthy heatsink rises with nozzle temperature, so a single constant
    # cannot separate healthy-at-255 (51.2 C) from stalled-at-190 (53.7 C) -
    # that is a 2.5 C window. The threshold has to move with the nozzle.
    #
    # Anchored so nothing already verified changes: at or below 215 C it stays
    # exactly 51.0, so every replay behind that number still holds. Above 215 it
    # rises 0.12 C per C of nozzle, which is the only region where new data
    # exists.
    #
    #   nozzle   threshold   worst healthy   margin      stalled   margin
    #      190      51.0          41.5        +9.5         53.7     -2.7
    #      215      51.0          45.8        +5.2         59.2     -8.2
    #      255      55.8          51.2        +4.6        ~60 (extrapolated)
    #      265      57.0            -            -           -
    #
    # The 255 C healthy figure is ONE measurement, taken while a blockage was
    # being worked on rather than in a controlled soak, so the margin above 215
    # is less well founded than the margin below it. If this fires again on a
    # healthy fan, get a proper healthy soak at 255 before touching the number.
    {% set nozzle_c = printer.extruder.temperature|default(0)|float %}
    {% set over_temp_c = 51.0 + 0.12 * ([nozzle_c - 215.0, 0.0]|max) %}

    {% set req_speed = printer['temperature_fan toolhead_heatsink'].speed|default(0)|float %}
    {% set rpm       = printer['temperature_fan toolhead_heatsink'].rpm|default(0)|float %}
    {% set stops     = printer["gcode_macro HOTEND_FAN_CHECK"].hotend_stop_count|int %}

    {% set hs_temp = printer["temperature_fan toolhead_heatsink"].temperature|default(0)|float %}
    {% set seen    = printer["gcode_macro HOTEND_FAN_CHECK"].tacho_seen|int %}
    {% set prev    = printer["gcode_macro HOTEND_FAN_CHECK"].hotend_prev_speed|float %}
    {% set judge   = req_speed >= min_check_speed and prev >= min_check_speed %}

    # Stall arm: only meaningful once the tachometer has proved it works.
    {% set stalled = judge and seen == 1 and rpm <= 0.0 %}

    # Over-temperature arm: needs no tachometer at all. This is the one that
    # gives the machine real protection today. Heat creep - filament softening
    # above the melt zone and jamming the extruder - is what a dead heatsink fan
    # causes, and on this printer the nozzle IS the load-cell probe, so a jam
    # corrupts every tap and the Z datum rather than merely stopping extrusion.
    # The speed clause is what separates "fan failing" from "fan deliberately
    # off": at over_temp_c the curve is already commanding 1.0, so on healthy
    # hardware it is implied - but it correctly suppresses the arm when someone
    # has parked the fan (SET_TEMPERATURE_FAN_TARGET TARGET=0), which is not a
    # fault. Keep it.
    #
    # Known coupling, harmless today and worth knowing before anyone changes it:
    # the reported speed is scaled by max_power (fan.py:53 applies the scaling
    # before storing the value it reports), so setting max_power below 0.95 on
    # this fan would make req_speed unable to reach the clause and silently
    # disarm it. max_power is 1.0.
    {% set over_temp = req_speed >= 0.95 and hs_temp >= over_temp_c %}

    {% set bad = stalled or over_temp %}

    {% if bad %}
        # A macro renders in full before any command it emits runs, so the
        # counter has to be advanced in a local variable here. Re-reading
        # the gcode variable below would still see the pre-increment value.
        {% set nxt = stops + 1 %}
        # CAP the counter. Without this the over-temperature arm re-invokes
        # FAN_STOPPAGE_ROUTINE every 3 s for as long as the condition holds -
        # observed live on 2026-08-23 running away to (4/3), (5/3), (6/3), each
        # one zeroing the extruder heater again. An over-temperature condition
        # is PERSISTENT by nature, unlike the transient stall this counter was
        # originally written for, so it must fire exactly once per episode. The
        # counter still resets on the elif below, so it re-arms by itself if the
        # condition clears.
        {% if nxt <= max_consecutive_stops %}
            SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=hotend_stop_count VALUE={nxt}
            M118 WARNING: Hotend fan {"over temperature" if over_temp else "not turning"} ({nxt}/{max_consecutive_stops}) speed={req_speed|round(2)} rpm={rpm|round(0)} heatsink={hs_temp|round(1)}C
            {% if nxt >= max_consecutive_stops %}
                FAN_STOPPAGE_ROUTINE FAN_NAME="Hotend"
            {% endif %}
        {% endif %}
    {% elif stops > 0 %}
        SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=hotend_stop_count VALUE=0
    {% endif %}
    # Latch the moment the tacho ever reads: this arms the stall arm by itself
    # if the sense wire is repaired, with no further config change needed.
    {% if seen == 0 and rpm > 0.0 %}
        SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=tacho_seen VALUE=1
        M118 Hotend fan tachometer is reading ({rpm|round(0)} rpm); stall detection now armed
    {% endif %}
    SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=hotend_prev_speed VALUE={req_speed}

    # ---- Arm C: the heatsink sensor itself is not telling the truth --------
    #
    # Arms A and B both trust hs_temp absolutely, and one dead sensor takes out
    # the fan AND both arms at once:
    #
    #   toolhead:gpio26, the same divider and sensor_type on the same board, is
    #   already failing at -35.3 C, with measured_max_temp still 0.00 - its
    #   initialiser - so it has never once read positive. If gpio28 goes the
    #   same way, -35 C is INSIDE the [min_temp -50, max_temp 100] window, so no
    #   MCU range check fires. ControlCurve extends the curve flat at points[0]'s
    #   speed down to min_temp, so the commanded speed becomes exactly 0.0 - the
    #   fan stops. And min_speed cannot floor it, because set_tf_speed zeroes
    #   before it applies the clamp. Arm A then needs req_speed >= 0.25 and arm
    #   B needs >= 0.95, so both go quiet on that same reading.
    #
    #   One fault: fan off, hot nozzle, no warning.
    #
    # Raising min_temp is NOT the fix and was rejected. On this MCU an ADC range
    # trip is a latched, restart-only loss of the whole toolhead - mcu.py sets
    # _is_shutdown = True and nothing ever clears it - so a persistent open
    # would latch the toolhead out shortly after every boot and you could not
    # bring the machine up to diagnose it. That trades a silent fault for an
    # unrecoverable one.
    #
    # -10.0 C is chosen against both directions and is not fitted:
    #   * far below any ambient a printer is powered on in, and this heatsink
    #     cannot read below ambient;
    #   * far above any plausible open-circuit reading (-35 C measured);
    #   * above the 0.0 that temperature_fan initialises last_temp to, so the
    #     window between klippy ready and the first ADC callback CANNOT trip
    #     this arm by construction rather than by debounce. That property is
    #     load-bearing - judging a sensor before it has reported is exactly the
    #     defect shape of KAN-217/228/230/231.
    #
    # Replayed over every sample on record - e15, e16, e21 and both e22 stall
    # runs: 2211 samples, 2043 inside the armed window, ZERO firings, closest
    # approach 34.36 C. That is 44.36 C of margin. It correctly stays silent
    # through both deliberately stalled runs, because a real stall is the sensor
    # telling the truth and the 51 C arm owns that case.
    #
    # The nozzle gate uses max(target, actual): target arms it the moment M104
    # is issued and is host state this sensor fault cannot corrupt, while actual
    # keeps it armed through cooldown, which is still heat-creep territory.
    {% set sensor_floor_c = -10.0 %}
    {% set hot_extruder_c = 100.0 %}
    {% set e_temp = printer.extruder.temperature|default(0)|float %}
    {% set e_targ = printer.extruder.target|default(0)|float %}
    {% set hot = e_temp >= hot_extruder_c or e_targ >= hot_extruder_c %}
    {% set sensor_bad = hot and hs_temp <= sensor_floor_c %}
    {% set sfc = printer["gcode_macro HOTEND_FAN_CHECK"].sensor_bad_count|int %}

    # Deliberately NOT folded into `bad` above. This fault is PERMANENT, so a
    # shared counter would re-invoke FAN_STOPPAGE_ROUTINE every 3 s forever. The
    # snxt <= max_consecutive_stops guard caps the counter so the routine runs
    # exactly ONCE per episode, and the arm re-arms itself if the reading ever
    # returns to something plausible.
    {% if sensor_bad %}
        {% set snxt = sfc + 1 %}
        {% if snxt <= max_consecutive_stops %}
            SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=sensor_bad_count VALUE={snxt}
            M118 WARNING: Hotend heatsink sensor implausible ({snxt}/{max_consecutive_stops}) heatsink={hs_temp|round(1)}C extruder={e_temp|round(1)}C - open circuit, service required
            {% if snxt >= max_consecutive_stops %}
                FAN_STOPPAGE_ROUTINE FAN_NAME="Hotend heatsink sensor"
            {% endif %}
        {% endif %}
    {% elif sfc > 0 %}
        SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=sensor_bad_count VALUE=0
    {% endif %}




[gcode_macro MD_FAN_CHECK]
variable_md_stop_count: 0
# KAN-231: last commanded speed, so the fan is not judged on the pass where
# it was only just told to spin.
variable_md_prev_speed: 0.0
gcode:
    # Tacho check for a VARIABLE-SPEED fan (KAN-217).
    #
    # The previous test compared rpm against a fixed floor while this fan's
    # commanded speed varies, so a correctly spinning fan at low speed read
    # as stopped and FAN_STOPPAGE_ROUTINE paused the print and zeroed the
    # hot end.
    #
    # Stall arm only. One sample exists (speed 0.44 -> 6347 rpm) which is
    # not enough to fit a slope. Also currently commented out of
    # CHECK_ALL_FANS.
    {% set max_consecutive_stops = 3 %}
    # Curve is 44.9->0, 45->0.25, 70->0.6, 79.9->1.0, so the lowest speed this
    # fan is ever commanded IS 0.25 - this gate blinds nothing.
    {% set min_check_speed = 0.25|float %}

    {% set req_speed = printer['temperature_fan Motor_Drivers'].speed|default(0)|float %}
    {% set rpm       = printer['temperature_fan Motor_Drivers'].rpm|default(0)|float %}
    {% set stops     = printer["gcode_macro MD_FAN_CHECK"].md_stop_count|int %}

    # KAN-231: judge only a fan that has been commanded above its startup duty
    # for a FULL check interval. A DC fan needs roughly a quarter duty to break
    # stiction, and one that has only just been told to spin has not had time
    # to register a tacho pulse - both read as a stall and are not one. Same
    # defect as KAN-228 (CPU) and KAN-230 (PSU). Captured live at 45.3 C:
    #   fan 0.25 rpm 0  ->  fan 0.26 rpm 3403  ->  fan 0.27 rpm 3559
    {% set prev = printer["gcode_macro MD_FAN_CHECK"].md_prev_speed|float %}
    {% set judge = req_speed >= min_check_speed and prev >= min_check_speed %}
    {% set stalled = judge and rpm <= 0.0 %}
    {% set bad = stalled %}

    {% if bad %}
        # A macro renders in full before any command it emits runs, so the
        # counter has to be advanced in a local variable here. Re-reading
        # the gcode variable below would still see the pre-increment value.
        {% set nxt = stops + 1 %}
        SET_GCODE_VARIABLE MACRO=MD_FAN_CHECK VARIABLE=md_stop_count VALUE={nxt}
        M118 WARNING: Motor-drivers fan not turning ({nxt}/{max_consecutive_stops}) speed={req_speed|round(2)} rpm={rpm|round(0)}
        {% if nxt >= max_consecutive_stops %}
            FAN_STOPPAGE_ROUTINE FAN_NAME="Motor Drivers"
        {% endif %}
    {% elif stops > 0 %}
        SET_GCODE_VARIABLE MACRO=MD_FAN_CHECK VARIABLE=md_stop_count VALUE=0
    {% endif %}
    # Recorded every pass, so the next one can tell a fan that was already
    # running from one that has only just been commanded on.
    SET_GCODE_VARIABLE MACRO=MD_FAN_CHECK VARIABLE=md_prev_speed VALUE={req_speed}


[gcode_macro PSU_FAN_CHECK]
variable_ps_stop_count: 0
# KAN-230: last commanded speed, so the fan is not judged on the pass where
# it was only just told to spin.
variable_ps_prev_speed: 0.0
# Consecutive passes this fan has been commanded above min_check_speed. One
# pass of grace was not enough: measured on a real PRINT_START, this fan is
# commanded on at t+1 s and does not report a first tacho reading until t+6 s.
# CHECK_ALL_FANS runs every 3 s, so a 5 s dead window can span two checks and
# leaves almost no margin before the third trips FAN_STOPPAGE_ROUTINE.
variable_ps_warm: 0
gcode:
    # Tacho check for a VARIABLE-SPEED fan (KAN-217).
    #
    # The previous test compared rpm against a fixed floor while this fan's
    # commanded speed varies, so a correctly spinning fan at low speed read
    # as stopped and FAN_STOPPAGE_ROUTINE paused the print and zeroed the
    # hot end.
    #
    # Slope measured on the bench M1 2026-08-21 across 0.06-0.90 commanded
    # speed; lowest observed ratio was 8592 rpm at full scale, so half of
    # it leaves >2x margin at every measured point.
    {% set max_consecutive_stops = 3 %}
    {% set expected_rpm_at_full = 8600.0|float %}
    {% set min_ratio           = 0.5|float %}
    {% set min_check_speed     = 0.25|float %}
    # Passes at or above min_check_speed before the fan is judged at all.
    # 3 x 3 s = 9 s against a measured 5 s spin-up.
    {% set warmup_passes = 3 %}

    {% set req_speed = printer['power_fan Power_Supply'].speed|default(0)|float %}
    {% set rpm       = printer['power_fan Power_Supply'].rpm|default(0)|float %}
    {% set stops     = printer["gcode_macro PSU_FAN_CHECK"].ps_stop_count|int %}

    # KAN-230: judge the fan only when it has been commanded above its startup
    # duty for a FULL check interval. Two ways this used to misfire, both seen
    # on the bench:
    #
    #   speed 0.02-0.07 with rpm 0 counted as a stall and reached (3/3), which
    #   fires FAN_STOPPAGE_ROUTINE - pausing the print and zeroing the hot end.
    #   A DC fan needs roughly a quarter duty to break stiction, so it was being
    #   called dead for correctly obeying a command it cannot act on. The rate
    #   arm already had min_check_speed for this; the stall arm did not. The
    #   power_fan LUT makes that a normal region, not an edge case: 70 W -> 0.2.
    #
    #   a fan still accelerating reads under the rate threshold through no fault
    #   of its own - measured 990 rpm against a 1310 rpm threshold one interval
    #   after switch-on, then 4087 the next. So the rate arm additionally waits
    #   for a pass where the commanded speed has not just increased. That does
    #   mean a long continuous ramp is not rate-judged for a while; given this
    #   macro has a history of killing prints, that is the right side to err on,
    #   and the stall arm still covers a dead fan throughout.
    #
    # A genuinely dead fan still trips the stall arm at any speed at or above
    # min_check_speed, which is where the PSU actually needs cooling.
    {% set prev = printer["gcode_macro PSU_FAN_CHECK"].ps_prev_speed|float %}
    {% set warm = printer["gcode_macro PSU_FAN_CHECK"].ps_warm|int %}
    {% set judge = req_speed >= min_check_speed and warm >= warmup_passes %}
    # Commanded well above startup duty but the tacho reads nothing: a stall.
    {% set stalled = judge and rpm <= 0.0 %}
    # Steady or easing off, and turning too slowly for the commanded speed.
    {% set too_slow = judge
                      and req_speed <= prev
                      and rpm > 0.0
                      and rpm < req_speed * expected_rpm_at_full * min_ratio %}
    {% set bad = stalled or too_slow %}

    {% if bad %}
        # A macro renders in full before any command it emits runs, so the
        # counter has to be advanced in a local variable here. Re-reading
        # the gcode variable below would still see the pre-increment value.
        {% set nxt = stops + 1 %}
        SET_GCODE_VARIABLE MACRO=PSU_FAN_CHECK VARIABLE=ps_stop_count VALUE={nxt}
        M118 WARNING: PSU fan {"not turning" if stalled else "underspeed"} ({nxt}/{max_consecutive_stops}) speed={req_speed|round(2)} rpm={rpm|round(0)}
        {% if nxt >= max_consecutive_stops %}
            FAN_STOPPAGE_ROUTINE FAN_NAME="Power Supply"
        {% endif %}
    {% elif stops > 0 %}
        SET_GCODE_VARIABLE MACRO=PSU_FAN_CHECK VARIABLE=ps_stop_count VALUE=0
    {% endif %}
    # Recorded every pass, so the next one can tell a fan that was already
    # running from one that has only just been commanded on or sped up.
    SET_GCODE_VARIABLE MACRO=PSU_FAN_CHECK VARIABLE=ps_prev_speed VALUE={req_speed}
    # Count up while the fan is being asked to do real work; reset the moment
    # it drops below that, so every restart gets the full warm-up again.
    {% if req_speed >= min_check_speed %}
        SET_GCODE_VARIABLE MACRO=PSU_FAN_CHECK VARIABLE=ps_warm VALUE={warm + 1}
    {% else %}
        SET_GCODE_VARIABLE MACRO=PSU_FAN_CHECK VARIABLE=ps_warm VALUE=0
    {% endif %}



[gcode_macro CPU_FAN_CHECK]
variable_cpu_stop_count: 0
# KAN-228: last commanded speed, so a fan that has only just been switched on
# is not judged before its tacho can register a pulse.
variable_cpu_prev_speed: 0.0
gcode:
    # Tacho check for a VARIABLE-SPEED fan (KAN-217).
    #
    # The previous test compared rpm against a fixed floor while this fan's
    # commanded speed varies, so a correctly spinning fan at low speed read
    # as stopped and FAN_STOPPAGE_ROUTINE paused the print and zeroed the
    # hot end.
    #
    # Stall arm only: this fan was off during characterisation (CPU 60.9 C,
    # target 65) so its speed->rpm slope is unknown. A guessed rate
    # threshold here would just be the old bug with a different constant.
    # Detects a dead fan; add the rate arm once the curve is measured.
    {% set max_consecutive_stops = 3 %}

    {% set req_speed = printer['temperature_fan CPU'].speed|default(0)|float %}
    {% set rpm       = printer['temperature_fan CPU'].rpm|default(0)|float %}
    {% set stops     = printer["gcode_macro CPU_FAN_CHECK"].cpu_stop_count|int %}

    # Commanded to turn but the tacho reads nothing: a stall at any speed.
    # KAN-228: require the fan to have been commanded on for a FULL check
    # interval before believing a zero reading. This fan is on watermark
    # control and cycles around its 65 C target, so a check landing just after
    # it switches on sees speed>0 with the tacho still at 0 and cries wolf -
    # it logged (1/3) forever, never reaching 3. kick_start_time is 0.0 for
    # this fan, so there is no start boost helping it either.
    {% set prev = printer["gcode_macro CPU_FAN_CHECK"].cpu_prev_speed|float %}
    {% set stalled = req_speed > 0.0 and prev > 0.0 and rpm <= 0.0 %}
    {% set bad = stalled %}

    {% if bad %}
        # A macro renders in full before any command it emits runs, so the
        # counter has to be advanced in a local variable here. Re-reading
        # the gcode variable below would still see the pre-increment value.
        {% set nxt = stops + 1 %}
        SET_GCODE_VARIABLE MACRO=CPU_FAN_CHECK VARIABLE=cpu_stop_count VALUE={nxt}
        M118 WARNING: CPU fan not turning ({nxt}/{max_consecutive_stops}) speed={req_speed|round(2)} rpm={rpm|round(0)}
        {% if nxt >= max_consecutive_stops %}
            FAN_STOPPAGE_ROUTINE FAN_NAME="CPU"
        {% endif %}
    {% elif stops > 0 %}
        SET_GCODE_VARIABLE MACRO=CPU_FAN_CHECK VARIABLE=cpu_stop_count VALUE=0
    {% endif %}
    # Recorded every pass, so the next one knows whether the fan was already
    # running rather than only just commanded on.
    SET_GCODE_VARIABLE MACRO=CPU_FAN_CHECK VARIABLE=cpu_prev_speed VALUE={req_speed}

[delayed_gcode CHECK_ALL_FANS]
initial_duration: 1.
gcode:
    # KAN-231: both re-enabled. They were commented out because the shared
    # spin-up/startup-duty defect made them fire on healthy fans; that is
    # fixed in all four now. HOTEND_FAN_CHECK is safe to run even with its
    # tachometer dead (KAN-227) because its stall arm stays inert until the
    # tacho has proved it works, while its over-temperature arm needs no
    # tacho and gives the heatsink fan the first real monitoring it has had.
    # Reschedule FIRST, not last. delayed_gcode._gcode_timer_event swallows any
    # exception from the script - it only calls logging.exception - and then
    # re-arms ONLY if self.repeat was set during this invocation, which requires
    # reaching this command:
    #
    #     try:    self.gcode.run_script(self.timer_gcode.render())
    #     except: logging.exception("Script running error")
    #     nextwake = self.reactor.NEVER
    #     if self.repeat: nextwake = eventtime + self.duration
    #
    # As the LAST line, one exception in any of the four checks below silently
    # kills all four watchdogs permanently, until a klippy restart, with nothing
    # but a line in klippy.log. Every one of these macros reads printer objects
    # that can be missing or None during startup and toolhead reconnects, so
    # that is not hypothetical.
    #
    # The cadence is unaffected: nextwake is eventtime + duration, measured from
    # when the timer fired, not from where in the script this line sits.
    UPDATE_DELAYED_GCODE ID=CHECK_ALL_FANS DURATION=3

    HOTEND_FAN_CHECK
    CPU_FAN_CHECK
    MD_FAN_CHECK
    PSU_FAN_CHECK


#──────────────────────────────────────────────────────────────────────────────
# 8) FAN_STOPPAGE_ROUTINE (your existing routine, repeated verbatim):
#──────────────────────────────────────────────────────────────────────────────
[gcode_macro FAN_STOPPAGE_ROUTINE]
gcode:
    {% if printer.print_stats.state == "printing" %}
        {% set err_msg = params.FAN_NAME|default("unknown fan") + " Fan is not working. Your Print has been Paused." %}
    {% else %}
        {% set err_msg = params.FAN_NAME|default("unknown fan") + " Fan is not working." %}
    {% endif %}

    # If not already paused
    {% if printer['pause_resume'].is_paused|int == 0 %}
        M117 {params.FAN_NAME|default("unknown fan")} FAN ERROR
        M118 {params.FAN_NAME|default("unknown fan")} FAN ERROR. PAUSING...

        # Turn off the hotend.
        # !! Don't forget to turn your hotend back on before resume. !!
        # -- If using pause/resume macros, the hotend will automatically reheat on resume
        #
        # Only PAUSE an actual print. cmd_PAUSE sets is_paused = True with no
        # is-printing guard, and the only CLEAR_PAUSE in this whole config is
        # inside CANCEL_PRINT (print.cfg:322). So a fire while idle leaves a
        # stale is_paused = True that survives into the NEXT print, where two
        # things then go wrong at once: the guard above makes this entire
        # routine inert for ALL FOUR fans, and cmd_PAUSE early-returns "Print
        # already paused" so filament-runout pausing no-ops as well.
        #
        # One false positive on one fan must not silently strip the machine of
        # every fan watchdog. That is the same defect shape as KAN-217/228/230
        # /231, just one level further out.
        #
        # Zeroing the hot end stays unconditional - removing the heat is the
        # right response whether or not a print is running.
        {% if printer.print_stats.state == "printing" %}
            PAUSE
        {% endif %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0

        RESPOND TYPE=command MSG="action:prompt_begin Fan Error"
        RESPOND TYPE=command MSG="action:prompt_text {err_msg}"
        RESPOND TYPE=command MSG="action:prompt_show"


        #{action_emergency_stop("FAN MALFUNCTION")}
    {% endif %}
