
[gcode_macro M106]
description: Override M106 to skip if toolhead is disconnected
rename_existing: M106.1
gcode:
  {% set toolhead = printer['mcu toolhead'] %}
  {% set s = params.S|default(0)|int %}

  {% if toolhead.disconnected %}
    RESPOND MSG="Toolhead disconnected — ignoring M106"
    SET_GCODE_VARIABLE MACRO=TOOLHEAD_DISCONNECT VARIABLE=last_partfan_s VALUE={s}
    M106.1 S0
  {% else %}
    M106.1 {rawparams}
  {% endif %}
  


[gcode_macro HOTEND_FAN_CHECK]
variable_hotend_stop_count: 0
gcode:
    # Tacho check for a VARIABLE-SPEED fan (KAN-217).
    #
    # The previous test compared rpm against a fixed floor while this fan's
    # commanded speed varies, so a correctly spinning fan at low speed read
    # as stopped and FAN_STOPPAGE_ROUTINE paused the print and zeroed the
    # hot end.
    #
    # Stall arm only, same reason as CPU -- the heatsink fan was idle (35.9
    # C, target 65). This check is currently commented out of
    # CHECK_ALL_FANS; it is fixed here so re-enabling it does not
    # reintroduce the counter bug.
    {% set max_consecutive_stops = 3 %}

    {% set req_speed = printer['temperature_fan toolhead_heatsink'].speed|default(0)|float %}
    {% set rpm       = printer['temperature_fan toolhead_heatsink'].rpm|default(0)|float %}
    {% set stops     = printer["gcode_macro HOTEND_FAN_CHECK"].hotend_stop_count|int %}

    # Commanded to turn but the tacho reads nothing: a stall at any speed.
    {% set stalled = req_speed > 0.0 and rpm <= 0.0 %}
    {% set bad = stalled %}

    {% if bad %}
        # A macro renders in full before any command it emits runs, so the
        # counter has to be advanced in a local variable here. Re-reading
        # the gcode variable below would still see the pre-increment value.
        {% set nxt = stops + 1 %}
        SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=hotend_stop_count VALUE={nxt}
        M118 WARNING: Hotend fan not turning ({nxt}/{max_consecutive_stops}) speed={req_speed|round(2)} rpm={rpm|round(0)}
        {% if nxt >= max_consecutive_stops %}
            FAN_STOPPAGE_ROUTINE FAN_NAME="Hotend"
        {% endif %}
    {% elif stops > 0 %}
        SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=hotend_stop_count VALUE=0
    {% endif %}




[gcode_macro MD_FAN_CHECK]
variable_md_stop_count: 0
gcode:
    # Tacho check for a VARIABLE-SPEED fan (KAN-217).
    #
    # The previous test compared rpm against a fixed floor while this fan's
    # commanded speed varies, so a correctly spinning fan at low speed read
    # as stopped and FAN_STOPPAGE_ROUTINE paused the print and zeroed the
    # hot end.
    #
    # Stall arm only. One sample exists (speed 0.44 -> 6347 rpm) which is
    # not enough to fit a slope. Also currently commented out of
    # CHECK_ALL_FANS.
    {% set max_consecutive_stops = 3 %}

    {% set req_speed = printer['temperature_fan Motor_Drivers'].speed|default(0)|float %}
    {% set rpm       = printer['temperature_fan Motor_Drivers'].rpm|default(0)|float %}
    {% set stops     = printer["gcode_macro MD_FAN_CHECK"].md_stop_count|int %}

    # Commanded to turn but the tacho reads nothing: a stall at any speed.
    {% set stalled = req_speed > 0.0 and rpm <= 0.0 %}
    {% set bad = stalled %}

    {% if bad %}
        # A macro renders in full before any command it emits runs, so the
        # counter has to be advanced in a local variable here. Re-reading
        # the gcode variable below would still see the pre-increment value.
        {% set nxt = stops + 1 %}
        SET_GCODE_VARIABLE MACRO=MD_FAN_CHECK VARIABLE=md_stop_count VALUE={nxt}
        M118 WARNING: Motor-drivers fan not turning ({nxt}/{max_consecutive_stops}) speed={req_speed|round(2)} rpm={rpm|round(0)}
        {% if nxt >= max_consecutive_stops %}
            FAN_STOPPAGE_ROUTINE FAN_NAME="Motor Drivers"
        {% endif %}
    {% elif stops > 0 %}
        SET_GCODE_VARIABLE MACRO=MD_FAN_CHECK VARIABLE=md_stop_count VALUE=0
    {% endif %}


[gcode_macro PSU_FAN_CHECK]
variable_ps_stop_count: 0
gcode:
    # Tacho check for a VARIABLE-SPEED fan (KAN-217).
    #
    # The previous test compared rpm against a fixed floor while this fan's
    # commanded speed varies, so a correctly spinning fan at low speed read
    # as stopped and FAN_STOPPAGE_ROUTINE paused the print and zeroed the
    # hot end.
    #
    # Slope measured on the bench M1 2026-08-21 across 0.06-0.90 commanded
    # speed; lowest observed ratio was 8592 rpm at full scale, so half of
    # it leaves >2x margin at every measured point.
    {% set max_consecutive_stops = 3 %}
    {% set expected_rpm_at_full = 8600.0|float %}
    {% set min_ratio           = 0.5|float %}
    {% set min_check_speed     = 0.25|float %}

    {% set req_speed = printer['power_fan Power_Supply'].speed|default(0)|float %}
    {% set rpm       = printer['power_fan Power_Supply'].rpm|default(0)|float %}
    {% set stops     = printer["gcode_macro PSU_FAN_CHECK"].ps_stop_count|int %}

    # Commanded to turn but the tacho reads nothing: a stall at any speed.
    {% set stalled = req_speed > 0.0 and rpm <= 0.0 %}
    # Fast enough to judge on rate, and turning too slowly for it.
    {% set too_slow = req_speed >= min_check_speed
                      and rpm > 0.0
                      and rpm < req_speed * expected_rpm_at_full * min_ratio %}
    {% set bad = stalled or too_slow %}

    {% if bad %}
        # A macro renders in full before any command it emits runs, so the
        # counter has to be advanced in a local variable here. Re-reading
        # the gcode variable below would still see the pre-increment value.
        {% set nxt = stops + 1 %}
        SET_GCODE_VARIABLE MACRO=PSU_FAN_CHECK VARIABLE=ps_stop_count VALUE={nxt}
        M118 WARNING: PSU fan {"not turning" if stalled else "underspeed"} ({nxt}/{max_consecutive_stops}) speed={req_speed|round(2)} rpm={rpm|round(0)}
        {% if nxt >= max_consecutive_stops %}
            FAN_STOPPAGE_ROUTINE FAN_NAME="Power Supply"
        {% endif %}
    {% elif stops > 0 %}
        SET_GCODE_VARIABLE MACRO=PSU_FAN_CHECK VARIABLE=ps_stop_count VALUE=0
    {% endif %}



[gcode_macro CPU_FAN_CHECK]
variable_cpu_stop_count: 0
# KAN-228: last commanded speed, so a fan that has only just been switched on
# is not judged before its tacho can register a pulse.
variable_cpu_prev_speed: 0.0
gcode:
    # Tacho check for a VARIABLE-SPEED fan (KAN-217).
    #
    # The previous test compared rpm against a fixed floor while this fan's
    # commanded speed varies, so a correctly spinning fan at low speed read
    # as stopped and FAN_STOPPAGE_ROUTINE paused the print and zeroed the
    # hot end.
    #
    # Stall arm only: this fan was off during characterisation (CPU 60.9 C,
    # target 65) so its speed->rpm slope is unknown. A guessed rate
    # threshold here would just be the old bug with a different constant.
    # Detects a dead fan; add the rate arm once the curve is measured.
    {% set max_consecutive_stops = 3 %}

    {% set req_speed = printer['temperature_fan CPU'].speed|default(0)|float %}
    {% set rpm       = printer['temperature_fan CPU'].rpm|default(0)|float %}
    {% set stops     = printer["gcode_macro CPU_FAN_CHECK"].cpu_stop_count|int %}

    # Commanded to turn but the tacho reads nothing: a stall at any speed.
    # KAN-228: require the fan to have been commanded on for a FULL check
    # interval before believing a zero reading. This fan is on watermark
    # control and cycles around its 65 C target, so a check landing just after
    # it switches on sees speed>0 with the tacho still at 0 and cries wolf -
    # it logged (1/3) forever, never reaching 3. kick_start_time is 0.0 for
    # this fan, so there is no start boost helping it either.
    {% set prev = printer["gcode_macro CPU_FAN_CHECK"].cpu_prev_speed|float %}
    {% set stalled = req_speed > 0.0 and prev > 0.0 and rpm <= 0.0 %}
    {% set bad = stalled %}

    {% if bad %}
        # A macro renders in full before any command it emits runs, so the
        # counter has to be advanced in a local variable here. Re-reading
        # the gcode variable below would still see the pre-increment value.
        {% set nxt = stops + 1 %}
        SET_GCODE_VARIABLE MACRO=CPU_FAN_CHECK VARIABLE=cpu_stop_count VALUE={nxt}
        M118 WARNING: CPU fan not turning ({nxt}/{max_consecutive_stops}) speed={req_speed|round(2)} rpm={rpm|round(0)}
        {% if nxt >= max_consecutive_stops %}
            FAN_STOPPAGE_ROUTINE FAN_NAME="CPU"
        {% endif %}
    {% elif stops > 0 %}
        SET_GCODE_VARIABLE MACRO=CPU_FAN_CHECK VARIABLE=cpu_stop_count VALUE=0
    {% endif %}
    # Recorded every pass, so the next one knows whether the fan was already
    # running rather than only just commanded on.
    SET_GCODE_VARIABLE MACRO=CPU_FAN_CHECK VARIABLE=cpu_prev_speed VALUE={req_speed}

[delayed_gcode CHECK_ALL_FANS]
initial_duration: 1.
gcode:
    # HOTEND_FAN_CHECK #todo temp disable
    CPU_FAN_CHECK
    # MD_FAN_CHECK #todo temp disable
    PSU_FAN_CHECK
    # Reschedule ourselves in 3 seconds
    UPDATE_DELAYED_GCODE ID=CHECK_ALL_FANS DURATION=3


#──────────────────────────────────────────────────────────────────────────────
# 8) FAN_STOPPAGE_ROUTINE (your existing routine, repeated verbatim):
#──────────────────────────────────────────────────────────────────────────────
[gcode_macro FAN_STOPPAGE_ROUTINE]
gcode:
    {% if printer.print_stats.state == "printing" %}
        {% set err_msg = params.FAN_NAME|default("unknown fan") + " Fan is not working. Your Print has been Paused." %}
    {% else %}
        {% set err_msg = params.FAN_NAME|default("unknown fan") + " Fan is not working." %}
    {% endif %}

    # If not already paused
    {% if printer['pause_resume'].is_paused|int == 0 %}
        M117 {params.FAN_NAME|default("unknown fan")} FAN ERROR
        M118 {params.FAN_NAME|default("unknown fan")} FAN ERROR. PAUSING...

        # Turn off the hotend. 
        # !! Don't forget to turn your hotend back on before resume. !!
        # -- If using pause/resume macros, the hotend will automatically reheat on resume
        PAUSE
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0

        RESPOND TYPE=command MSG="action:prompt_begin Fan Error"
        RESPOND TYPE=command MSG="action:prompt_text {err_msg}"
        RESPOND TYPE=command MSG="action:prompt_show"


        #{action_emergency_stop("FAN MALFUNCTION")}
    {% endif %}
