#####################################################################
#   User-selectable LED modes (KAN-480, per-strip + saturation KAN-4899).
#   LED_MODE stores a mode + colour set for each strip (Left, Right),
#   persists them in [save_variables] as muon_led_left / muon_led_right,
#   and the two parametrized led_effects below render them. 'status'
#   hands control back to the state macros in led.cfg.
#
#   LED_MODE [STRIP=left|right|both] [MODE=..] [H=..] [H2=..] [BRIGHT=..]
#            [SPEED=..] [SAT=0..100]
#   STRIP defaults to both, SAT to 100 (SAT=0 is white at BRIGHT). An
#   old caller sending no STRIP or SAT behaves as before, on both strips.
#   A value left out keeps that strip's own current value. A bad value
#   raises an error before anything changes. Numbers outside their range
#   are clamped, as they always were.
#
#   For Control / the panel to read (printer["gcode_macro LED_MODE"]):
#     variable_left, variable_right: dicts with keys
#         mode, h, h2, bright, speed, sat
#     variable_sat (and mode, h, h2, bright, speed): the legacy flat
#         values. They mirror the left strip, which is the both-strips
#         value whenever the two agree.
#   variable_sat, variable_left and variable_right exist from boot, so
#   their presence tells a client that SAT and STRIP are supported.
#
#   A mode is the idle look only: LED_READY shows it. Chosen while a
#   print is running or paused, it is saved and waits for the print's
#   next LED_READY, or the return after LED_COMPLETE or a failed print.
#   The error, warning, info, progress and complete effects (led.cfg)
#   cover both strips and REPLACE whatever shares their LEDs. They never
#   touch left/right, so the user's choice returns afterwards.
#
#   The valid modes are written out in LED_MODE and _LED_MODE_RESTORE,
#   not kept in a variable_, so SET_GCODE_VARIABLE can't widen them.
#   Keep the two lists the same; scripts/test_m1_led_modes.py checks.
#####################################################################

[gcode_macro LED_MODE]
variable_mode: 'status'
variable_h: 0
variable_h2: 180
variable_bright: 60
variable_speed: 50
variable_sat: 100
variable_left: {'mode': 'status', 'h': 0, 'h2': 180, 'bright': 60, 'speed': 50, 'sat': 100}
variable_right: {'mode': 'status', 'h': 0, 'h2': 180, 'bright': 60, 'speed': 50, 'sat': 100}
# Seconds the 'complete' glow (after a print) or the warning (after a
# failed one) shows before a user mode returns. With 'status' they
# stay, as they always have.
variable_complete_hold: 300
gcode:
    {% set m = printer["gcode_macro LED_MODE"] %}
    {% set strip = params.STRIP|default('both')|string|lower %}
    {% if strip not in ['left', 'right', 'both'] %}
        {action_raise_error("LED_MODE: STRIP must be left, right or both, not '%s'" % params.STRIP)}
    {% endif %}
    {% if 'MODE' in params and params.MODE|string|lower not in ['solid', 'gradient', 'rainbow', 'breathe', 'chase', 'status', 'off'] %}
        {action_raise_error("LED_MODE: unknown MODE '%s'" % params.MODE)}
    {% endif %}
    {% for k in ['H', 'H2', 'BRIGHT', 'SPEED', 'SAT'] %}
        {% if k in params %}
            {% set v = params[k]|float(none) %}
            {% if v is none or v != v or v|abs > 1000000 %}
                {action_raise_error("LED_MODE: %s must be a number, not '%s'" % (k, params[k]))}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% for s in (['left', 'right'] if strip == 'both' else [strip]) %}
        {% set cur = m[s] %}
        {% set mode = params.MODE|default(cur.mode)|string|lower %}
        {% set h = params.H|default(cur.h)|float % 360 %}
        {% set h2 = params.H2|default(cur.h2)|float % 360 %}
        {% set bright = [[params.BRIGHT|default(cur.bright)|float, 100]|min, 0]|max %}
        {% set speed = [[params.SPEED|default(cur.speed)|float, 100]|min, 5]|max %}
        {% set sat = [[params.SAT|default(cur.sat)|float, 100]|min, 0]|max %}
        {% set d = "{'mode':'%s','h':%s,'h2':%s,'bright':%s,'speed':%s,'sat':%s}" % (mode, h, h2, bright, speed, sat) %}
        SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE={s} VALUE="{d}"
        {% if s == 'left' %}
            SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=mode VALUE="'{mode}'"
            SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=h VALUE={h}
            SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=h2 VALUE={h2}
            SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=bright VALUE={bright}
            SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=speed VALUE={speed}
            SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=sat VALUE={sat}
        {% endif %}
        # Single-quoted JSON: shlex keeps the inner double quotes, so
        # ast.literal_eval stores a dict, not a string.
        {% set json = '{"mode":"%s","h":%s,"h2":%s,"bright":%s,"speed":%s,"sat":%s}' % (mode, h, h2, bright, speed, sat) %}
        SAVE_VARIABLE VARIABLE=muon_led_{s} VALUE='{json}'
    {% endfor %}
    _LED_MODE_SHOW STRIPS={strip}

# Show the mode now if the LEDs are idle: on 'ready', or on the glow a
# finished print left. Someone choosing a mode (LED_MODE) also counts
# as idle whenever no print is running or paused, whatever laststate an
# unload, a prompt or a failed print left behind; macros can't tell an
# open prompt from a dismissed one, and the person is looking at it.
# The boot restore passes AUTO=1 and doesn't: an open filament prompt's
# info glow wins over it (TOOLHEAD_CONNECT opens one on every boot).
# Otherwise the mode is already saved, and shows at the next LED_READY.
# STRIPS names the strips just changed. Only those are touched when the
# idle look is already lit; any other state renders both strips.
[gcode_macro _LED_MODE_SHOW]
gcode:
    {% set state = printer["gcode_macro LED_TIMEOUT_STATE"].laststate|string %}
    {% set job = printer.print_stats.state|string if 'print_stats' in printer else 'standby' %}
    {% set chosen = params.AUTO|default(0)|int == 0 %}
    {% set strips = params.STRIPS|default('both')|string|lower %}
    {% set litlist = [] %}
    {% for e in ['ready', 'muon_mode_left', 'muon_mode_right', 'muon_status_left', 'muon_status_right'] %}
        {% if ('led_effect ' ~ e) in printer and printer['led_effect ' ~ e].enabled %}
            {% set _ = litlist.append(e) %}
        {% endif %}
    {% endfor %}
    {% if state in ['LED_READY', 'LED_COMPLETE'] or (chosen and job not in ['printing', 'paused']) %}
        {% if state == 'LED_READY' and litlist and strips in ['left', 'right'] %}
            LED_READY STRIPS={strips}
        {% else %}
            LED_READY
        {% endif %}
    {% else %}
        {action_respond_info("LED_MODE: saved; shown when the print's lights return to ready")}
    {% endif %}

# Called by LED_COMPLETE, and by _LED_MODE_AFTER_ERROR after its
# warning. Arms the return to a user mode, or disarms it for 'status',
# and when the LED timeout will have turned the LEDs off first (M=0, or
# fewer minutes than complete_hold). Nothing here may raise on a print's
# way out: hold is clamped at 0 (a negative DURATION is an error), and 0
# means no return.
[gcode_macro _LED_MODE_AFTER_COMPLETE]
gcode:
    {% set m = printer["gcode_macro LED_MODE"] %}
    {% set minutes = printer["gcode_macro LED_TIMEOUT_STATE"].minutes|float %}
    {% set hold = [m.complete_hold|float, 0]|max %}
    {% set user = m.left.mode|string|lower != 'status' or m.right.mode|string|lower != 'status' %}
    {% set arm = hold > 0 and user and (minutes < 0 or minutes * 60 > hold) %}
    UPDATE_DELAYED_GCODE ID=_LED_MODE_COMPLETE_DONE DURATION={hold if arm else 0}

# Called by _ON_PRINT_ERROR, after the heaters are off, when a line of a
# print file raises (PRINT_START's homing, a heat wait, the mesh, or
# later). A failed print never reaches PRINT_END. In a user mode (any,
# whenever it was chosen) the warning (amber) shows for complete_hold,
# then the mode returns; amber, not the red error effect, which klippy
# itself shows on a shutdown. 'status' keeps what the print left lit.
[gcode_macro _LED_MODE_AFTER_ERROR]
gcode:
    {% set m = printer["gcode_macro LED_MODE"] %}
    {% if m.left.mode|string|lower != 'status' or m.right.mode|string|lower != 'status' %}
        LED_WARNING
        _LED_MODE_AFTER_COMPLETE
    {% endif %}

# Only if nothing has replaced the glow or the warning since, such as a
# new print or a filament prompt.
[delayed_gcode _LED_MODE_COMPLETE_DONE]
gcode:
    {% if printer["gcode_macro LED_TIMEOUT_STATE"].laststate|string in ['LED_COMPLETE', 'LED_WARNING'] %}
        LED_READY
    {% endif %}

# Renders the modes. LED_READY calls it unless both strips are 'status'
# (then 'ready' is LED_READY's own effect). STRIPS=left|right renders
# only that strip, unless 'ready' is lit (then the other strip needs its
# own status effect, since 'ready' covers both).
[gcode_macro _LED_MODE_APPLY]
gcode:
    {% set m = printer["gcode_macro LED_MODE"] %}
    {% set strips = params.STRIPS|default('both')|string|lower %}
    {% if 'led_effect ready' in printer and printer['led_effect ready'].enabled %}
        {% set strips = 'both' %}
    {% endif %}
    {% set todo = ['left', 'right'] if strips == 'both' else [strips] %}
    {% set offs = [] %}
    {% for s in todo %}
        {% if m[s].mode|string|lower == 'off' %}
            {% set _ = offs.append(s) %}
        {% endif %}
    {% endfor %}
    {% if offs|length == 2 %}
        STOP_LED_EFFECTS FADETIME=0.25
    {% else %}
        # HSL(h, 85%, 55%) -> RGB, blended toward white by (100 - sat)%,
        # scaled by bright, once per call. At sat 100 it is the old colour.
        {% macro hsl_rgb(hue, bright, sat) %}
            {% set hf = (hue|float % 360) / 60.0 %}
            {% set s = 0.85 %}
            {% set l = 0.55 %}
            {% set t = sat|float / 100.0 %}
            {% set c = (1 - (2 * l - 1)|abs) * s %}
            {% set x = c * (1 - ((hf % 2) - 1)|abs) %}
            {% set lp = l - c / 2 %}
            {% if hf < 1 %}{% set rgb = [c, x, 0] %}
            {% elif hf < 2 %}{% set rgb = [x, c, 0] %}
            {% elif hf < 3 %}{% set rgb = [0, c, x] %}
            {% elif hf < 4 %}{% set rgb = [0, x, c] %}
            {% elif hf < 5 %}{% set rgb = [x, 0, c] %}
            {% else %}{% set rgb = [c, 0, x] %}{% endif %}
            { ((rgb[0] + lp) * t + (1 - t)) * bright / 100 },{ ((rgb[1] + lp) * t + (1 - t)) * bright / 100 },{ ((rgb[2] + lp) * t + (1 - t)) * bright / 100 }
        {% endmacro %}
        {% for s in todo %}
            {% set st = m[s] %}
            {% set mode = st.mode|string|lower %}
            {% if mode == 'status' %}
                SET_LED_EFFECT EFFECT=muon_status_{s} REPLACE=1 FADETIME=0.25
            {% elif mode != 'off' %}
                {% set r, g, b = hsl_rgb(st.h, st.bright, st.sat).split(',')|map('float') %}
                {% set r2, g2, b2 = hsl_rgb(st.h2, st.bright, st.sat).split(',')|map('float') %}
                SET_LED_EFFECT EFFECT=muon_mode_{s} REPLACE=1 FADETIME=0.25 MODE={mode} R={r} G={g} B={b} R2={r2} G2={g2} B2={b2} SPEED={st.speed} BRIGHT={st.bright} SAT={st.sat}
            {% endif %}
        {% endfor %}
        {% for s in offs %}
            SET_LED_EFFECT EFFECT=muon_mode_{s} STOP=1 FADETIME=0.25
            SET_LED_EFFECT EFFECT=muon_status_{s} STOP=1 FADETIME=0.25
        {% endfor %}
    {% endif %}

# Render the user mode, one effect per strip. 'layers' is a template on
# SET_LED_EFFECT's params; only evaluated once per LED_MODE call, not per
# frame. muon_mode_left and muon_mode_right must stay identical but for
# their leds; scripts/test_m1_led_modes.py checks.
[led_effect muon_mode_left]
autostart:              false
frame_rate:             24
recalculate:            True
smooth_transitions:     true
leds:
    neopixel:Left
layers:
    {% set mode = params.MODE|default('solid')|string|lower %}
    {% set speed = params.SPEED|default(50)|float %}
    {% set c1 = '(%s,%s,%s)' % (params.R|default(0), params.G|default(0), params.B|default(0)) %}
    {% set c2 = '(%s,%s,%s)' % (params.R2|default(0), params.G2|default(0), params.B2|default(0)) %}
    {% if mode == 'solid' %}
    static 1 0 add {c1}
    {% elif mode == 'gradient' %}
    static 1 0 add {c1},{c2}
    {% elif mode == 'rainbow' %}
    {% set rate = 0.05 + speed / 100.0 * 0.45 %}
    {% set k = params.BRIGHT|default(60)|float / 100.0 %}
    {% set t = params.SAT|default(100)|float / 100.0 %}
    {% set pal = [[1.0, 0.07, 0.07], [1.0, 0.65, 0.07], [0.07, 1.0, 0.07], [0.07, 0.65, 1.0], [0.07, 0.07, 1.0], [0.65, 0.07, 1.0]] %}
    gradient {rate} 1.0 add {% for c in pal %}({k * (c[0] * t + (1 - t))},{k * (c[1] * t + (1 - t))},{k * (c[2] * t + (1 - t))}){% if not loop.last %},{% endif %}{% endfor %}
    {% elif mode == 'breathe' %}
    {% set period = (105 - speed) / 20.0 %}
    breathing {period} 0 add {c1}
    {% elif mode == 'chase' %}
    {% set rate = 0.2 + speed / 100.0 * 3.0 %}
    chase {rate} 0.35 add {c1},{c2}
    {% endif %}
    static 1 1 top (0,0,0)

[led_effect muon_mode_right]
autostart:              false
frame_rate:             24
recalculate:            True
smooth_transitions:     true
leds:
    neopixel:Right
layers:
    {% set mode = params.MODE|default('solid')|string|lower %}
    {% set speed = params.SPEED|default(50)|float %}
    {% set c1 = '(%s,%s,%s)' % (params.R|default(0), params.G|default(0), params.B|default(0)) %}
    {% set c2 = '(%s,%s,%s)' % (params.R2|default(0), params.G2|default(0), params.B2|default(0)) %}
    {% if mode == 'solid' %}
    static 1 0 add {c1}
    {% elif mode == 'gradient' %}
    static 1 0 add {c1},{c2}
    {% elif mode == 'rainbow' %}
    {% set rate = 0.05 + speed / 100.0 * 0.45 %}
    {% set k = params.BRIGHT|default(60)|float / 100.0 %}
    {% set t = params.SAT|default(100)|float / 100.0 %}
    {% set pal = [[1.0, 0.07, 0.07], [1.0, 0.65, 0.07], [0.07, 1.0, 0.07], [0.07, 0.65, 1.0], [0.07, 0.07, 1.0], [0.65, 0.07, 1.0]] %}
    gradient {rate} 1.0 add {% for c in pal %}({k * (c[0] * t + (1 - t))},{k * (c[1] * t + (1 - t))},{k * (c[2] * t + (1 - t))}){% if not loop.last %},{% endif %}{% endfor %}
    {% elif mode == 'breathe' %}
    {% set period = (105 - speed) / 20.0 %}
    breathing {period} 0 add {c1}
    {% elif mode == 'chase' %}
    {% set rate = 0.2 + speed / 100.0 * 3.0 %}
    chase {rate} 0.35 add {c1},{c2}
    {% endif %}
    static 1 1 top (0,0,0)

# The 'ready' look for one strip, for when the other strip shows a user
# mode ('ready' itself covers both). Same layers as 'ready' in led.cfg.
[led_effect muon_status_left]
autostart:              false
frame_rate:             24
smooth_transitions:     true
leds:
    neopixel:Left
layers:
    breathing 10 1 add (0.2, 0.15, 0.1)
    static    1  1 top (0.4, 0.3, 0.2)

[led_effect muon_status_right]
autostart:              false
frame_rate:             24
smooth_transitions:     true
leds:
    neopixel:Right
layers:
    breathing 10 1 add (0.2, 0.15, 0.1)
    static    1  1 top (0.4, 0.3, 0.2)

# Re-apply the user's modes after a restart. It sets both strips but
# doesn't replace an open filament prompt's info glow (AUTO=1): the
# toolhead reconnects at about the same time and opens one. Each strip
# reads muon_led_<strip>, else the old single muon_led (before KAN-4899);
# a strip that only had muon_led is written to its own key, once, so the
# next boot reads the new keys. muon_led itself is left alone.
[delayed_gcode _LED_MODE_RESTORE]
initial_duration: 2
gcode:
    {% set sv = printer.save_variables.variables if 'save_variables' in printer else {} %}
    {% set found = [] %}
    {% for s in ['left', 'right'] %}
        {% set own = ('muon_led_' ~ s) in sv %}
        {% set saved = sv['muon_led_' ~ s] if own else (sv.muon_led if 'muon_led' in sv else none) %}
        {% if saved %}
            # A hand-edited or older file: an unknown mode is 'status', and
            # a missing number keeps the default.
            {% set _ = found.append(s) %}
            {% set cur = printer["gcode_macro LED_MODE"][s] %}
            {% set mode = saved.mode|default('status')|string|lower %}
            {% set mode = mode if mode in ['solid', 'gradient', 'rainbow', 'breathe', 'chase', 'status', 'off'] else 'status' %}
            {% set h = saved.h|default(cur.h)|float %}
            {% set h2 = saved.h2|default(cur.h2)|float %}
            {% set bright = [[saved.bright|default(cur.bright)|float, 100]|min, 0]|max %}
            {% set speed = [[saved.speed|default(cur.speed)|float, 100]|min, 5]|max %}
            {% set sat = [[saved.sat|default(cur.sat)|float, 100]|min, 0]|max %}
            {% set d = "{'mode':'%s','h':%s,'h2':%s,'bright':%s,'speed':%s,'sat':%s}" % (mode, h, h2, bright, speed, sat) %}
            SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE={s} VALUE="{d}"
            {% if s == 'left' %}
                SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=mode VALUE="'{mode}'"
                SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=h VALUE={h}
                SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=h2 VALUE={h2}
                SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=bright VALUE={bright}
                SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=speed VALUE={speed}
                SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=sat VALUE={sat}
            {% endif %}
            {% if not own %}
                {% set json = '{"mode":"%s","h":%s,"h2":%s,"bright":%s,"speed":%s,"sat":%s}' % (mode, h, h2, bright, speed, sat) %}
                SAVE_VARIABLE VARIABLE=muon_led_{s} VALUE='{json}'
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if found %}
        _LED_MODE_SHOW AUTO=1
    {% endif %}
