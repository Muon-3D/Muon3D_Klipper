
#####################################################################
#   User-selectable LED modes (KAN-480). LED_MODE stores a mode +
#   colour set, persists it in [save_variables] as muon_led, and the
#   single parametrized led_effect below renders it. 'status' hands
#   control back to the state macros in led.cfg.
#
#   A mode is the idle look only: LED_READY shows it. Chosen while a
#   print is running or paused, it is saved and waits for the print's
#   next LED_READY, or the return after LED_COMPLETE or a failed print.
#
#   The valid modes are written out in LED_MODE and _LED_MODE_RESTORE,
#   not kept in a variable_, so SET_GCODE_VARIABLE can't widen them.
#   Keep the two lists the same; scripts/test_m1_led_modes.py checks.
#####################################################################

[gcode_macro LED_MODE]
variable_mode: 'status'
variable_h: 0
variable_h2: 180
variable_bright: 60
variable_speed: 50
# Seconds the 'complete' glow (after a print) or the warning (after a
# failed one) shows before a user mode returns. With 'status' they
# stay, as they always have.
variable_complete_hold: 300
gcode:
    {% set m = printer["gcode_macro LED_MODE"] %}
    {% set mode = params.MODE|default(m.mode)|string|lower %}
    {% if mode not in ['solid', 'gradient', 'rainbow', 'breathe', 'chase', 'status', 'off'] %}
        {action_respond_info("LED_MODE: unknown MODE '%s'" % mode)}
    {% else %}
        {% set h = params.H|default(m.h)|float % 360 %}
        {% set h2 = params.H2|default(m.h2)|float % 360 %}
        {% set bright = [[params.BRIGHT|default(m.bright)|float, 100]|min, 0]|max %}
        {% set speed = [[params.SPEED|default(m.speed)|float, 100]|min, 5]|max %}
        SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=mode VALUE="'{mode}'"
        SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=h VALUE={h}
        SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=h2 VALUE={h2}
        SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=bright VALUE={bright}
        SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=speed VALUE={speed}
        {% set json = '{"mode":"%s","h":%s,"h2":%s,"bright":%s,"speed":%s}' % (mode, h, h2, bright, speed) %}
        # Single-quoted JSON: shlex keeps the inner double quotes, so
        # ast.literal_eval stores a dict, not a string.
        SAVE_VARIABLE VARIABLE=muon_led VALUE='{json}'
        _LED_MODE_SHOW
    {% endif %}

# Show the mode now if the LEDs are idle: on 'ready', or on the glow a
# finished print left. Someone choosing a mode (LED_MODE) also counts
# as idle whenever no print is running or paused, whatever laststate an
# unload, a prompt or a failed print left behind; macros can't tell an
# open prompt from a dismissed one, and the person is looking at it.
# The boot restore passes AUTO=1 and doesn't: an open filament prompt's
# info glow wins over it (TOOLHEAD_CONNECT opens one on every boot).
# Otherwise the mode is already saved, and shows at the next LED_READY.
[gcode_macro _LED_MODE_SHOW]
gcode:
    {% set state = printer["gcode_macro LED_TIMEOUT_STATE"].laststate|string %}
    {% set job = printer.print_stats.state|string if 'print_stats' in printer else 'standby' %}
    {% set chosen = params.AUTO|default(0)|int == 0 %}
    {% if state in ['LED_READY', 'LED_COMPLETE'] or (chosen and job not in ['printing', 'paused']) %}
        LED_READY
    {% else %}
        {action_respond_info("LED_MODE: saved; shown when the print's lights return to ready")}
    {% endif %}

# Called by LED_COMPLETE, and by _LED_MODE_AFTER_ERROR after its
# warning. Arms the return to a user mode, or disarms it for 'status',
# and when the LED timeout will have turned the LEDs off first (M=0, or
# fewer minutes than complete_hold). Nothing here may raise on a print's
# way out: hold is clamped at 0 (a negative DURATION is an error), and 0
# means no return.
[gcode_macro _LED_MODE_AFTER_COMPLETE]
gcode:
    {% set m = printer["gcode_macro LED_MODE"] %}
    {% set minutes = printer["gcode_macro LED_TIMEOUT_STATE"].minutes|float %}
    {% set hold = [m.complete_hold|float, 0]|max %}
    {% set arm = hold > 0 and m.mode|string|lower != 'status' and (minutes < 0 or minutes * 60 > hold) %}
    UPDATE_DELAYED_GCODE ID=_LED_MODE_COMPLETE_DONE DURATION={hold if arm else 0}

# Called by _ON_PRINT_ERROR, after the heaters are off, when a line of a
# print file raises (PRINT_START's homing, a heat wait, the mesh, or
# later). A failed print never reaches PRINT_END. In a user mode (any,
# whenever it was chosen) the warning (amber) shows for complete_hold,
# then the mode returns; amber, not the red error effect, which klippy
# itself shows on a shutdown. 'status' keeps what the print left lit.
[gcode_macro _LED_MODE_AFTER_ERROR]
gcode:
    {% if printer["gcode_macro LED_MODE"].mode|string|lower != 'status' %}
        LED_WARNING
        _LED_MODE_AFTER_COMPLETE
    {% endif %}

# Only if nothing has replaced the glow or the warning since, such as a
# new print or a filament prompt.
[delayed_gcode _LED_MODE_COMPLETE_DONE]
gcode:
    {% if printer["gcode_macro LED_TIMEOUT_STATE"].laststate|string in ['LED_COMPLETE', 'LED_WARNING'] %}
        LED_READY
    {% endif %}

# Renders the mode. LED_READY calls it only for a mode other than
# 'status'; 'status' is LED_READY's own 'ready' effect.
[gcode_macro _LED_MODE_APPLY]
gcode:
    {% set m = printer["gcode_macro LED_MODE"] %}
    {% set mode = m.mode|string|lower %}
    {% if mode == 'off' %}
        STOP_LED_EFFECTS FADETIME=0.25
    {% else %}
        # HSL(h, 85%, 55%) -> RGB scaled by bright, once per call.
        {% macro hsl_rgb(hue, bright) %}
            {% set hf = (hue|float % 360) / 60.0 %}
            {% set s = 0.85 %}
            {% set l = 0.55 %}
            {% set c = (1 - (2 * l - 1)|abs) * s %}
            {% set x = c * (1 - ((hf % 2) - 1)|abs) %}
            {% set lp = l - c / 2 %}
            {% if hf < 1 %}{% set rgb = [c, x, 0] %}
            {% elif hf < 2 %}{% set rgb = [x, c, 0] %}
            {% elif hf < 3 %}{% set rgb = [0, c, x] %}
            {% elif hf < 4 %}{% set rgb = [0, x, c] %}
            {% elif hf < 5 %}{% set rgb = [x, 0, c] %}
            {% else %}{% set rgb = [c, 0, x] %}{% endif %}
            { (rgb[0] + lp) * bright / 100 },{ (rgb[1] + lp) * bright / 100 },{ (rgb[2] + lp) * bright / 100 }
        {% endmacro %}
        {% set r, g, b = hsl_rgb(m.h, m.bright).split(',')|map('float') %}
        {% set r2, g2, b2 = hsl_rgb(m.h2, m.bright).split(',')|map('float') %}
        SET_LED_EFFECT EFFECT=muon_mode REPLACE=1 FADETIME=0.25 MODE={mode} R={r} G={g} B={b} R2={r2} G2={g2} B2={b2} SPEED={m.speed} BRIGHT={m.bright}
    {% endif %}

# Render the user mode. 'layers' is a template on SET_LED_EFFECT's
# params; only evaluated once per LED_MODE call, not per frame.
[led_effect muon_mode]
autostart:              false
frame_rate:             24
recalculate:            True
smooth_transitions:     true
leds:
    neopixel:Left
    neopixel:Right
layers:
    {% set mode = params.MODE|default('solid')|string|lower %}
    {% set speed = params.SPEED|default(50)|float %}
    {% set c1 = '(%s,%s,%s)' % (params.R|default(0), params.G|default(0), params.B|default(0)) %}
    {% set c2 = '(%s,%s,%s)' % (params.R2|default(0), params.G2|default(0), params.B2|default(0)) %}
    {% if mode == 'solid' %}
    static 1 0 add {c1}
    {% elif mode == 'gradient' %}
    static 1 0 add {c1},{c2}
    {% elif mode == 'rainbow' %}
    {% set rate = 0.05 + speed / 100.0 * 0.45 %}
    {% set k = params.BRIGHT|default(60)|float / 100.0 %}
    gradient {rate} 1.0 add ({1.0*k},{0.07*k},{0.07*k}),({1.0*k},{0.65*k},{0.07*k}),({0.07*k},{1.0*k},{0.07*k}),({0.07*k},{0.65*k},{1.0*k}),({0.07*k},{0.07*k},{1.0*k}),({0.65*k},{0.07*k},{1.0*k})
    {% elif mode == 'breathe' %}
    {% set period = (105 - speed) / 20.0 %}
    breathing {period} 0 add {c1}
    {% elif mode == 'chase' %}
    {% set rate = 0.2 + speed / 100.0 * 3.0 %}
    chase {rate} 0.35 add {c1},{c2}
    {% endif %}
    static 1 1 top (0,0,0)

# Re-apply the user's mode after a restart. No re-save. It sets the mode
# but doesn't replace an open filament prompt's info glow (AUTO=1): the
# toolhead reconnects at about the same time and opens one.
[delayed_gcode _LED_MODE_RESTORE]
initial_duration: 2
gcode:
    {% set saved = printer.save_variables.variables.muon_led if 'save_variables' in printer else none %}
    {% if saved %}
        # A hand-edited or older file: an unknown mode is 'status', and a
        # missing number keeps the default.
        {% set m = printer["gcode_macro LED_MODE"] %}
        {% set mode = saved.mode|default('status')|string|lower %}
        {% set mode = mode if mode in ['solid', 'gradient', 'rainbow', 'breathe', 'chase', 'status', 'off'] else 'status' %}
        SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=mode VALUE="'{mode}'"
        SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=h VALUE={saved.h|default(m.h)|float}
        SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=h2 VALUE={saved.h2|default(m.h2)|float}
        SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=bright VALUE={saved.bright|default(m.bright)|float}
        SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=speed VALUE={saved.speed|default(m.speed)|float}
        _LED_MODE_SHOW AUTO=1
    {% endif %}
