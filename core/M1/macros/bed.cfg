#####################################################################
#   Minimal Bed Removed / Attached Macros (no state variable)
#####################################################################

[gcode_macro BED_PROMPT_CLOSE]
description: Close any open UI prompt
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro BED_REMOVED]
description: Pause + show message if bed detached during a print
gcode:

  # KAN-272: bed_removal_detector decides, when it sees the plate go, whether
  # a file was printing (print_stats "printing", virtual_sdcard reading it,
  # and PRINT_END not yet begun), and sends the pause half of pause_resume
  # only then. This used to also accept idle_timeout "Printing", which any
  # toolhead motion sets: on walnut on 2026-10-01 startup gcode made an idle,
  # unhomed machine "Printing", this PAUSEd it, and the pause stood through
  # the next print.
  #
  # This renders later, behind the gcode mutex, so the print may have moved
  # on since that decision. Two checks against what is true now:
  #   * the decision only counts while that print still stands ("paused",
  #     which the detector's own pause has normally made it, or "printing").
  #     A cancel that got the mutex first has ended it, and pausing then
  #     would leave a pause standing on an idle machine.
  #   * a file that is being read now, outside PRINT_END, is printing,
  #     whatever was decided. The plate can come off during RESUME's hot-end
  #     reheat wait, while the print reads "paused" and the detector rightly
  #     sends nothing; RESUME then restarts the file onto no plate. PAUSE
  #     here stops it: RESUME has cleared pause_command_sent, so cmd_PAUSE's
  #     send_pause_command pauses the file again.
  {% set detector = printer.bed_removal_detector %}
  {% set ps_state = printer.print_stats.state|default("")|lower %}
  {% set file_active = ('virtual_sdcard' in printer)
                       and printer.virtual_sdcard.is_active %}
  {% set is_printing = (detector.removedWhilePrinting
                        and ps_state in ("printing", "paused"))
                       or (file_active and not detector.printEnding) %}
  # Read from pause_resume the same way BED_ATTACHED does. This was never
  # assigned here, and Klipper builds its Jinja environment with the default
  # Undefined, so `not is_paused` evaluated true rather than raising -- the
  # missing definition stayed invisible because the line it guarded was
  # commented out anyway. (The |default(False) is for a false-y value, not for
  # a missing [pause_resume]: attribute access on an Undefined raises before
  # the filter runs. [pause_resume] is mandatory here regardless, since PAUSE
  # is renamed to PAUSE_BASE.)
  {% set is_paused = printer.pause_resume.is_paused|default(False) %}

  { action_respond_info("BED REMOVED") }

  # The mesh currently applied is left alone so a paused print can resume
  # without a Z step; every print probes its own mesh anyway.

  # No prompt_end here any more. m1_machine owns the pause prompt: it lists
  # what a resume needs, plate included, and offers Resume only once the
  # list is empty, so a second removal turns it back into the list. Ending
  # whatever prompt was up closed a runout or fan-fault prompt too (F20).

  {% if is_printing %}
    {% if not is_paused %}
      # Pulling the plate mid-print used to turn the bed heater off and let the
      # toolhead carry on extruding into open air, while the prompt above told
      # the operator the print was paused. PAUSE is what makes that text true.
      # bed_removal_detector has already sent the pause half of
      # pause_resume, so this completes a pause rather than starting one.
      # cmd_PAUSE calls send_pause_command itself (a no-op once sent), so the
      # ordering holds either way. Ordered
      # before the prompt on purpose: if it raises, the operator gets no
      # prompt rather than a prompt that lies. m1_machine shows the prompt
      # for the plate_removed reason.
      PAUSE REASON=plate_removed
    {% else %}
      MACHINE_PAUSED REASON=plate_removed
    {% endif %}

    M117 BED DETACHED - PAUSED
  {% endif %}

  # KAN-569: last, so that an LED macro that raises can't stop the pause.
  LED_CONNECTED



[gcode_macro BED_ATTACHED]
description: The plate is back
gcode:

  LED_CONNECTED

  { action_respond_info("BED ATTACHED") }

  # Nothing else. A paused print's prompt is m1_machine's: it ticks the
  # plate off its resume checklist and offers Resume once nothing else is
  # missing. This used to replace whatever prompt was up with its own.


[gcode_macro _BED_RESUME_NOW]
description: (kept for interfaces that call it) resume the print
# RESUME now reheats the bed itself, after its gate has checked the plate
# and the bed power path (_RESUME_RESTORE_BED in print.cfg).
gcode:
  RESUME


[gcode_macro _Z_POWER_LOST]
description: (z_power) the bed feed was held off by Z_POWER_INHIBIT
gcode:
  {% set zp = printer.z_power %}
  { action_respond_info("Bed power off: " ~ zp.reason) }
  {% if printer.print_stats.state|default("")|lower == "printing" %}
    # m1_machine shows the prompt for this reason.
    PAUSE REASON=bed_power_lost
  {% endif %}


[gcode_macro _Z_POWER_FAULT]
description: (z_power) the bed feed latched off on a fault
gcode:
  {% set zp = printer.z_power %}
  LED_ERROR
  {% if printer.print_stats.state|default("")|lower == "printing" %}
    PAUSE REASON=bed_power_fault
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_begin Bed power fault"
  RESPOND TYPE=command MSG="action:prompt_text {zp.fault}. Bed power stays off until Z_POWER_RESET."
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|BED_PROMPT_CLOSE|primary"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _Z_COLUMN_CHANGED]
description: (z_power) the Z column changed state: pause, cancel, or forget Z
gcode:
  # Harry, 2026-10-17: unlocking the lever does not move Z, and relocking
  # returns it to where it was, but the axis is loose while unlocked, so a
  # print pauses and needs no re-home. A column pulled right off loses the
  # Z position, so a print is cancelled and Z is no longer homed.
  {% set to = printer.z_power.z|default("unknown") %}
  {% set job = printer.print_stats.state|default("")|lower %}
  {% if to == "absent" %}
    {% if job in ("printing", "paused") %}
      # Not CANCEL_PRINT: its PRINT_END lifts Z and drives to the cutter,
      # and there is no column to move. Stop the file, heaters and fan only.
      _PRINT_START_PHASE_CLEAR
      CANCEL_PRINT_BASE
      CLEAR_PAUSE
      TURN_OFF_HEATERS
      M107
      LED_ERROR
      RESPOND TYPE=command MSG="action:prompt_end"
      RESPOND TYPE=command MSG="action:prompt_begin Print cancelled"
      RESPOND TYPE=command MSG="action:prompt_text The Z column was removed during the print, so the Z position is lost."
      RESPOND TYPE=command MSG="action:prompt_footer_button Close|BED_PROMPT_CLOSE|primary"
      RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}
    SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
    { action_respond_info("Z column removed: Z is no longer homed") }
  {% elif to in ("unlocked", "unknown") %}
    {% if job == "printing" %}
      # No Z lift in this pause (PAUSE skips it for this reason), and
      # m1_machine shows the prompt, with Resume once the lever is locked.
      PAUSE REASON=column_unlocked
    {% else %}
      { action_respond_info("Z column " ~ to) }
    {% endif %}
  {% else %}
    { action_respond_info("Z column locked") }
  {% endif %}
