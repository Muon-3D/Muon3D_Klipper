#####################################################################
#   Minimal Bed Removed / Attached Macros (no state variable)
#####################################################################

[gcode_macro BED_PROMPT_CLOSE]
description: Close any open UI prompt
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro BED_REMOVED]
description: Pause + show message if bed detached during a print
gcode:

  LED_CONNECTED

  {% set is_printing = (printer.idle_timeout.state == "Printing")
                    or (printer.print_stats.state|default("")|lower == "printing") %}
  # Read from pause_resume the same way BED_ATTACHED does. This was never
  # assigned here, and Klipper builds its Jinja environment with the default
  # Undefined, so `not is_paused` evaluated true rather than raising -- the
  # missing definition stayed invisible because the line it guarded was
  # commented out anyway. (The |default(False) is for a false-y value, not for
  # a missing [pause_resume]: attribute access on an Undefined raises before
  # the filter runs. [pause_resume] is mandatory here regardless, since PAUSE
  # is renamed to PAUSE_BASE.)
  {% set is_paused = printer.pause_resume.is_paused|default(False) %}

  { action_respond_info("BED REMOVED") }

  # The mesh currently applied is left alone so a paused print can resume
  # without a Z step; every print probes its own mesh anyway.

  # Outside the is_printing guard on purpose. Whatever prompt is up describes
  # a plate that is now off, and the one BED_ATTACHED puts up offers Resume as
  # its only button. Leaving that on screen after a second removal is how the
  # operator gets to resume onto a plate that is not there -- and this runs in
  # exactly the case the guard below excludes, since a print paused by the
  # first removal reads as "paused", not "printing".
  RESPOND TYPE=command MSG="action:prompt_end"

  {% if is_printing %}
    {% if not is_paused %}
      # Pulling the plate mid-print used to turn the bed heater off and let the
      # toolhead carry on extruding into open air, while the prompt above told
      # the operator the print was paused. PAUSE is what makes that text true.
      # bed_removal_detector has normally sent the pause half of pause_resume
      # already, so this completes a pause rather than starting one -- but not
      # always: it sends that only on idle_timeout, while this macro also
      # treats print_stats "printing" as printing. cmd_PAUSE calls
      # send_pause_command itself, so either way the ordering holds. Ordered
      # before the prompt on purpose: if it raises, the operator gets no
      # prompt rather than a prompt that lies.
      PAUSE
    {% endif %}

    RESPOND TYPE=command MSG="action:prompt_begin Bed Detached"
    RESPOND TYPE=command MSG="action:prompt_text Bed detached during printing. Print is paused. Reattach the bed to resume."
    # RESPOND TYPE=command MSG="action:prompt_footer_button Close|BED_PROMPT_CLOSE|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

    M117 BED DETACHED - PAUSED
  {% endif %}



[gcode_macro BED_ATTACHED]
description: If paused, ask user if they want to resume
gcode:

  LED_CONNECTED

  {% set is_paused = printer.pause_resume.is_paused|default(False) %}

  { action_respond_info("BED ATTACHED") }

  # Gated on pause_resume alone, which is what RESUME itself checks. It used
  # to also require print_stats.state == "paused", but that only becomes
  # "paused" for a virtual_sdcard print -- PAUSE sets pause_resume.is_paused
  # unconditionally. On any other print the two disagreed, and since
  # BED_REMOVED now really does pause, that left the operator with a paused
  # print, a modal prompt whose Close button is commented out, and no Resume
  # control.
  {% if is_paused %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Bed Reattached"
    RESPOND TYPE=command MSG="action:prompt_text Bed has been reattached. Would you like to resume the print?"
        # RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|BED_PROMPT_CLOSE|error"
    RESPOND TYPE=command MSG="action:prompt_footer_button Resume Print|_BED_RESUME_NOW|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

    M117 BED ATTACHED - RESUME?
  {% else %}
    # Nothing to resume, so take the "Bed Detached" prompt down rather than
    # leaving it on screen with no control on it.
    RESPOND TYPE=command MSG="action:prompt_end"
  {% endif %}


[gcode_macro _BED_RESUME_NOW]
description: (called by UI) close prompt, reheat the bed, and resume
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"

  {% set detector = printer.bed_removal_detector %}
  {% if detector.bedRemoved %}
    # The plate came off again between this prompt going up and the button
    # being pressed. Everything below assumes a plate: the M190 would drive a
    # heater whose thermistor is reading ambient, so it would never arrive and
    # would sit on the gcode mutex until verify_heater shut the printer down.
    # Same guard, and same spelling, as HOMING_GATE in homing.cfg.
    M117 REATTACH BED
  {% else %}
    # bed_removal_detector set the bed to 0 when the plate came off and
    # nothing else puts it back, so resuming here used to continue the print
    # onto a cold plate -- on ABS or PETG, the warping the operator
    # reattached the bed to avoid. M190 rather than M140: the first layer
    # after the resume should not go down until the plate is actually back at
    # temperature.
    # The plate being back is not the bed being powered: z_power needs its
    # own fresh samples and PGOOD before the bed may heat. Wait for it, then
    # decide in a second macro -- a macro renders before it runs, so the
    # check has to come after the wait.
    Z_POWER_WAIT TIMEOUT=2
    _BED_RESUME_FINISH
  {% endif %}


[gcode_macro _Z_POWER_LOST]
description: (z_power) the bed feed was held off by Z_POWER_INHIBIT
gcode:
  {% set zp = printer.z_power %}
  { action_respond_info("Bed power off: " ~ zp.reason) }
  {% if printer.print_stats.state|default("")|lower == "printing" %}
    PAUSE
    RESPOND TYPE=command MSG="action:prompt_begin Bed power off"
    RESPOND TYPE=command MSG="action:prompt_text {zp.reason}. The print is paused."
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|BED_PROMPT_CLOSE|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}


[gcode_macro _Z_POWER_FAULT]
description: (z_power) the bed feed latched off on a fault
gcode:
  {% set zp = printer.z_power %}
  LED_ERROR
  {% if printer.print_stats.state|default("")|lower == "printing" %}
    PAUSE
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_begin Bed power fault"
  RESPOND TYPE=command MSG="action:prompt_text {zp.fault}. Bed power stays off until Z_POWER_RESET."
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|BED_PROMPT_CLOSE|primary"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _BED_RESUME_FINISH]
description: (called by _BED_RESUME_NOW) reheat the bed once its power is up, then resume
gcode:
  {% set restore = printer.bed_removal_detector.restoreTarget|float %}
  {% set zp = printer.z_power %}
  {% if restore > 0 and zp.state != "ready" %}
    RESPOND TYPE=command MSG="action:prompt_begin Bed power not ready"
    RESPOND TYPE=command MSG="action:prompt_text {zp.reason[0]|upper ~ zp.reason[1:]}. The print stays paused."
    RESPOND TYPE=command MSG="action:prompt_footer_button Resume Print|_BED_RESUME_NOW|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    # M190 rather than M140: the first layer after the resume should not go
    # down until the plate is back at temperature.
    {% if restore > 0 %}
      M117 REHEATING BED
      M190 S{restore}
    {% endif %}
    RESUME
  {% endif %}


[gcode_macro _Z_POWER_REQUIRE]
description: (PRINT_START) wait for a starting bed feed, then require it
gcode:
  # Three steps because a macro renders before it runs: the prompt has to
  # read the state after the wait, and the abort has to come after the
  # prompt has been sent.
  Z_POWER_WAIT TIMEOUT=2
  _Z_POWER_REQUIRE_PROMPT
  Z_POWER_REQUIRE MSG="Cannot start the print"


[gcode_macro _Z_POWER_REQUIRE_PROMPT]
description: (PRINT_START) say why the print cannot start
gcode:
  {% set zp = printer.z_power %}
  {% if zp.state != "ready" %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Cannot start the print"
    RESPOND TYPE=command MSG="action:prompt_text {zp.reason[0]|upper ~ zp.reason[1:]}."
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|BED_PROMPT_CLOSE|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}


[gcode_macro _Z_COLUMN_CHANGED]
description: (z_power) the Z column changed state: pause, cancel, or forget Z
gcode:
  # Harry, 2026-10-17: unlocking the lever does not move Z, and relocking
  # returns it to where it was, but the axis is loose while unlocked, so a
  # print pauses and needs no re-home. A column pulled right off loses the
  # Z position, so a print is cancelled and Z is no longer homed.
  {% set to = printer.z_power.z|default("unknown") %}
  {% set job = printer.print_stats.state|default("")|lower %}
  {% if to == "absent" %}
    {% if job in ("printing", "paused") %}
      # Not CANCEL_PRINT: its PRINT_END lifts Z and drives to the cutter,
      # and there is no column to move. Stop the file, heaters and fan only.
      _PRINT_START_PHASE_CLEAR
      CANCEL_PRINT_BASE
      CLEAR_PAUSE
      TURN_OFF_HEATERS
      M107
      LED_ERROR
      RESPOND TYPE=command MSG="action:prompt_end"
      RESPOND TYPE=command MSG="action:prompt_begin Print cancelled"
      RESPOND TYPE=command MSG="action:prompt_text The Z column was removed during the print, so the Z position is lost."
      RESPOND TYPE=command MSG="action:prompt_footer_button Close|BED_PROMPT_CLOSE|primary"
      RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}
    SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
    { action_respond_info("Z column removed: Z is no longer homed") }
  {% elif to in ("unlocked", "unknown") %}
    {% if job == "printing" %}
      PAUSE
      RESPOND TYPE=command MSG="action:prompt_end"
      RESPOND TYPE=command MSG="action:prompt_begin Print paused"
      RESPOND TYPE=command MSG="action:prompt_text The Z column lever was unlocked. Push the locking lever down, then resume."
      RESPOND TYPE=command MSG="action:prompt_footer_button Resume|RESUME|primary"
      RESPOND TYPE=command MSG="action:prompt_footer_button Close|BED_PROMPT_CLOSE"
      RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
      { action_respond_info("Z column " ~ to) }
    {% endif %}
  {% else %}
    { action_respond_info("Z column locked") }
  {% endif %}
