# PRINT_START phase timing marks (KAN-201).
#
# _PT_MARK emits one line per phase boundary. The host-side collector in MuonOS
# (recipes/startup_timing) subscribes to gcode/subscribe_output over Klipper's
# API socket and timestamps each line on arrival, which is how the phase table
# gets built. Nothing here measures time itself - Klipper macros have no wall
# clock - so the marks only have to arrive in the right order.
#
# Two things about gcode_macro that this design depends on, both easy to get
# wrong:
#
# 1. A macro renders its ENTIRE template before running any of the g-code it
#    produces, so {action_respond_info(...)} fires at render time. Marks written
#    inline in PRINT_START would therefore all fire at once, before any motion.
#    That is why a mark is a separate macro invoked as a command: its own
#    template renders when the command is dispatched, which is the moment we
#    want.
#
# 2. For the same reason, M400 belongs BEFORE the _PT_MARK line in the caller,
#    never inside this macro - an M400 in here would run after the mark had
#    already been emitted. Precede a mark with M400 whenever the work it closes
#    was queued motion rather than a blocking command (G28, TEMPERATURE_WAIT,
#    M109/M190, BED_MESH_CALIBRATE and SHAPER_CALIBRATE all block on their own).

[gcode_macro _PT_MARK]
description: Emit one PRINT_START timing mark for the host collector. NAME=<phase>
variable_seq: 0
gcode:
    {% set name = params.NAME|default("unnamed") %}

    # "begin" restarts the sequence so an aborted run cannot bleed into the next.
    {% set seq = 0 if name == "begin" else printer["gcode_macro _PT_MARK"].seq|int %}

    # Guarded: KAN-161 is expected to change how FINETUNE_RESONANCE is gated, and
    # a timing mark must never be the thing that breaks a print. -1 means the
    # macro was not found rather than "has not run".
    {% if "gcode_macro FINETUNE_RESONANCE" in printer %}
        {% set shaper = printer["gcode_macro FINETUNE_RESONANCE"].has_run|default(-1)|int %}
    {% else %}
        {% set shaper = -1 %}
    {% endif %}

    # Temperatures ride along on every mark so heat-up phases can be read as
    # rates rather than just durations, and so two runs can be compared knowing
    # what they started from.
    {% set state = " bed_temp=" ~ printer.heater_bed.temperature|round(1) ~
                   " bed_target=" ~ printer.heater_bed.target|round(1) ~
                   " ext_temp=" ~ printer.extruder.temperature|round(1) ~
                   " ext_target=" ~ printer.extruder.target|round(1) ~
                   " shaper_has_run=" ~ shaper %}

    {action_respond_info("PRINT_TIMING v1 seq=" ~ seq ~ " mark=" ~ name ~ state)}
    SET_GCODE_VARIABLE MACRO=_PT_MARK VARIABLE=seq VALUE={seq + 1}
