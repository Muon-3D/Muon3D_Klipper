[gcode_macro TOOLHEAD_CONNECT]
description: Called when toolhead is reconnected with the umbilical
gcode:
    # KAN-569: the hot end off first, before anything that could raise.
    M104 S0

    # A reconnect can be a different toolhead or nozzle. The macro also runs
    # during startup, when this is an idempotent reset of the session flag.
    SET_GCODE_VARIABLE MACRO=FINETUNE_RESONANCE VARIABLE=swept_this_session VALUE=0

    LED_CONNECTED
    # Ignore unlock-button edges while the toolhead GPIOs settle after reconnect.
    SET_GCODE_VARIABLE MACRO=TOOLHEAD_UMBILICAL_UNLOCK_STATE VARIABLE=armed VALUE=0
    UPDATE_DELAYED_GCODE ID=TOOLHEAD_UMBILICAL_UNLOCK_ARM DURATION=1.0

    {% set last = printer["gcode_macro TOOLHEAD_DISCONNECT"].last_partfan_s|int %}
    {% if last > 0 %}
        M106 S{last}
    {% endif  %}

    # The unlock press retracts filament, and this is the only thing that
    # re-feeds it on reattach. The decision waits for TOOLHEAD_CONNECT_LOAD
    # (KAN-558): the switch's first reading after a reconnect has to arrive
    # first, and moves queued in the first moment after a reconnect shut
    # Klipper down on boxwood on 2026-10-14.
    UPDATE_DELAYED_GCODE ID=TOOLHEAD_CONNECT_LOAD DURATION=0.1


[delayed_gcode TOOLHEAD_CONNECT_LOAD]
gcode:
    # Re-feed after a reattach, but only if the toolhead is still connected
    # and its switch reads filament now.
    {% set toolhead_ok = not printer['mcu toolhead'].non_critical_disconnected|default(True) %}
    {% set sensor = printer["filament_switch_sensor filament_sensor_toolhead"] %}
    {% if toolhead_ok %}
      {% if not sensor.sample_ready %}
        UPDATE_DELAYED_GCODE ID=TOOLHEAD_CONNECT_LOAD DURATION=0.1
      {% elif sensor.filament_detected %}
        LOAD_FILAMENT
      {% endif %}
    {% endif %}


[gcode_macro TOOLHEAD_DISCONNECT]
description: Called when toolhead is disconnected with the umbilical
variable_last_partfan_s: 0
gcode:
    # KAN-569: the hot end off first, before RESET_CALIBRATION's variable
    # writes and the fan, any of which could raise and end this macro.
    M104 S0
    # A press whose release is lost with the toolhead must not restore
    # anything when a later release arrives.
    _UNLOCK_FORGET
    SET_GCODE_VARIABLE MACRO=TOOLHEAD_UMBILICAL_UNLOCK_STATE VARIABLE=armed VALUE=0
    # Cancel a reattach load that has not started yet (KAN-558).
    UPDATE_DELAYED_GCODE ID=TOOLHEAD_CONNECT_LOAD DURATION=0

    # The toolhead carries the accelerometer and the nozzle that is the probe,
    # so treat any disconnect as a possible swap and drop both the stored
    # resonance calibration and the stored bed mesh record. This has to live
    # here and not in TOOLHEAD_CONNECT: the toolhead MCU is non critical and is
    # always deferred then reconnected at startup, so TOOLHEAD_CONNECT runs on
    # every Klipper restart while TOOLHEAD_DISCONNECT does not.
    RESET_CALIBRATION

    {% set cur = (printer.fan.speed * 255)|int %}
    SET_GCODE_VARIABLE MACRO=TOOLHEAD_DISCONNECT VARIABLE=last_partfan_s VALUE={cur}
    # Turn fan off. M106.1 rather than M106: the override in fan.cfg
    # zeroes last_partfan_s when the toolhead is disconnected, which is
    # exactly the value saved two lines up for TOOLHEAD_CONNECT.
    M106.1 S0

    # Optional: pause if printing
    {% if printer.print_stats.state == "printing" %}
        PAUSE
    {% endif %}
    # KAN-569: last, after the hot end is off and the print paused, so that
    # an LED macro that raises can't stop either.
    LED_CONNECTED

[gcode_macro TOOLHEAD_UMBILICAL_UNLOCK_STATE]
description: Internal arm state for unlock button filtering
variable_armed: 0
gcode:

[delayed_gcode TOOLHEAD_UMBILICAL_UNLOCK_ARM]
gcode:
    SET_GCODE_VARIABLE MACRO=TOOLHEAD_UMBILICAL_UNLOCK_STATE VARIABLE=armed VALUE=1


[gcode_macro TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_PRESSED]
description: Unlock press: retract, disable extruder stepper if enabled, turn off heater if heating
variable_e_was_enabled: 0
variable_saved_hotend_target: 0.0
variable_changed_hotend_target: 0
gcode:

    {% set armed = printer["gcode_macro TOOLHEAD_UMBILICAL_UNLOCK_STATE"].armed|int %}
    {% if armed == 0 %}
      # Ignore startup/noise edges; ensure release macro has no side effects.
      SET_GCODE_VARIABLE MACRO=TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_PRESSED VARIABLE=e_was_enabled VALUE=0
      SET_GCODE_VARIABLE MACRO=TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_PRESSED VARIABLE=changed_hotend_target VALUE=0
      {action_respond_info("Unlock press ignored: button not armed yet.")}
    {% else %}
      ; Choose which stepper to disable (default: extruder)
      {% set e_stepper = params.E_STEPPER|default("extruder") %}

      ; Save current hotend target and turn it off (only if it was heating).
      ; KAN-569: before the retract, so that a FORCE_MOVE that raises can't
      ; leave the hot end heating. The retract right after is still at
      ; temperature: the nozzle takes far longer to cool than the move.
      {% set tgt = printer.extruder.target|float %}
      SET_GCODE_VARIABLE MACRO=TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_PRESSED VARIABLE=saved_hotend_target VALUE={tgt}
      {% if tgt > 0 %}
        M104 S0
        SET_GCODE_VARIABLE MACRO=TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_PRESSED VARIABLE=changed_hotend_target VALUE=1
      {% else %}
        SET_GCODE_VARIABLE MACRO=TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_PRESSED VARIABLE=changed_hotend_target VALUE=0
      {% endif %}

    ; Retract to reduce load
    FORCE_MOVE STEPPER=extruder DISTANCE=-16 VELOCITY=20 ACCEL=1000

      ; Record whether extruder stepper was enabled, then disable it
      {% set e_enabled = 1 if printer.stepper_enable.steppers[e_stepper] else 0 %}
      SET_GCODE_VARIABLE MACRO=TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_PRESSED VARIABLE=e_was_enabled VALUE={e_enabled}
      {% if e_enabled == 1 %}
        SET_STEPPER_ENABLE STEPPER={e_stepper} ENABLE=0
      {% endif %}

      {action_respond_info("Unlock press: retract done; extruder stepper disabled if it was enabled; heater off if it was heating.")}
    {% endif %}
    # KAN-569: last, after the hot end is off, so that an LED macro that
    # raises can't leave it heating.
    LED_CONNECTED


[gcode_macro _UNLOCK_FORGET]
description: Forget what the unlock press changed, so no release restores it
# KAN-569. Run by the release after use, and by TOOLHEAD_DISCONNECT,
# FAN_STOPPAGE_ROUTINE and CANCEL_PRINT: a stall, a cancel or a pulled
# toolhead during the hold means the release must not restore heat. A
# release the toolhead took with it is never seen, and klippy's debounce
# then swallows the next press after reattach, so only its release fires.
gcode:
    SET_GCODE_VARIABLE MACRO=TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_PRESSED VARIABLE=e_was_enabled VALUE=0
    SET_GCODE_VARIABLE MACRO=TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_PRESSED VARIABLE=changed_hotend_target VALUE=0


[gcode_macro TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_RELEASED]
description: Unlock release: restore extruder stepper/heater only if we changed them
gcode:
    {% set e_stepper = params.E_STEPPER|default("extruder") %}
    {% set m = printer["gcode_macro TOOLHEAD_UMBILICAL_UNLOCK_BUTTON_PRESSED"] %}
    # KAN-569: no heat back while a hot-end fan fault stands.
    {% set latch = printer.hotend_fan_latch if 'hotend_fan_latch' in printer else none %}
    {% set fan = printer["gcode_macro HOTEND_FAN_CHECK"] if 'gcode_macro HOTEND_FAN_CHECK' in printer else none %}
    {% set fan_ok = (latch is none or latch.latched|int == 0) and (fan is none or (fan.hotend_stop_count|int < 3 and fan.sensor_bad_count|int < 3)) %}

    ; Restore extruder stepper only if we disabled it
    {% if m.e_was_enabled|int == 1 %}
      SET_STEPPER_ENABLE STEPPER={e_stepper} ENABLE=1
    {% endif %}

    ; Restore heater target only if we changed it
    {% if m.changed_hotend_target|int == 1 and fan_ok %}
      M104 S{m.saved_hotend_target|float}
    {% elif m.changed_hotend_target|int == 1 %}
      {action_respond_info("Unlock release: hot end NOT reheated - hot-end fan fault. Press Fan checked once the fan is checked.")}
    {% endif %}

    {action_respond_info("Unlock release: restored extruder stepper/heater where applicable.")}
    ; Once only: a second release, or a bounce, restores nothing.
    _UNLOCK_FORGET
