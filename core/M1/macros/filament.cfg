#####################################################################
#   Filament Macros with UI Prompts
#####################################################################

# ┌───────────────────────────────────────────────────────────────────┐
# │  1) UNLOAD FLOW                                                    │
# │     • M600_PROMPT: Ask user if they want to pause & unload.       │
# │     • M600_DO_UNLOAD: Closes prompt, pauses, and runs unload.     │
# │     • UNLOAD_FILAMENT: Actual unload sequence (as before).        │
# └───────────────────────────────────────────────────────────────────┘

[gcode_macro M600]
description: Prompt user to pause print and unload filament
gcode:
    PAUSE REASON=filament_change

    # 1) Open a dialog titled “Unload Filament”
    RESPOND TYPE=command MSG="action:prompt_begin Unload Filament"
    # 2) Ask for confirmation
    RESPOND TYPE=command MSG="action:prompt_text Do you want to pause the print and unload the filament?"
    # 3) Footer buttons: Unload (primary) / Cancel (error)
    RESPOND TYPE=command MSG="action:prompt_footer_button Unload|_DO_UNLOAD_M600|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_CANCEL_M600|error"
    # 4) Show the prompt
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _CANCEL_M600]
description: (called by M600) pause, notify, and unload filament
gcode:
    # 1) Close any open prompt
    RESPOND TYPE=command MSG="action:prompt_end"
    RESUME

[gcode_macro _DO_UNLOAD_M600]
description: (called by M600_PROMPT) pause, notify, and unload filament
gcode:
    # 1) Close any open prompt
    RESPOND TYPE=command MSG="action:prompt_end"
    # 2) Pause the print

    # 3) Inform the user
    RESPOND MSG="Unloading filament, reload before resuming"
    # 4) Run the actual unload routine
    UNLOAD_FILAMENT

    LOAD_FILAMENT_PROMPT


[gcode_macro UNLOAD_FILAMENT]
description: Unloads filament from toolhead. EXTRUDER_TEMP defaults to 210 if hotend is cold
gcode:
    # KAN-569: it heats to 250 C and waits, holding the gcode lock, so the
    # fan check could not cut it until it finished. Refused up front instead
    # while a hot-end fan fault stands.
    _HOTEND_FAN_GUARD WHAT=Unload
    {% set EXTRUDER_TEMP = params.TEMP|default(250)|int %}
    {% set MIN_TEMP = EXTRUDER_TEMP|float * 0.96 %}
    {% set CURRENT_TARGET = printer.extruder.target|float %}
    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT
    #G28 XY
    #G91                         ; relative positioning
    #G1 Z20                      ; move nozzle upwards
    #FRONT                       ; move the toolhead to the front

    {% if EXTRUDER_TEMP != 0 %}
        # LED_PENDING
        {% if CURRENT_TARGET < EXTRUDER_TEMP %}
            M104 S{EXTRUDER_TEMP} ; only heat up if the current extruder is not already hot
        {% endif %}
        TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={MIN_TEMP} ; wait for min extrude temp
    {% endif %}
    
    LED_PRINTING
    
    M83                         ; set extruder to relative mode
    G1 E10 F300                 ; extrude a little to soften tip
    G1 E-30 F3600               ; quickly retract a small amount to eliminate stringing
    G4 P200                     ; pause for a short amount of time
    G1 E-40 F1200              ; retract slowly the rest of the way
    M400                        ; wait for moves to finish
    M104 S{0}
    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT
    M300 P400                   ; long beep to indicate unload complete
    M117 Unload Complete!
    
    LED_INFO





[gcode_macro FILAMENT_INSERT_FLOW]
description: Attempt a sensorless filament load and branch on the result
gcode:
    FILAMENT_INSERT_SENSORLESS_LOAD

[gcode_macro FILAMENT_INSERT_SENSORLESS_LOAD]
description: Run a bounded sensorless grab move for filament loading
variable_load_current: 0.4
variable_load_distance: 50.0
variable_load_speed: 30.0
variable_load_accel: 200.0
gcode:
    {% set default_current = printer.configfile.settings['tmc2241 extruder'].run_current|float %}
    {% set load_current_value = params.CURRENT|default(load_current)|float %}
    {% set load_distance_value = params.DISTANCE|default(load_distance)|float %}
    {% set load_speed_value = params.SPEED|default(load_speed)|float %}
    {% set load_accel_value = params.ACCEL|default(load_accel)|float %}
    {% set restore_position = printer["extruder_homing sensorless_extruder"].position|float %}

    LED_INFO
    M117 Loading Filament
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Filament Load"
    RESPOND TYPE=command MSG="action:prompt_text Loading filament"
    RESPOND TYPE=command MSG="action:prompt_show"

    SET_TMC_CURRENT STEPPER=extruder CURRENT={load_current_value}
    M400
    EXTRUDER_HOMING_MOVE EXTRUDER=sensorless_extruder DISTANCE={load_distance_value} SPEED={load_speed_value} ACCEL={load_accel_value} STOP_ON_ENDSTOP=2 SET_POSITION={restore_position}
    M400
    SET_TMC_CURRENT STEPPER=extruder CURRENT={default_current}

    FILAMENT_INSERT_SENSORLESS_RESULT


[gcode_macro FILAMENT_INSERT_CANCEL]
description: Close insert flow prompt
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    M117 Load Canceled
    RESPOND MSG="Filament load canceled."

    LED_READY


[gcode_macro FILAMENT_INSERT_GRAB_MORE]
description: Retry the automatic sensorless filament load
gcode:
    FILAMENT_INSERT_SENSORLESS_LOAD {rawparams}


[gcode_macro FILAMENT_INSERT_SENSORLESS_RESULT]
description: Branch to the next filament prompt based on the last load result
gcode:
    {% set status = printer["extruder_homing sensorless_extruder"] %}
    {% if status.last_triggered %}
        FILAMENT_INSERT_MODE_PROMPT
    {% else %}
        FILAMENT_INSERT_LOAD_FAILED_PROMPT
    {% endif %}


[gcode_macro FILAMENT_INSERT_LOAD_FAILED_PROMPT]
description: Offer to retry the sensorless filament load or cancel
gcode:
    LED_INFO
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Filament Load Failed"
    RESPOND TYPE=command MSG="action:prompt_text Filament was not grabbed. Try loading again or cancel."
    RESPOND TYPE=command MSG="action:prompt_footer_button Try Load Again|FILAMENT_INSERT_SENSORLESS_LOAD|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|FILAMENT_INSERT_CANCEL|error"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro FILAMENT_INSERT_MODE_PROMPT]
description: Ask user to choose quick load or full purge
gcode:

    LED_INFO

    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Load Mode"
    RESPOND TYPE=command MSG="action:prompt_text Filament grabbed. Choose load method."
    # RESPOND TYPE=command MSG="action:prompt_footer_button Try Load Again|FILAMENT_INSERT_SENSORLESS_LOAD|info"
    RESPOND TYPE=command MSG="action:prompt_footer_button Quick Load|FILAMENT_INSERT_QUICK_LOAD|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Full Purge|FILAMENT_INSERT_FULL_PURGE_GATE|warning"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro FILAMENT_INSERT_QUICK_LOAD]
description: Finish insert flow without purge
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    M117 Quick Load Complete
    RESPOND MSG="Quick load complete."

    LED_READY


[gcode_macro FILAMENT_INSERT_FULL_PURGE_GATE]
description: Start full purge; wipe only when bed is attached
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    FILAMENT_INSERT_FULL_PURGE {rawparams}


[gcode_macro FILAMENT_INSERT_FULL_PURGE]
description: Heat, purge, and wipe after insert
gcode:
    # KAN-569: heats and waits, like UNLOAD_FILAMENT; refused up front while
    # a hot-end fan fault stands.
    _HOTEND_FAN_GUARD WHAT=Purge
    RESPOND TYPE=command MSG="action:prompt_end"

    {% set EXTRUDER_TEMP = params.TEMP|default(240)|int %}
    {% set MIN_TEMP = EXTRUDER_TEMP|float -5 %}
    {% set OOZE_START_TEMP = 170 %}
    {% set CURRENT_TARGET = printer.extruder.target|float %}
    #{% set bed_ok = not printer.bed_removal_detector.bedRemoved %}
    {% set bed_ok = false %} #TEMPORARY, NO NEED TO DO WIPE AFTER, EXCESSIVE
    {% set HA = printer.toolhead.homed_axes|default("") %}
    {% set z_temp_homed = False %}

    SAVE_GCODE_STATE NAME=FILAMENT_INSERT_FULL_PURGE

    {% if CURRENT_TARGET < EXTRUDER_TEMP %}
        M104 S{EXTRUDER_TEMP}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_begin Full Purge"
    RESPOND TYPE=command MSG="action:prompt_text Heating hotend."
    RESPOND TYPE=command MSG="action:prompt_show"

    {% if bed_ok %}
        {% if not ('x' in HA and 'y' in HA and 'z' in HA) %}
            G28
        {% endif %}
    {% else %}
        {% if not ('x' in HA and 'y' in HA) %}
            G28 X Y
        {% endif %}
        {% set HA = printer.toolhead.homed_axes|default("") %}
        {% set z_not_homed = not ('z' in HA) %}
        {% if z_not_homed %}
            SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
            {% set z_temp_homed = True %}
        {% endif %}
    {% endif %}

    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={OOZE_START_TEMP}
    # Raw M106.1: these speeds were tuned on the physical fan.
    M106.1 S75

    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={MIN_TEMP}
    RESPOND TYPE=command MSG="action:prompt_end"

    G90
    # KAN-226: derive the park from axis_maximum instead of hardcoding X200.
    # axis_maximum.x is 200.1, and auto_skew shifts X as a function of Z by
    # +0.0056*Z - 0.89 mm at full height. X200 then resolves past the limit
    # and the move dies with "Move out of range". Same defect as the homing
    # park; these two are the other instances of it.
    {% set _park_x = printer.toolhead.axis_maximum.x|float - 5.0 %}
    G1 X{_park_x} Y0 F7800
    M400

    M83
    M106.1 S150
    G4 P2000
    G1 E10 F400
    G1 E8 F1000
    M104 S0
    G1 E60 F600
    M400
    M106.1 S50
    G1 E-4 F1200
    M400

    {% if bed_ok %}
        NOZZLE_WIPE_SMART MODE=NOHEAT
    {% else %}
        RESPOND MSG="Bed not detected; skipping nozzle wipe."
    {% endif %}

    M107
    # KAN-226: derive the park from axis_maximum instead of hardcoding X200.
    # axis_maximum.x is 200.1, and auto_skew shifts X as a function of Z by
    # +0.0056*Z - 0.89 mm at full height. X200 then resolves past the limit
    # and the move dies with "Move out of range". Same defect as the homing
    # park; these two are the other instances of it.
    {% set _park_x = printer.toolhead.axis_maximum.x|float - 5.0 %}
    G1 X{_park_x} Y0 F7800

    {% if z_temp_homed %}
        SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
    {% endif %}

    Z_PARK
    M400



    RESTORE_GCODE_STATE NAME=FILAMENT_INSERT_FULL_PURGE
    M117 Full Purge Complete
    RESPOND MSG="Full purge complete."


    LED_READY


[gcode_macro LOAD_FILAMENT]
description: Backward-compatible alias for FILAMENT_INSERT_FLOW
gcode:
    FILAMENT_INSERT_FLOW {rawparams}

[gcode_macro LOAD_FILAMENT_PROMPT]
description: Backward-compatible alias for FILAMENT_INSERT_FLOW
gcode:
    FILAMENT_INSERT_FLOW {rawparams}

[gcode_macro _FILAMENT_GRAB_MORE]
description: Backward-compatible alias for FILAMENT_INSERT_GRAB_MORE
gcode:
    FILAMENT_INSERT_GRAB_MORE

[gcode_macro _LOAD_FILAMENT_MORE]
description: Backward-compatible alias for FILAMENT_INSERT_GRAB_MORE
gcode:
    FILAMENT_INSERT_GRAB_MORE

[gcode_macro _FILAMENT_LOAD_MODE_PROMPT]
description: Backward-compatible alias for FILAMENT_INSERT_MODE_PROMPT
gcode:
    FILAMENT_INSERT_MODE_PROMPT

[gcode_macro _FILAMENT_QUICK_LOAD]
description: Backward-compatible alias for FILAMENT_INSERT_QUICK_LOAD
gcode:
    FILAMENT_INSERT_QUICK_LOAD

[gcode_macro _FILAMENT_FULL_PURGE_GATE]
description: Backward-compatible alias for FILAMENT_INSERT_FULL_PURGE_GATE
gcode:
    FILAMENT_INSERT_FULL_PURGE_GATE {rawparams}

[gcode_macro _FILAMENT_FULL_PURGE]
description: Backward-compatible alias for FILAMENT_INSERT_FULL_PURGE
gcode:
    FILAMENT_INSERT_FULL_PURGE {rawparams}

[gcode_macro _LOAD_FILAMENT_EXTRUDE]
description: Backward-compatible alias for FILAMENT_INSERT_FULL_PURGE
gcode:
    FILAMENT_INSERT_FULL_PURGE {rawparams}

#Credit to Kalico for this
[gcode_macro _SET_MPC_MATERIAL]
description: Set heater MPC parameters for a given material
variable_filament_table:
    ## Update this table to adjust material settings
    {
        ## ( density, heat capacity )  # suggested heat capacity range
        "PLA"       : ( 1.25, 2.20 ),  # 1.80 - 2.20
        "PETG"      : ( 1.27, 2.20 ),  # 1.70 - 2.20
        "PC+ABS"    : ( 1.15, 2.20 ),  # 1.50 - 2.20
        "ABS"       : ( 1.06, 2.40 ),  # 1.25 - 2.40
        "ASA"       : ( 1.07, 2.10 ),  # 1.30 - 2.10
        "PA6"       : ( 1.12, 2.50 ),  # 2.00 - 2.50
        "PA"        : ( 1.15, 2.50 ),  # 2.00 - 2.50
        "PC"        : ( 1.20, 1.90 ),  # 1.10 - 1.90
        "TPU"       : ( 1.21, 2.00 ),  # 1.50 - 2.00
        "TPU-90A"   : ( 1.15, 2.00 ),  # 1.50 - 2.00
        "TPU-95A"   : ( 1.22, 2.00 ),  # 1.50 - 2.00
        "ABS-CF"    : ( 1.11, 2.40 ),  # 1.25 - 2.40
        "ASA-CF"    : ( 1.11, 2.10 ),  # 1.30 - 2.10
        "PA6-CF"    : ( 1.19, 2.50 ),  # 2.00 - 2.50
        "PC+ABS-CF" : ( 1.22, 2.20 ),  # 1.50 - 2.20
        "PC+CF"     : ( 1.36, 1.90 ),  # 1.10 - 1.90
        "PLA-CF"    : ( 1.29, 2.20 ),  # 1.80 - 2.20
        "PETG-CF"   : ( 1.30, 2.20 ),  # 1.70 - 2.20
    }
gcode:
    {% set material = params.MATERIAL | upper %}
    {% set heater = params.HEATER | default('extruder') %}
    {% set extruder_config = printer.configfile.settings[heater] %}

    {% if material in filament_table %}
        {% set (density, heat_capacity) = filament_table[material] %}

        RESPOND PREFIX=🔥 MSG="Configured {heater} MPC for {material}. Density: {density}, Heat Capacity: {heat_capacity}"
    {% else %}
        {% set density = extruder_config.filament_density %}
        {% set heat_capacity=extruder_config.filament_heat_capacity %}

        RESPOND PREFIX=🔥 MSG="Unknown material '{material}', using default mpc parameters for {heater}"
    {% endif %}

    MPC_SET HEATER={heater} FILAMENT_DENSITY={density} FILAMENT_HEAT_CAPACITY={heat_capacity}


[gcode_macro INSERT_FILAMENT_SENSOR]
description: Trigger insert flow when printer is idle or paused
gcode:
    {% set is_printing = (printer.idle_timeout.state == "Printing")
                    or (printer.print_stats.state|default("")|lower == "printing") %}
    {% set is_paused = printer.pause_resume.is_paused|default(False) %}

    {% if not is_printing or is_paused %}
        FILAMENT_INSERT_FLOW
    {% endif %}


# The filament cut. The cutter arm on the toolhead is worked by a nub on the
# Y belt tension block, at the Y min (back) end. The block moves a few mm when
# the belt is re-tensioned or serviced, so its position can't be trusted and
# the cut finds it first: a tap "home" towards Y min, at an X where the arm is
# clear of the nub. The nub's no-go zone is X 94.5 to 138.5 and up to 13 mm in
# front of the stop. Every Y of the cut is an offset from that measured stop,
# so the cut follows the block wherever it sits.
#
# Sequence (Harry, 2026-11-10, worked out on the B1):
#   1. at X stop_x, tap towards Y min to find the stop;
#   2. out to stop + clear_dy (15 mm), so the arm doesn't meet the nub from the wrong
#      side;
#   3. X to entry_x;
#   4. Y to stop + entry_dy;
#   5. the cut: motor current up, then slowly to X cut_x, Y stop + cut_dy;
#   6. the arm back: it has no spring, so at the normal current X goes back
#      to reset_x at twice the cut speed, at the same Y;
#   7. away in Y, to Y approach_y;
# then the usual end-of-cut park (PARK_PRINTER). B1 has no cutter sensor, so
# the cut is open loop.
#
# Before 2026-11-10 the tap towards Y min ran at X116, inside the nub's zone,
# so it stopped on whichever it touched first and the Y it found was not
# used. It also checked 'x' where it meant Z: with X homed it set a homed Z
# to 0 and then unhomed Z.
[gcode_macro CUT_FILAMENT]
description: Find the Y back stop, then cut the filament against the nub
variable_move_speed: 7800
# The cut stroke, mm/min: 600 = 10 mm/s (Harry, 2026-11-10; was 1200). The
# arm reset runs at twice this.
variable_cut_speed: 600
# X for the tap: right of the nub's zone. Not 200, the X stop itself: the Y
# tap also listens on the X axis, so rubbing the X stop could fire it early.
variable_stop_x: 199
# Y the tap starts from. At least 6 mm (the tap arm delay at the homing
# speed) in front of the stop, and clear of the nub's 13 mm.
variable_approach_y: 10
# A stop outside this window is refused, not cut against. Sloe's is at -6.
variable_stop_min: -9.5
variable_stop_max: -2
# Offsets from the measured stop, the entry and cut X, and the cut current.
# 15 mm out (Harry, 2026-11-10; was 10). 1.37 A is the most the TMC2241 takes
# here: its current range is fixed at startup from run_current (0.8 A ->
# range 1, max 1.370 A RMS), and SET_TMC_CURRENT refuses more (1.5 did, and
# stopped the cut before the stroke). The motors are rated 1.0 A.
variable_clear_dy: 15
variable_entry_x: 108
variable_entry_dy: 4
variable_cut_x: 131
variable_cut_dy: 1
variable_cut_current: 1.37
variable_reset_x: 109.5
# Above the plate and the wipe pad (5 mm tall, under X 80.5-119.5).
variable_min_z: 10
# The stop the last cut measured, in printer Y. Also saved as y_back_stop
# in save_variables, so its drift over time can be followed.
variable_last_stop_y: None
gcode:
    SAVE_GCODE_STATE NAME=CUT_FILAMENT_STATE
    {% set HA = printer.toolhead.homed_axes|default("") %}
    {% if not ('x' in HA and 'y' in HA) %}
        G28 X Y
    {% endif %}
    _CUT_FILAMENT_LIFT
    _CUT_FILAMENT_FIND_STOP
    _CUT_FILAMENT_CUT
    RESTORE_GCODE_STATE NAME=CUT_FILAMENT_STATE

# Each step is its own macro because a macro renders before it runs: the
# position, and what the tap found, are only current in the next macro.
[gcode_macro _CUT_FILAMENT_LIFT]
description: (CUT_FILAMENT) lift the nozzle clear of the plate and the wipe pad
gcode:
    {% set c = printer["gcode_macro CUT_FILAMENT"] %}
    {% set th = printer.toolhead %}
    {% if 'z' in th.homed_axes %}
        {% if th.position.z|float < c.min_z %}
            G90
            G1 Z{c.min_z} F600
        {% endif %}
    {% else %}
        # Unknown Z: lift 10 mm blind, stopping on a stall, as G28 does.
        SET_KINEMATIC_POSITION Z=100 SET_HOMED=Z
        AXIS_PROTECTED_MOVE AXIS=Z DIST=10
        SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
    {% endif %}

[gcode_macro _CUT_FILAMENT_FIND_STOP]
description: (CUT_FILAMENT) tap towards Y min, clear of the nub, to find the stop
gcode:
    {% set c = printer["gcode_macro CUT_FILAMENT"] %}
    {% set th = printer.toolhead %}
    {% if not ('x' in th.homed_axes and 'y' in th.homed_axes) %}
        {action_raise_error("CUT_FILAMENT: X and Y are not homed, so the cutter can't be found. Home X and Y, then cut again.")}
    {% endif %}
    G90
    # Near the back, go straight out in +Y before X moves: an X move there
    # could drag the arm across the nub. From approach_y on, the arm is clear.
    {% if th.position.y|float < c.approach_y %}
        G1 Y{c.approach_y} F{c.move_speed}
    {% endif %}
    G1 X{c.stop_x} Y{c.approach_y} F{c.move_speed}
    # At the homing current and speed, as a home: stops on the tap, or fails
    # at the axis minimum (_CUT_FILAMENT_CUT then refuses to cut).
    _HOMING_CURRENT
    AXIS_PROTECTED_MOVE AXIS=Y DIR=MIN DIST={c.approach_y - th.axis_minimum.y|float} SPEED={printer.configfile.settings.stepper_y.homing_speed}
    _HOMING_CURRENT RESTORE=1

[gcode_macro _CUT_FILAMENT_CUT]
description: (CUT_FILAMENT) the cut, from the stop _CUT_FILAMENT_FIND_STOP found
gcode:
    {% set c = printer["gcode_macro CUT_FILAMENT"] %}
    {% set r = printer.advanced_homing_movement.last %}
    {% if r.command != 'AXIS_PROTECTED_MOVE' or r.axis != 'y'
          or not r.triggered or r.position is none %}
        {action_raise_error("CUT_FILAMENT: no Y back stop found: the toolhead reached Y%.1f without a tap. Check the belt tension block, then cut again." % printer.toolhead.axis_minimum.y)}
    {% endif %}
    {% set s = r.position|float %}
    {% if s < c.stop_min or s > c.stop_max %}
        {action_raise_error("CUT_FILAMENT: the Y back stop is at %.2f, outside %.1f to %.1f, so the cut won't line up with the nub. Check the belt tension block (it may have moved), then cut again." % (s, c.stop_min, c.stop_max))}
    {% endif %}
    {action_respond_info("CUT_FILAMENT: Y back stop at %.2f" % s)}
    SET_GCODE_VARIABLE MACRO=CUT_FILAMENT VARIABLE=last_stop_y VALUE={s}
    SAVE_VARIABLE VARIABLE=y_back_stop VALUE={s|round(3)}
    G90
    G1 Y{(s + c.clear_dy)|round(3)} F{c.move_speed}
    G1 X{c.entry_x} F{c.move_speed}
    G1 Y{(s + c.entry_dy)|round(3)} F{c.move_speed}
    # The cut: slow, at high current for the force.
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={c.cut_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={c.cut_current}
    G1 X{c.cut_x} Y{(s + c.cut_dy)|round(3)} F{c.cut_speed}
    # The arm back into place (it has no spring): normal current, X back at
    # twice the cut speed, Y unchanged.
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer.configfile.settings['tmc2241 stepper_x'].run_current|float}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer.configfile.settings['tmc2241 stepper_y'].run_current|float}
    G1 X{c.reset_x} F{c.cut_speed * 2}
    # Away from the nub in Y only, before anything else moves X.
    G1 Y{c.approach_y} F{c.move_speed}
    PARK_PRINTER


[gcode_macro _FILAMENT_RUNOUT]
description: (filament switch) filament ran out mid-print: the print is paused, guide the swap
gcode:
  # A toolhead unplugged mid-print also reads as no filament; that is
  # TOOLHEAD_DISCONNECT's to handle, not a runout.
  {% if not printer['mcu toolhead'].non_critical_disconnected|default(False) %}
    # filament_switch_sensor sent a bare PAUSE; say why (m1_machine).
    MACHINE_PAUSE_REASON REASON=filament_out
    LED_WARNING
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Filament ran out"
    RESPOND TYPE=command MSG="action:prompt_text The print is paused. Unload what is left in the toolhead, insert new filament (it loads by itself), then resume."
    RESPOND TYPE=command MSG="action:prompt_footer_button Unload|_RUNOUT_UNLOAD|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Resume|RESUME"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|BED_PROMPT_CLOSE"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}


[gcode_macro _RUNOUT_UNLOAD]
description: (runout prompt) unload the filament tail at the print's own nozzle temperature
gcode:
  # PAUSE saved the print's hot-end target; UNLOAD_FILAMENT on its own would
  # heat to 250 C. It turns the hot end off afterwards, and RESUME puts the
  # saved target back.
  {% set saved = printer["gcode_macro PAUSE"].saved_hotend_target|float(0) %}
  RESPOND TYPE=command MSG="action:prompt_end"
  UNLOAD_FILAMENT TEMP={saved|int if saved > 0 else 220}
  RESPOND TYPE=command MSG="action:prompt_begin Insert new filament"
  RESPOND TYPE=command MSG="action:prompt_text Insert new filament into the toolhead; it loads by itself. Then resume."
  RESPOND TYPE=command MSG="action:prompt_footer_button Resume|RESUME|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|BED_PROMPT_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_show"


