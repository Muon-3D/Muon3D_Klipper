
#####################################################################
#   Position Macros
#####################################################################

[gcode_macro CENTER]
description: Moves the toolhead to the center
gcode:
    G28 X Y STOW=0
    {% set x_center = (printer.toolhead.axis_maximum.x|float + printer.toolhead.axis_minimum.x|float) / 2.0 %}
    {% set y_center = (printer.toolhead.axis_maximum.y|float + printer.toolhead.axis_minimum.y|float) / 2.0 %}
    G90
    G1 X{x_center} Y{y_center} F7800


[gcode_macro FRONT]
description: Moves the toolhead to the front
gcode:
    G28 X Y STOW=0
    {% set x_center = (printer.toolhead.axis_maximum.x|float + printer.toolhead.axis_minimum.x|float) / 2.0 %}
    {% set y_front = printer.toolhead.axis_maximum.y|float - 10 %}
    G90
    G1 X{x_center} Y{y_front} F7800



[gcode_macro Z_PARK]
description: Moves the toolhead to the top for stowing
# KAN-4684: the rise to the top ran at 10 mm/s whatever was known. With the
# plate height known to the contact guard (homed since the last bed removal,
# motor off, FORCE_MOVE or failed home) it runs at known_speed instead,
# never above [printer] max_z_velocity (15). 15 mm/s is what Z already does
# on every home (the 10 mm lift after the tap is G0 Z10 F7800, which
# max_z_velocity clamps to 15; the descent is 15) on the same driver and
# 0.8 A, so the step rate, back-EMF and bus current are ones the unit has run;
# max_z_accel (1000) is unchanged, so the torque peak at the start is too.
# Z_SPEED= (mm/min) still overrides. Unknown height: 10 mm/s, as before.
variable_known_speed: 15
gcode:

    {% set HA = printer.toolhead.homed_axes|default("") %}

    {% if 'z' in HA %}
        {% set known = printer.contact_guard.z_known|default(False)
                       if 'contact_guard' in printer else False %}
        {% set vmax = printer.configfile.settings.printer.max_z_velocity|default(10)|float %}
        {% set fast = [known_speed|float, vmax]|min * 60 %}
        ; Z is homed → safe absolute move
        SAVE_GCODE_STATE NAME=_z_move_150_state
        G90
        G0 Z140 F{params.Z_SPEED|default(fast if known else 600)|float}
        RESTORE_GCODE_STATE NAME=_z_move_150_state MOVE=0
    {% else %}
        ; Z not homed → use parking routine
        AXIS_HOME_MOVE AXIS=Z
    {% endif %}

# KAN-4683: the stow at the end of a Home All, with the head's park in the
# same move when that is safe. The planner runs one move at a time, so the
# only way for the head and the plate to travel together is one G0 with X, Y
# and Z (Klipper keeps Z at max_z_velocity and scales X and Y with it); an
# XY move queued after the rise waits for it, and nothing can change that.
# Safe because the move is the park the G28 made at Z10 until now, with the
# plate rising along it: the XY line is the same, and every point of it is at
# or above Z10, the height the cut and the wipe already move XY at (above
# the 5 mm wipe pad and the 8 mm notch), farther from the nozzle than the
# old park was. Only when the height is known, Z is above min_z, and there is
# a rise to make; otherwise the head parks first and the plate rises after,
# as before. Called by G28 after the Z home (it renders then, so the
# position and what the guard knows are current).
[gcode_macro Z_PARK_XY]
description: (G28) stow the bed with the head's park in one move when that is safe, else park, then stow
variable_min_z: 10
gcode:
    {% set th = printer.toolhead %}
    {% set HA = th.homed_axes|default("") %}
    {% set px = params.X|float %}
    {% set py = params.Y|float %}
    {% set feed = params.F|default(7800)|float %}
    {% set z = th.position.z|float %}
    {% set rise = 140.0 - z %}
    {% set known = printer.contact_guard.z_known|default(False)
                   if 'contact_guard' in printer else False %}
    {% if 'x' in HA and 'y' in HA and 'z' in HA and known
          and z >= min_z - 0.001 and rise > 1.0 %}
        {% set dx = px - th.position.x|float %}
        {% set dy = py - th.position.y|float %}
        {% set path = (dx * dx + dy * dy + rise * rise) ** 0.5 %}
        {% set vmax = printer.configfile.settings.printer.max_z_velocity|default(10)|float %}
        {% set vz = [printer['gcode_macro Z_PARK'].known_speed|float, vmax]|min %}
        # the path speed that makes Z run at vz, never above the park's own
        {% set pf = [vz * 60 * path / rise, feed]|min %}
        SAVE_GCODE_STATE NAME=_z_park_xy_state
        G90
        G0 X{px} Y{py} Z140 F{pf|round(1)}
        RESTORE_GCODE_STATE NAME=_z_park_xy_state MOVE=0
    {% else %}
        SAVE_GCODE_STATE NAME=_z_park_xy_state
        G90
        G0 X{px} Y{py} F{feed}
        RESTORE_GCODE_STATE NAME=_z_park_xy_state MOVE=0
        Z_PARK
    {% endif %}

[gcode_macro _STOW_IF_IDLE]
description: (end of a user operation) raise the bed to the stow position, unless a print is running or paused, Z is not homed, or the Z feed is not ready
gcode:
    # KAN-4298: the bed rests at the top after a user operation (filament
    # unload and load, ...). Never inside a print (running or paused: a
    # RESUME depends on where the head is) and never with Z unhomed: this
    # is a stow, not a home, so it does not run Z_PARK's unhomed parking.
    # Nor with the Z feed not ready (no plate, column unlocked, recovering,
    # faulted): the axis may be unpowered or loose while Z still reads homed.
    # Boards without z_power have no such gate.
    {% set ps = printer.print_stats.state|default("")|lower %}
    {% set in_job = ps in ["printing", "paused"]
                    or printer.pause_resume.is_paused|default(False) %}
    {% set sd_active = printer.virtual_sdcard.is_active|default(False)
                       if 'virtual_sdcard' in printer else False %}
    {% set z_ok = printer.z_power is not defined
                  or printer.z_power.state|default("") == "ready" %}
    # Klipper shut down: no G-code runs anyway; this is just explicit.
    {% set up = printer.webhooks.state|default("ready") == "ready"
                if 'webhooks' in printer else True %}
    # A PRINT_START typed at the console is not a print file, so print_stats
    # says nothing; its phase mark does.
    {% set starting = 'gcode_macro _PRINT_START_MARK' in printer
                      and printer["gcode_macro _PRINT_START_MARK"].phase|default("") != "" %}
    # A manual probe waiting for TESTZ/ACCEPT (BED_MESH_CALIBRATE METHOD=manual
    # returns as soon as it opens; each ACCEPT of a multi-point one starts the
    # next point before the stow runs): the nozzle is where the user put it.
    {% set probing = printer.manual_probe.is_active|default(False)
                     if 'manual_probe' in printer else False %}
    {% if 'z' in printer.toolhead.homed_axes|default("") and not in_job
          and not sd_active and z_ok and up and not starting
          and not probing %}
        Z_PARK
    {% endif %}

[gcode_macro _STOW_AFTER_PRINT_ERROR]
description: (a print file raised) raise the bed to the stow position, unless Z is not homed, the Z feed is not ready or Klipper is down
gcode:
    # KAN-4298: a print that fails ends with the bed wherever it was. Called
    # last by _ON_PRINT_ERROR, which runs while print_stats still says
    # "printing" and the file is still active (note_error comes after), so
    # the job gates of _STOW_IF_IDLE would always refuse; the failing print is
    # over, so they do not apply. CLEAR_PAUSE runs just before this, so the
    # pause check below never fires from _ON_PRINT_ERROR; it only guards a
    # caller that did not clear the pause.
    {% set z_ok = printer.z_power is not defined
                  or printer.z_power.state|default("") == "ready" %}
    {% set up = printer.webhooks.state|default("ready") == "ready"
                if 'webhooks' in printer else True %}
    {% if 'z' in printer.toolhead.homed_axes|default("")
          and not printer.pause_resume.is_paused|default(False)
          and z_ok and up %}
        Z_PARK
    {% endif %}

[gcode_macro PARK_PRINTER]
description: Moves the toolhead to end of print position - run after filament cut
gcode:
    {% set HA = printer.toolhead.homed_axes|default("") %}
    {% set z_homed = 'z' in HA %}
    
    Z_PARK

    {% if not ('x' in HA and 'y' in HA) %}
        G28 X Y STOW=0
    {% endif %}

    {% if not z_homed %}
        SET_KINEMATIC_POSITION SET_HOMED=Z Z=50
    {% endif %}

    G0 X135 Y63 F4800

    {% if not z_homed %}
        SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
    {% endif %}

    M18 #Motors off

# Rests the nozzle in the wipe pad to limit oozing, at the wipe's own place
# and depth ([nozzle_wipe_smart] x, y, z_top - plunge), reached the same way
# as the wipe: along approach_y, then straight in Y (the cutter nub is near).
# It was hard-coded to X100 Y14 Z3, the pad before 2026-11-10.
[gcode_macro ANTI_OOZE_NOZZLE_DOCK]
gcode:
    {% set w = printer.configfile.settings.nozzle_wipe_smart %}
    {% set via_y = [w.y, w.approach_y|default(w.y)]|max %}
    G90
    G0 Z{w.z_top + 1} F7800
    {% if printer.toolhead.position.y|float < via_y %}
        G0 Y{via_y} F7800
    {% endif %}
    G0 X{w.x} Y{via_y} F7800
    G0 Y{w.y} F7800
    G0 Z{(w.z_top - w.plunge)|round(3)} F200
