[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 90
variable_custom_park_y    : 170
variable_custom_park_dz   : 20.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : 90
variable_park_at_cancel_y : 90
gcode:

[respond]


[include homing.cfg]

[include position.cfg]

[include filament.cfg]

[include calibration.cfg]

[include print.cfg]

[include led.cfg]

[include fan.cfg]

[include display.cfg]

[include toolhead.cfg]

[include bed.cfg]

[include nozzle_wipe.cfg]


# KAN-115: debug.cfg is NOT included in the shipped configuration. It
# defines WEAR_TEST (a seven-day continuous Z cycle), BUZZ_EXTRUDER (drives
# the extruder against loaded filament) and TEST_SPEED (raises the velocity
# and accel limits and throws the toolhead corner to corner). Every one of
# those is a single G-code call away from mechanical damage on a customer
# machine, and none of them is needed to print.
#
# The file is still in the tree for bench use: add the include below to the
# dev-mode copy of core.cfg (POST /dev_mode clones this tree to
# /home/printer_data/devmode_custom_config), not here.
# [include debug.cfg]


