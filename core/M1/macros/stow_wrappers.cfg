#####################################################################
#   Stow wrappers (KAN-4298)
#####################################################################
# BED_MESH_CALIBRATE and SHAPER_CALIBRATE end with the bed at the top, when
# they run on their own and the printer is idle: _STOW_IF_IDLE refuses in a
# print or a PRINT_START. STOW=0 turns it off: PRINT_START's mesh
# (_BED_MESH_ENSURE) and FINETUNE_RESONANCE's two sweeps pass it. The same
# stow runs when they raise, so a failed calibration does not leave the bed
# down. In their own file so a config that stubs these commands (the klippy
# regression tests) can include calibration.cfg without them.

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
description: Perform Mesh Bed Leveling, then rest the bed at the top (STOW=0: not)
# travel_accel: the toolhead acceleration (mm/s^2) for the travel between
# mesh points, every mesh, PRINT_START's included. The previous limit comes
# back after the mesh, and also when it fails. 0 leaves the acceleration
# alone. Without it the travel ran at max_accel, 20000, at 400 mm/s: on
# otter (2026-11-24) a mesh lost X/Y steps, the next taps hit the plate at
# wrong heights and the jolt tripped the bed removal detector. 5000 costs
# no measurable time. The travel speed is [bed_mesh] speed in core.cfg.
variable_travel_accel: 5000
# The limit to restore, set while a mesh runs (0 otherwise).
variable_saved_accel: 0
on_error_gcode:
    _BED_MESH_RESTORE_ACCEL
    {% if params.STOW|default(1)|int(1) != 0 %}
        _STOW_IF_IDLE
    {% endif %}
gcode:
    {% set cap = printer["gcode_macro BED_MESH_CALIBRATE"].travel_accel|float(0) %}
    {% set accel = printer.toolhead.max_accel|float %}
    {% if cap > 0 and accel > cap %}
        SET_GCODE_VARIABLE MACRO=BED_MESH_CALIBRATE VARIABLE=saved_accel VALUE={accel}
        SET_VELOCITY_LIMIT ACCEL={cap}
    {% endif %}
    BED_MESH_CALIBRATE_BASE {rawparams}
    _BED_MESH_RESTORE_ACCEL
    {% if params.STOW|default(1)|int(1) != 0 %}
        _STOW_IF_IDLE
    {% endif %}

# Puts back the acceleration BED_MESH_CALIBRATE saved. A macro of its own,
# because on_error_gcode renders with the status its macro read when it
# started, where saved_accel was still 0: inline there, the restore never
# ran and a failed mesh left the printer at 5000 (otter, 2026-11-24).
[gcode_macro _BED_MESH_RESTORE_ACCEL]
gcode:
    {% set saved = printer["gcode_macro BED_MESH_CALIBRATE"].saved_accel|float(0) %}
    {% if saved > 0 %}
        SET_VELOCITY_LIMIT ACCEL={saved}
        SET_GCODE_VARIABLE MACRO=BED_MESH_CALIBRATE VARIABLE=saved_accel VALUE=0
    {% endif %}

[gcode_macro SHAPER_CALIBRATE]
rename_existing: SHAPER_CALIBRATE_BASE
description: Resonance test and input shaper calibration, then rest the bed at the top (STOW=0: not)
on_error_gcode:
    {% if params.STOW|default(1)|int(1) != 0 %}
        _STOW_IF_IDLE
    {% endif %}
gcode:
    SHAPER_CALIBRATE_BASE {rawparams}
    {% if params.STOW|default(1)|int(1) != 0 %}
        _STOW_IF_IDLE
    {% endif %}
