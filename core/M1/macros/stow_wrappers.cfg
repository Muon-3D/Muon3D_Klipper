#####################################################################
#   Stow wrappers (KAN-4298)
#####################################################################
# BED_MESH_CALIBRATE and SHAPER_CALIBRATE end with the bed at the top, when
# they run on their own and the printer is idle: _STOW_IF_IDLE refuses in a
# print or a PRINT_START. STOW=0 turns it off: PRINT_START's mesh
# (_BED_MESH_ENSURE) and FINETUNE_RESONANCE's two sweeps pass it. The same
# stow runs when they raise, so a failed calibration does not leave the bed
# down. In their own file so a config that stubs these commands (the klippy
# regression tests) can include calibration.cfg without them.

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
description: Perform Mesh Bed Leveling, then rest the bed at the top (STOW=0: not)
on_error_gcode:
    {% if params.STOW|default(1)|int(1) != 0 %}
        _STOW_IF_IDLE
    {% endif %}
gcode:
    BED_MESH_CALIBRATE_BASE {rawparams}
    {% if params.STOW|default(1)|int(1) != 0 %}
        _STOW_IF_IDLE
    {% endif %}

[gcode_macro SHAPER_CALIBRATE]
rename_existing: SHAPER_CALIBRATE_BASE
description: Resonance test and input shaper calibration, then rest the bed at the top (STOW=0: not)
on_error_gcode:
    {% if params.STOW|default(1)|int(1) != 0 %}
        _STOW_IF_IDLE
    {% endif %}
gcode:
    SHAPER_CALIBRATE_BASE {rawparams}
    {% if params.STOW|default(1)|int(1) != 0 %}
        _STOW_IF_IDLE
    {% endif %}
