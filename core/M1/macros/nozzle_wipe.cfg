[nozzle_wipe_smart]
# Blocking Python implementation. This registers NOZZLE_WIPE_SMART and
# NOZZLE_WIPE_SMART_STOP.

# The wipe pad (Harry, 2026-11-10: moved and smaller). Centre X100 Y7.5 in
# printer coordinates, wiped as a 5 x 5 mm square around it (sx, sy are the
# full sides, so +-2.5 mm), with the nozzle at Z3: z_top - plunge. It was
# X100 Y13.5, 9 x 2 mm, Z3.1.
x: 100.0
y: 7.5
z_top: 4.2
plunge: 1.2
sx: 5.0
sy: 5.0
# The nozzle reaches the pad from approach_y, straight down in Y at the pad's
# X. The cutter nub's no-go zone reaches about 6 mm in front of the Y back
# stop's position at X113 (13 mm from the stop), so a diagonal travel straight
# to Y7.5 would pass it by about 1 mm. At X100 the zone stops about 4 mm
# lower.
approach_y: 15.0
passes: 5
f_travel: 7800.0
# 200 (Harry, 2026-11-10). Was 2000, then 900: the faster wipe wore the pad.
f_wipe: 200.0
z_speed: 200.0
z_hop: 5.0

start_temp: 170.0
wipe_temp: 200.0
wipe_temp_tolerance: 5.0
# The anti-ooze temperature. The wipe keeps wiping until the nozzle is
# down to it, PRINT_START holds it while the nozzle is over the bed (the
# mesh), and m1_machine's pause cool-down defaults to fan_off_temp. One
# number for all of them (Harry, 2026-11-06: about 130 C). It was 160.
stop_temp: 130.0
fan_off_temp: 130.0
# Raw blower duty (M106.1) while the nozzle cools on the pad: 0.5 is about
# 23600 rpm (the [fan_modes] speed_table). It was 0.20 through M106, which
# the print mode's curve made about 10 % duty: the cool-down from 200 to
# 130 C took 93 s with no airflow to speak of (Harry, 2026-11-10).
fan_pct: 0.50

poll_ms: 1000
max_iter: 2000
